}

/* ---------- Donut chart ---------- */
function renderDonut(container, data, opts = {}) {
  container.innerHTML = '';
  if (!data.length) {
    container.innerHTML = `<div class="empty-state">${emptyStateIcon()}No data yet</div>`;
    return;
  }
  const size = opts.size || 200;
  const cx = size / 2, cy = size / 2, r = size / 2 - 14, stroke = opts.stroke || 22;
  const circumference = 2 * Math.PI * r;
  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size}`, width: '100%', style: `max-width:${size}px;display:block;margin:0 auto;animation:fadein 0.5s var(--ease);` });
  const circles = [];
  let offset = 0;
  data.forEach((d, i) => {
    const frac = d.pct / 100;
    const dash = frac * circumference;
    const color = d.color || PALETTE[i % PALETTE.length];
    const circle = svgEl('circle', {
      cx, cy, r,
      fill: 'none',
      stroke: color,
      'stroke-width': stroke,
      'stroke-dasharray': `${dash} ${circumference - dash}`,
      'stroke-dashoffset': -offset,
      'stroke-linecap': dash < circumference - 0.5 ? 'butt' : 'round'
    });
    circle.style.cursor = 'pointer';
    // Rotation lives in the CSS transform (not the SVG attribute) so the hover-zoom scale
    // below can be composed onto it rather than overwriting it — CSS transform replaces
    // any transform attribute wholesale, it doesn't merge with it.
    circle.style.transformOrigin = `${cx}px ${cy}px`;
    circle.style.transform = 'rotate(-90deg)';
    circle.style.transition = 'filter 0.15s ease, opacity 0.15s ease, transform 0.15s var(--ease,ease)';
    circles.push(circle);
    svg.appendChild(circle);
    offset += dash;
  });
  const holeR = r - stroke / 2 - 6;
  const total = data.reduce((s, d) => s + d.value, 0);
  const label = svgEl('text', { x: cx, y: cy - 4, 'text-anchor': 'middle', fill: 'var(--text)', 'font-size': '15', 'font-family': 'var(--font-mono)', 'font-weight': '600' });
  label.textContent = opts.centerLabel || fmtINR(total);
  const sub = svgEl('text', { x: cx, y: cy + 14, 'text-anchor': 'middle', fill: 'var(--text-dim)', 'font-size': '9.5', 'font-family': 'var(--font-body)', style: 'text-transform:uppercase;letter-spacing:0.08em;' });
  sub.textContent = opts.centerSub || 'Total';
  svg.appendChild(label);
  svg.appendChild(sub);
  container.appendChild(svg);

  const legendItems = [];
  if (opts.legend !== false) {
    const legend = document.createElement('div');
    legend.className = 'legend';
    data.forEach((d, i) => {
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `<span class="swatch" style="background:${d.color || PALETTE[i % PALETTE.length]}"></span>${d.label} — ${d.pct.toFixed(1)}%`;
      legendItems.push(item);
      legend.appendChild(item);
    });
    container.appendChild(legend);
  }

  // Coordinated highlighting: hovering a segment highlights its legend row and vice versa.
  function highlight(i, evt) {
    const d = data[i];
    circles[i].style.filter = 'brightness(1.2)';
    circles[i].style.transform = 'rotate(-90deg) scale(1.045)';
    circles.forEach((c, j) => { if (j !== i) c.style.opacity = '0.45'; });
    if (legendItems[i]) {
      legendItems[i].classList.add('active');
      legendItems.forEach((it, j) => { if (j !== i) it.style.opacity = '0.5'; });
    }
    if (evt) showChartTooltip(evt, `<strong>${escapeHTML(d.label)}</strong><br><span class="num">${fmtINR(d.value)} · ${d.pct.toFixed(1)}%</span>${opts.onSegmentClick ? '<br><span style="font-size:10px;opacity:0.7;">Click to view details</span>' : ''}`);
  }
  function resetHighlight() {
    circles.forEach(c => { c.style.filter = ''; c.style.opacity = ''; c.style.transform = 'rotate(-90deg)'; });
    legendItems.forEach(it => { it.classList.remove('active'); it.style.opacity = ''; });
    hideChartTooltip();
  }
  circles.forEach((circle, i) => {
    circle.addEventListener('mouseenter', (e) => highlight(i, e));
    circle.addEventListener('mousemove', (e) => moveChartTooltip(e));
    circle.addEventListener('mouseleave', resetHighlight);
    if (opts.onSegmentClick) {
      circle.style.cursor = 'pointer';
      circle.addEventListener('click', () => { hideChartTooltip(); opts.onSegmentClick(data[i]); });
    }
  });
  legendItems.forEach((item, i) => {
    item.addEventListener('mouseenter', (e) => highlight(i, e));
    item.addEventListener('mousemove', (e) => moveChartTooltip(e));
    item.addEventListener('mouseleave', resetHighlight);
    if (opts.onSegmentClick) {
      item.style.cursor = 'pointer';
      item.addEventListener('click', () => { hideChartTooltip(); opts.onSegmentClick(data[i]); });
    }
  });
}

/* ---------- Net worth trend line chart ---------- */
function renderTrendLine(container, snapshots) {
  container.innerHTML = '';
  if (!snapshots.length) {
    container.innerHTML = `<div class="empty-state">${emptyStateIcon()}<div class="big">No snapshots yet</div>Save a snapshot periodically (e.g. monthly) to build your net worth trend over time.</div>`;
    return;
  }
  const sorted = [...snapshots].sort((a, b) => new Date(a.date) - new Date(b.date));
  const trendSem = trendDirectionSemantic(sorted);
  const trendColor = semanticColorVar(trendSem);
  const width = 1000, height = 220, padL = 70, padR = 20, padT = 20, padB = 30;
  const values = sorted.map(s => s.netWorth);
  const minV = Math.min(0, ...values), maxV = Math.max(...values, 1);
  const xStep = (width - padL - padR) / Math.max(1, sorted.length - 1);
  const yScale = v => padT + (height - padT - padB) * (1 - (v - minV) / (maxV - minV || 1));

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, width: '100%', style: 'display:block;' });

  // gridlines + y labels
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const v = minV + (maxV - minV) * (i / steps);
    const y = yScale(v);
    svg.appendChild(svgEl('line', { x1: padL, x2: width - padR, y1: y, y2: y, stroke: 'var(--border-soft)', 'stroke-width': 1 }));
    const t = svgEl('text', { x: padL - 10, y: y + 4, fill: 'var(--text-dim)', 'font-size': 10, 'font-family': 'var(--font-mono)', 'text-anchor': 'end' });
    t.textContent = fmtINR(v);
    svg.appendChild(t);
  }

  // line path
  let path = '';
  sorted.forEach((s, i) => {
    const x = padL + i * xStep;
    const y = yScale(s.netWorth);
    path += (i === 0 ? 'M' : 'L') + x + ',' + y + ' ';
  });
  const linePath = svgEl('path', { d: path.trim(), fill: 'none', stroke: trendColor, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
  svg.appendChild(linePath);

  // area fill
  const areaPath = path.trim() + ` L${padL + (sorted.length - 1) * xStep},${yScale(minV)} L${padL},${yScale(minV)} Z`;
  const gradId = 'trend-grad-' + Math.random().toString(36).slice(2, 9);
  const defs = svgEl('defs', {});
  const grad = svgEl('linearGradient', { id: gradId, x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.appendChild(svgEl('stop', { offset: '0%', 'stop-color': trendColor, 'stop-opacity': 0.28 }));
  grad.appendChild(svgEl('stop', { offset: '100%', 'stop-color': trendColor, 'stop-opacity': 0 }));
  defs.appendChild(grad);
  svg.appendChild(defs);
  svg.appendChild(svgEl('path', { d: areaPath, fill: `url(#${gradId})` }));
  svg.appendChild(linePath); // re-append on top of the area fill

  // points + x labels (thin out labels if many)
  const labelEvery = Math.ceil(sorted.length / 6);
  sorted.forEach((s, i) => {
    const x = padL + i * xStep;
    const y = yScale(s.netWorth);
    const dot = svgEl('circle', { cx: x, cy: y, r: i === sorted.length - 1 ? 4 : 3, fill: trendColor });
    dot.style.cursor = 'pointer';
    dot.style.transition = 'r 0.15s ease';
    dot.addEventListener('mouseenter', (e) => {
      dot.setAttribute('r', '5.5');
      const label = s.periodLabel || fmtDate(s.date);
      showChartTooltip(e, `<strong>${escapeHTML(label)}</strong><br><span class="num">${fmtINR(s.netWorth)}</span>`);
    });
    dot.addEventListener('mousemove', (e) => moveChartTooltip(e));
    dot.addEventListener('mouseleave', () => { dot.setAttribute('r', i === sorted.length - 1 ? '4' : '3'); hideChartTooltip(); });
    svg.appendChild(dot);
    if (i % labelEvery === 0 || i === sorted.length - 1) {
      const t = svgEl('text', { x, y: height - 8, fill: 'var(--text-dim)', 'font-size': 9.5, 'font-family': 'var(--font-mono)', 'text-anchor': 'middle' });
      t.textContent = s.periodLabel || new Date(s.date).toLocaleDateString('en-IN', { month: 'short', year: '2-digit' });
      svg.appendChild(t);
    }
  });

  container.appendChild(svg);

  // Draw the line in like a pen tracing the ledger (guarded: falls back to a static line if unsupported)
  if (!prefersReducedMotion() && typeof linePath.getTotalLength === 'function') {
    try {
      const len = linePath.getTotalLength();
      linePath.style.strokeDasharray = String(len);
      linePath.style.strokeDashoffset = String(len);
      linePath.style.transition = 'stroke-dashoffset 1.1s ' + 'cubic-bezier(0.16, 1, 0.3, 1)';
      if (typeof requestAnimationFrame === 'function') {
        requestAnimationFrame(() => requestAnimationFrame(() => { linePath.style.strokeDashoffset = '0'; }));
      } else {
        linePath.style.strokeDashoffset = '0';
      }
    } catch (e) { /* getTotalLength unsupported in this environment — leave the line static */ }
  }
}

/* ===================== RENDER: DASHBOARD ===================== */
/* ---------- KPI change vs. previous snapshot: drives both color and the ▲/▼ text ----------
   invert=true means a decrease is the favorable direction (used for Liabilities, since paying
   down debt is good even though the number falls). */
function kpiChangeHTML(currentVal, prevVal, prevDate, invert) {
  if (prevVal === null || prevVal === undefined) {
    return { sem: 'neutral', text: 'No prior snapshot to compare' };
  }
  const delta = currentVal - prevVal;
  if (delta === 0) return { sem: 'neutral', text: 'No change since ' + fmtDate(prevDate) };
  const pct = prevVal !== 0 ? (Math.abs(delta) / Math.abs(prevVal)) * 100 : 100;
  const rising = delta > 0;
  const favorable = invert ? !rising : rising;
  const sem = favorable ? 'favorable' : 'adverse';
  const arrow = rising ? '▲' : '▼';
  return { sem, text: `${arrow} ${fmtINR(Math.abs(delta))} (${pct.toFixed(1)}%) since ${fmtDate(prevDate)}` };
}

/* ---------- Net Worth Change Attribution: splits the change between two snapshots into
   new investments/withdrawals, investment gains/losses, and liability changes.
   ΔAssets = netContributions + investmentGains, so ΔNetWorth = netContributions + investmentGains − ΔLiabilities. ---------- */
function netContributionsInRange(fromDateExclusive, toDateInclusive) {
  let total = 0;
  state.assets.forEach(a => {
    a.transactions.forEach(t => {
      if (t.date > fromDateExclusive && t.date <= toDateInclusive) {
        const amt = toBaseCurrency(t.amount || 0, a.currency);
        if (!Number.isFinite(amt)) return; // unconvertible FX — excluded, not silently 1:1
        const inflow = (t.type === 'buy' || t.type === 'contribution');
        total += inflow ? amt : -amt;
      }
    });
  });
  return total;
}
function netWorthAttribution(fromSnap, toSnap) {
  if (!fromSnap || !toSnap || fromSnap.date >= toSnap.date) return null;
  const deltaAssets = toSnap.totalAssets - fromSnap.totalAssets;
  const deltaLiab = toSnap.totalLiabilities - fromSnap.totalLiabilities;
  const netContrib = netContributionsInRange(fromSnap.date, toSnap.date);
  const investmentGain = deltaAssets - netContrib;
  const liabImpact = -deltaLiab;
  return {
    netContrib, investmentGain, liabImpact,
    totalChange: netContrib + investmentGain + liabImpact,
    fromDate: fromSnap.date, toDate: toSnap.date
  };
}

/* ---------- Attribution by transaction source (spec 4.2) ----------
   Splits netContributionsInRange()'s total further by Transaction.source (Phase 3 field;
   unset/legacy transactions default to 'Regular'). "Market Returns" itself is
   netWorthAttribution()'s existing investmentGain — this only breaks the contribution
   side down further, it doesn't change the total. */
function attributionBySource(fromDateExclusive, toDateInclusive) {
  const buckets = { Regular: 0, Inheritance: 0, 'Manual Adjustment': 0 };
  state.assets.forEach(a => {
    a.transactions.forEach(t => {
      if (t.date > fromDateExclusive && t.date <= toDateInclusive) {
        const amt = toBaseCurrency(t.amount || 0, a.currency);
        if (!Number.isFinite(amt)) return; // unconvertible FX — excluded, not silently 1:1
        const inflow = (t.type === 'buy' || t.type === 'contribution');
        const key = t.source && buckets.hasOwnProperty(t.source) ? t.source : 'Regular';
        buckets[key] += inflow ? amt : -amt;
      }
    });
  });
  return buckets;
}
/* Current total value of non-base-currency holdings (spec 4.2's "Currency Gains", scoped
   down to an exposure snapshot rather than a dated gain — see context doc §15 for why:
   exchangeRates has no history, so a true between-two-dates split isn't honestly
   computable with this data model). */
function foreignCurrencyExposure() {
  const total = totalAssets();
  const foreign = state.assets.filter(a => a.currency && a.currency !== state.settings.baseCurrency);
  const value = baseCurrencySum(foreign, a => assetCurrentValue(a));
  return { value, pct: total > 0 ? (value / total) * 100 : 0, count: foreign.length };
}

/* ---------- System Diagnostics — Health Check (spec 5.3) ----------
   Deliberately does NOT second-guess intentional choices the app already respects
   elsewhere (e.g. a genuinely interest-free cash loan, per spec 1.6's "allow logically
   valid zero values") — every check here flags something objectively missing/stale/
   inconsistent, not a judgment call about the user's financial decisions. */
function findDuplicateNames(items) {
  const byName = {};
  items.forEach(item => {
    const key = item.name.trim().toLowerCase();
    if (!key) return;
    (byName[key] = byName[key] || []).push(item);
  });
  return Object.values(byName).filter(group => group.length > 1);
}
const HEALTH_CHECK_MATURITY_CATEGORIES = ['Insurance', 'PPF', 'NPS'];
function healthCheckFindings() {
  const findings = [];
  const today = todayISO();
  const push = (sem, category, label, detail, target, group) => findings.push({ sem, category, label, detail, target: target || null, group: group || 'Data Quality' });

  state.assets.forEach(a => {
    const t = { kind: 'asset', id: a.id };
    if (a.hasUnits && (!a.currentPrice || a.currentPrice <= 0)) {
      push('caution', 'Missing Price', a.name, 'No current price set for a unit-tracked asset.', t, 'Assets');
    }
    if (a.hasUnits && a.currentPrice > 0 && a.lastUpdated && daysBetween(a.lastUpdated, today) > 90) {
      push('neutral', 'Stale Price', a.name, `Last updated ${fmtDate(a.lastUpdated)} (${Math.floor(daysBetween(a.lastUpdated, today))} days ago).`, t, 'Assets');
    }
    if (HEALTH_CHECK_MATURITY_CATEGORIES.includes(a.category) && !a.maturityDate) {
      push('neutral', 'Missing Maturity Date', a.name, `${a.category} holdings usually have a maturity date.`, t, 'Assets');
    }
    if (!a.nominee) {
      push('neutral', 'Missing Nominee', a.name, 'No nominee recorded for this holding.', t, 'Assets');
    }
    if (!a.transactions.length) {
      const hasValue = assetCurrentValue(a) > 0;
      push(hasValue ? 'caution' : 'adverse', 'No Activity Logged', a.name,
        hasValue ? 'Value is set but no transactions were ever logged — purchase date unknown.' : 'No transactions and no value set — likely an incomplete entry.', t, 'Assets');
    }
    if (assetCurrentValue(a) < 0) {
      push('adverse', 'Negative Balance', a.name, `Current value is negative (${fmtINR(assetCurrentValue(a))}).`, t, 'Assets');
    }
    if (a.currency && a.currency !== state.settings.baseCurrency) {
      const rate = state.settings.exchangeRates[a.currency];
      if (!Number.isFinite(rate) || rate <= 0) {
        push('adverse', 'Missing FX Rate', a.name, `No exchange rate set for ${a.currency} → ${state.settings.baseCurrency}. This holding is excluded from Net Worth and all totals until a rate is added in Settings.`, t, 'Assets');
      }
    }
  });

  upcomingPayments().filter(p => p.date < today).forEach(p => {
    push('adverse', 'Overdue', p.label, `${p.sub} overdue since ${fmtDate(p.date)}.`, p.kind && p.id ? { kind: p.kind, id: p.id } : null, 'Liabilities');
  });

  // ---- Liabilities checks (Item B: extend Health Check beyond Assets) ----
  state.creditCards.forEach(c => {
    const t = { kind: 'creditcard', id: c.id };
    if (!c.creditLimit) {
      push('neutral', 'Missing Credit Limit', c.name, 'No credit limit set — utilization can\'t be tracked for this card.', t, 'Liabilities');
    } else {
      const util = creditCardUtilization(c);
      if (util !== null && util >= 75) {
        push('adverse', 'High Utilization', c.name, `Utilization is ${util.toFixed(0)}% of the card's limit${linkedEMIOutstanding(c.id) > 0 ? ' (includes linked EMIs)' : ''}.`, t, 'Liabilities');
      }
    }
  });
  state.loans.forEach(l => {
    const t = { kind: 'loan', id: l.id };
    if (l.rate === null || l.rate === undefined || isNaN(l.rate)) {
      push('caution', 'Missing Interest Rate', l.name, 'No interest rate set for this loan/EMI.', t, 'Liabilities');
    }
    if (!l.tenureMonths) {
      push('caution', 'Missing Tenure', l.name, 'No tenure set — amortization schedule can\'t be generated.', t, 'Liabilities');
    }
    if (l.tenureMonths && l.principal) {
      const diff = loanActualBalance(l) - loanScheduledBalance(l);
      if (diff > l.principal * 0.05 && diff > 500) {
        push('caution', 'Behind Schedule', l.name, `Actual balance is ${fmtINR(diff)} higher than the amortization schedule expects — payments may be missing or late.`, t, 'Liabilities');
      }
    }
    if (l.linkedCardId && !state.creditCards.find(c => c.id === l.linkedCardId)) {
      push('neutral', 'Broken Card Link', l.name, 'Linked to a credit card that no longer exists.', t, 'Liabilities');
    }
    if (!l.debtClass) {
      push('neutral', 'Unclassified Debt', l.name, 'No debt class set — this won\'t be grouped correctly in Reports\' debt breakdown.', t, 'Liabilities');
    }
  });
  state.cashLoans.forEach(c => {
    if (c.rate === null || c.rate === undefined || isNaN(c.rate)) {
      push('neutral', 'Missing Interest Rate', c.name, 'No rate set — assumed interest-free. Set it explicitly if that\'s not the case.', { kind: 'cashloan', id: c.id }, 'Liabilities');
    }
  });
  const oneOffBills = state.bills.filter(b => b.recurring === 'none' && b.status !== 'paid');
  findDuplicateNames(oneOffBills.map(b => ({ name: b.name || b.category, id: b.id }))).forEach(group => {
    push('caution', 'Possible Duplicate Entry', group[0].name, `${group.length} one-off bills share this exact name — check the same payment wasn't logged twice.`, { kind: 'bill', id: group[0].id }, 'Liabilities');
  });

  findDuplicateNames(state.assets).forEach(group => {
    push('caution', 'Duplicate Name', group[0].name, `${group.length} assets share this exact name.`, { kind: 'asset', id: group[0].id }, 'Assets');
  });
  findDuplicateNames(state.loans).forEach(group => {
    push('caution', 'Duplicate Name', group[0].name, `${group.length} loans/EMIs share this exact name.`, { kind: 'loan', id: group[0].id }, 'Liabilities');
  });
  findDuplicateNames(state.creditCards).forEach(group => {
    push('caution', 'Duplicate Name', group[0].name, `${group.length} credit cards share this exact name.`, { kind: 'creditcard', id: group[0].id }, 'Liabilities');
  });
  findDuplicateNames(state.cashLoans).forEach(group => {
    push('caution', 'Duplicate Name', group[0].name, `${group.length} cash loans share this exact name.`, { kind: 'cashloan', id: group[0].id }, 'Liabilities');
  });

  const severityOrder = { adverse: 0, caution: 1, neutral: 2, favorable: 3 };
  return findings.sort((a, b) => severityOrder[a.sem] - severityOrder[b.sem]);
}

/* ---------- Wealth Alerts engine: dynamically surfaced, actionable, severity-ranked ---------- */
const NET_WORTH_MILESTONES = [100000, 500000, 1000000, 2500000, 5000000, 10000000, 25000000, 50000000, 100000000];
function crossedMilestone(prevVal, currVal) {
  if (prevVal === null || prevVal === undefined) return null;
  for (const m of NET_WORTH_MILESTONES) { if (prevVal < m && currVal >= m) return m; }
  return null;
}
function generateWealthAlerts() {
  const alerts = [];
  const today = todayISO();
  const payments = upcomingPayments();
  const overdue = payments.filter(p => p.date < today);
  const due3 = payments.filter(p => p.date >= today && daysBetween(today, p.date) <= 3);
  const due7 = payments.filter(p => p.date >= today && daysBetween(today, p.date) > 3 && daysBetween(today, p.date) <= 7);

  if (overdue.length) {
    alerts.push({ sem: 'adverse', title: `${overdue.length} payment${overdue.length > 1 ? 's' : ''} overdue`, detail: `${fmtINR(overdue.reduce((s, p) => s + p.amount, 0))} total — settle these as soon as you can.` });
  } else if (due3.length) {
    alerts.push({ sem: 'adverse', title: `${due3.length} payment${due3.length > 1 ? 's' : ''} due within 3 days`, detail: `${fmtINR(due3.reduce((s, p) => s + p.amount, 0))} total coming due very soon.` });
  } else if (due7.length) {
    alerts.push({ sem: 'caution', title: `${due7.length} payment${due7.length > 1 ? 's' : ''} due this week`, detail: `${fmtINR(due7.reduce((s, p) => s + p.amount, 0))} total due within 7 days.` });
  }

  const conc = concentrationRisk();
  if (conc && conc.pct >= 40) {
    const band = concentrationBand(conc.pct);
    alerts.push({ sem: band.sem, title: band.label, detail: `${conc.pct.toFixed(0)}% of assets are in ${conc.label}.` });
  }

  const maturingSoon = upcomingMaturities().filter(m => daysBetween(today, m.date) <= 30);
  if (maturingSoon.length) {
    alerts.push({ sem: 'neutral', title: `${maturingSoon.length} asset${maturingSoon.length > 1 ? 's' : ''} maturing within 30 days`, detail: `${maturingSoon.map(m => m.label).join(', ')} — decide whether to renew, reinvest, or withdraw.` });
  }

  state.creditCards.filter(c => c.creditLimit).forEach(c => {
    const util = creditCardUtilization(c);
    const band = creditUtilizationBand(util);
    if (band.sem === 'caution' || band.sem === 'adverse') {
      alerts.push({ sem: band.sem, title: `${c.name} utilization is ${util.toFixed(0)}%`, detail: `${band.label} — paying this down improves both cash flow and credit health.` });
    }
  });

  const dsr = debtServiceRatio();
  if (dsr !== null) {
    const dBand = dsrBand(dsr);
    if (dBand.sem === 'caution' || dBand.sem === 'adverse') {
      alerts.push({ sem: dBand.sem, title: dBand.label, detail: `Debt payments are ${dsr.toFixed(0)}% of your monthly income.` });
    }
  }

  const cov = liquidityCoverage(30);
  const liqBand = liquidityBand(cov.ratioPct);
  if (liqBand.sem === 'adverse' || liqBand.sem === 'caution') {
    alerts.push({ sem: liqBand.sem, title: liqBand.label, detail: `Liquid assets cover ${cov.ratioPct === null ? 'n/a' : cov.ratioPct.toFixed(0) + '%'} of what's due in the next 30 days.` });
  }

  const sortedSnaps = [...state.snapshots].sort((a, b) => new Date(a.date) - new Date(b.date));
  const prev = sortedSnaps.length ? sortedSnaps[sortedSnaps.length - 1] : null;
  if (prev) {
    const liabDelta = totalLiabilities() - prev.totalLiabilities;
    if (liabDelta < 0) {
      alerts.push({ sem: 'favorable', title: 'Liabilities are trending down', detail: `Down ${fmtINR(Math.abs(liabDelta))} since your last snapshot (${fmtDate(prev.date)}) — good progress on debt paydown.` });
    }
    const milestone = crossedMilestone(prev.netWorth, netWorth());
    if (milestone) {
      alerts.push({ sem: 'favorable', title: `Net worth crossed ${fmtINR(milestone)}`, detail: 'A milestone worth marking — keep it up.' });
    }
  } else {
    alerts.push({ sem: 'neutral', title: 'No snapshots saved yet', detail: 'Save a snapshot to start tracking net worth trend, attribution, and milestones.' });
  }

  const invested = overallInvested();
  const gainPct = invested > 0 ? ((totalAssets() - invested) / invested) * 100 : null;
  if (gainPct !== null && gainPct < -10) {
    alerts.push({ sem: 'adverse', title: 'Portfolio is in a loss position', detail: `Overall gain/loss is ${fmtPct(gainPct)} — may be worth reviewing underperforming holdings.` });
  }

  /* Health Check (spec 5.3) integration: one summarized entry, not one per finding —
     competes for space in the same capped list rather than flooding it. The detailed
     per-finding list lives in Settings > Health Check; this is just the link. */
  const hcFindings = healthCheckFindings().filter(f => f.sem === 'caution' || f.sem === 'adverse');
  if (hcFindings.length) {
    const worstSem = hcFindings.some(f => f.sem === 'adverse') ? 'adverse' : 'caution';
    alerts.push({
      sem: worstSem,
      title: `${hcFindings.length} data-quality issue${hcFindings.length > 1 ? 's' : ''} to review`,
      detail: 'Click to open Settings > Health Check.',
      onClick: 'openHealthCheck()'
    });
  }

  /* Goal/target-allocation onboarding nudge (Module 12 / L5): the feature already exists
     (Settings > Target Allocation, or a Purpose tag on assets) but nothing points a new user
     toward it — this is the exact "built but undiscovered" gap flagged in Phase 1 §7. Only
     shown once there's an actual portfolio worth allocating, so it doesn't nag an empty app. */
  if (state.assets.length >= 3 && goalAllocationRows().length === 0) {
    alerts.push({
      sem: 'neutral',
      title: 'Set a target allocation',
      detail: 'Tag assets with a Purpose, or set targets in Settings, to see goal progress and rebalancing guidance.',
      onClick: 'openGoalSetup()'
    });
  }

  const severityOrder = { adverse: 0, caution: 1, neutral: 2, favorable: 3 };
  alerts.sort((a, b) => severityOrder[a.sem] - severityOrder[b.sem]);
  return alerts;
}
function wealthAlertsHTML() {
  const allAlerts = generateWealthAlerts();
  if (!allAlerts.length) return `<div class="card empty-state">${emptyStateIcon()}Nothing needs your attention right now.</div>`;
  const { shown: alerts, overflowText } = topNWithOverflow(allAlerts, 6, 'alert');
  const rows = alerts.map(a => `
    <div class="flex-between" style="padding:13px 18px;border-bottom:1px solid var(--border-soft);border-left:3px solid ${semanticColorVar(a.sem)};background:linear-gradient(90deg, ${semanticDimColorVar(a.sem)}, transparent 40%);${a.onClick ? 'cursor:pointer;' : ''}" ${a.onClick ? `onclick="${a.onClick}"` : ''}>
      <div>
        <div style="font-size:13px;color:${semanticColorVar(a.sem)};font-weight:600;"><span style="display:inline-block;width:15px;">${semanticIcon(a.sem)}</span>${escapeHTML(a.title)}</div>
        <div class="jn" style="margin-top:3px;margin-left:15px;color:var(--text-muted);font-family:var(--font-body);">${escapeHTML(a.detail)}</div>
      </div>
    </div>`).join('');
  const overflowRow = overflowText ? `<div style="padding:10px 18px;text-align:center;" class="jn">${overflowText} not shown — lower priority than the ones above</div>` : '';
  return `<div class="card" style="padding:0;">${rows}${overflowRow}</div>`;
}

function attributionRowHTML(label, amount, maxAbs) {
  const sem = amount > 0 ? 'favorable' : (amount < 0 ? 'adverse' : 'neutral');
  const denom = (maxAbs && maxAbs > 0) ? maxAbs : Math.max(Math.abs(amount), 1);
  const widthPct = Math.min(100, (Math.abs(amount) / denom) * 100);
  return `<div style="padding:9px 0;border-bottom:1px solid var(--border-soft);">
    <div class="flex-between" style="margin-bottom:6px;">
      <span class="jn" style="font-family:var(--font-body);color:var(--text-muted);">${label}</span>
      <span class="num ${semanticClass(sem)}" style="font-weight:600;">${fmtINR(amount, { forceSign: true })}</span>
    </div>
    <div style="height:6px;border-radius:var(--radius-pill);background:var(--bg-alt);overflow:hidden;">
      <div style="height:100%;width:${widthPct}%;border-radius:var(--radius-pill);background:${semanticColorVar(sem)};transition:width 0.6s var(--ease);"></div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════
   SUNBURST CHART
   classes = [{ label, color, value, children:[{label,value,sub}] }]
   Renders into <svg id=svgId>, drilldown detail into <div id=detailId>
═══════════════════════════════════════════════════════════ */
function renderSunburst(svgId, detailId, classes) {
  const svg = document.getElementById(svgId);
  const detailEl = document.getElementById(detailId);
  if (!svg) return;
  const W = 220, H = 220, cx = W / 2, cy = H / 2;
  const INNER_R = 38, MID_R = 76, OUTER_R = 104;
  const GAP = 0.018;
  let zoomed = null;

  function polar(r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
  function arc(r1, r2, a1, a2) {
    const lg = (a2 - a1) > Math.PI ? 1 : 0;
    const [x1, y1] = polar(r1, a1), [x2, y2] = polar(r1, a2);
    const [x3, y3] = polar(r2, a2), [x4, y4] = polar(r2, a1);
    return `M${x1},${y1} A${r1},${r1} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${r2},${r2} 0 ${lg},0 ${x4},${y4}Z`;
  }
  function midAngle(a1, a2) { return (a1 + a2) / 2; }
  function svgN(tag, attrs) { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v)); return e; }

  function updateDetail(cl) {
    if (!cl || !cl.children.length) {
      const grandTotal = classes.reduce((s,c)=>s+c.value,0);
      const header = `<div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--border);">
        <div style="font-family:var(--font-display);font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;">Total</div>
        <div style="font-family:var(--font-mono);font-size:13px;color:var(--gold);font-weight:600;white-space:nowrap;">${fmtINR(grandTotal)}</div>
      </div>`;
      detailEl.innerHTML = header +
        classes.slice().sort((a,b)=>b.value-a.value).map(c => {
          const pct = grandTotal > 0 ? (c.value / grandTotal) * 100 : 0;
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border-soft);">
            <div style="font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:50%;background:${c.color};flex-shrink:0;"></span>${c.label}</div>
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--gold);margin-left:8px;white-space:nowrap;">${fmtINR(c.value)} <span style="color:var(--text-dim);">(${pct.toFixed(1)}%)</span></div>
          </div>`;
        }).join('');
      return;
    }
    const total = cl.children.reduce((s,c)=>s+c.value,0);

    detailEl.innerHTML = `<div style="font-family:var(--font-display);font-size:13px;color:var(--gold);margin-bottom:8px;">${cl.label}</div>` +
      cl.children.slice().sort((a,b)=>b.value-a.value).map(c=>`
        <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border-soft);">
          <div style="font-size:11px;color:var(--text-muted);">${c.label}${c.sub?`<div style="font-size:10px;color:var(--text-dim);">${c.sub}</div>`:''}</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--gold);margin-left:8px;">${fmtINR(c.value)}</div>
        </div>`).join('');
  }

  function draw(zClass) {
    svg.innerHTML = '';
    const total = classes.reduce((s,c)=>s+c.value,0);
    const shown = zClass ? classes.filter(c=>c.label===zClass) : classes;
    const shownTotal = shown.reduce((s,c)=>s+c.value,0);

    // Centre
    const cBg = svgN('circle',{cx,cy,r:INNER_R,fill:'var(--surface-alt)',stroke:'var(--border)','stroke-width':'1',style:'cursor:pointer;'});
    cBg.onclick = () => { zoomed=null; draw(null); updateDetail(null); };
    svg.appendChild(cBg);
    const cLbl = svgN('text',{x:cx,y:cy-4,'text-anchor':'middle',fill:'var(--text)','font-size':'9.5','font-family':'var(--font-mono)','font-weight':'600','pointer-events':'none'});
    cLbl.textContent = fmtINR(zClass ? shownTotal : total);
    const cSub = svgN('text',{x:cx,y:cy+9,'text-anchor':'middle',fill:'var(--text-dim)','font-size':'7.5','font-family':'var(--font-body)','text-transform':'uppercase','pointer-events':'none'});
    cSub.textContent = zClass ? zClass : 'Total';
    svg.appendChild(cLbl); svg.appendChild(cSub);

    // Hover-zoom: the hovered segment scales up slightly (from the chart's centre) and
    // brightens, while its sibling segments in the same ring dim, echoing the pop-out
    // hover treatment used on the reference donut. Segments share a common origin (cx,cy),
    // so scaling from that point makes the hovered wedge bulge outward without shifting layout.
    const segEls = [], hsegEls = [];
    const origin = `${cx}px ${cy}px`;
    function ringZoomIn(el, siblings) { el.style.transform = 'scale(1.045)'; siblings.forEach(s => { if (s !== el) s.style.opacity = (parseFloat(s.dataset.baseOpacity) * 0.55).toFixed(2); }); }
    function ringZoomOut(el, siblings) { el.style.transform = ''; siblings.forEach(s => { s.style.opacity = s.dataset.baseOpacity; }); }

    let ca = -Math.PI / 2;
    shown.forEach(cl => {
      const cFrac = cl.value / shownTotal;
      const cSpan = cFrac * 2 * Math.PI - (zClass ? 0 : GAP * 2);
      const cA1 = ca + (zClass ? 0 : GAP);
      const cA2 = cA1 + cSpan;

      // Inner ring (class) — only in overview
      if (!zClass) {
        const seg = svgN('path',{d:arc(INNER_R+3,MID_R-2,cA1,cA2),fill:cl.color,opacity:'0.88',stroke:'var(--bg)','stroke-width':'1.5',style:`cursor:pointer;transition:filter .12s,transform .15s var(--ease,ease),opacity .15s;transform-origin:${origin};`});
        seg.dataset.baseOpacity = '0.88';
        segEls.push(seg);
        seg.onmouseenter = e => { seg.style.filter='brightness(1.22)'; ringZoomIn(seg, segEls); showChartTooltip(e,`<strong>${escapeHTML(cl.label)}</strong><br>${fmtINR(cl.value)} · ${(cFrac*100).toFixed(1)}%<br><span style="font-size:10px;opacity:.7">Click to zoom in</span>`); };
        seg.onmousemove = moveChartTooltip;
        seg.onmouseleave = () => { seg.style.filter=''; ringZoomOut(seg, segEls); hideChartTooltip(); };
        seg.onclick = () => { zoomed=cl.label; draw(cl.label); updateDetail(cl); };
        svg.appendChild(seg);
        if (cSpan > 0.35) {
          const ma = midAngle(cA1,cA2), mp = polar((INNER_R+MID_R)/2+2, ma);
          const lt = svgN('text',{x:mp[0],y:mp[1]+3,'text-anchor':'middle',fill:'#fff','font-size':'7.5','font-weight':'600','pointer-events':'none'});
          lt.textContent = cl.label;
          svg.appendChild(lt);
        }
      }

      // Outer ring (holdings)
      let ha = cA1;
      const hTotal = cl.children.reduce((s,c)=>s+c.value,0) || 1;
      cl.children.forEach((h, hi) => {
        const hFrac = h.value / hTotal;
        const hSpan = hFrac * cSpan - GAP * 0.5;
        const hA1 = ha + GAP * 0.25;
        const hA2 = hA1 + hSpan;
        ha += hFrac * cSpan;
        const iR = zClass ? INNER_R+3 : MID_R+2;
        const oR = zClass ? OUTER_R+10 : OUTER_R;
        const alpha = (0.45 + (hi / Math.max(cl.children.length,1)) * 0.5).toFixed(2);
        const hseg = svgN('path',{d:arc(iR,oR,hA1,hA2),fill:cl.color,opacity:alpha,stroke:'var(--bg)','stroke-width':'1',style:`cursor:pointer;transition:filter .12s,opacity .15s,transform .15s var(--ease,ease);transform-origin:${origin};`});
        hseg.dataset.baseOpacity = alpha;
        hsegEls.push(hseg);
        hseg.onmouseenter = e => { hseg.style.filter='brightness(1.25)'; hseg.style.opacity='1'; ringZoomIn(hseg, hsegEls); showChartTooltip(e,`<strong>${escapeHTML(h.label)}</strong>${h.sub?`<br><span style="opacity:.7">${escapeHTML(h.sub)}</span>`:''}<br>${fmtINR(h.value)}<br>${(h.value/total*100).toFixed(1)}% of total`); };
        hseg.onmousemove = moveChartTooltip;
        hseg.onmouseleave = () => { hseg.style.filter=''; ringZoomOut(hseg, hsegEls); hideChartTooltip(); };
        hseg.onclick = () => { zoomed=cl.label; draw(cl.label); updateDetail(cl); };
        svg.appendChild(hseg);
        if (hSpan > 0.22 && zClass) {
          const ma = midAngle(hA1,hA2), mp = polar((iR+oR)/2, ma);
          const lt = svgN('text',{x:mp[0],y:mp[1]+3,'text-anchor':'middle',fill:'#fff','font-size':'7','pointer-events':'none'});
          lt.textContent = h.label.split(' ')[0];
          svg.appendChild(lt);
        }
      });
      ca += cFrac * 2 * Math.PI;
    });
  }
  draw(null);
  updateDetail(null);
}

/* ═══════════════════════════════════════════════════════════
   TREEMAP — Asset Allocation by Category
   Uses squarified layout. Zoom in on category click.
═══════════════════════════════════════════════════════════ */
let treemapZoomed = null;
function renderTreemap() {
  const svg = document.getElementById('asset-treemap');
  const bc = document.getElementById('treemap-breadcrumb');
  const drillDiv = document.getElementById('treemap-drill');
  const zoomBtn = document.getElementById('treemap-zoom-out');
  if (!svg) return;
  const W = 820, H = 320, PAD = 2;
  const tA = totalAssets();

  function squarify(items, x, y, w, h) {
    const rects = [];
    let rem = items.slice().sort((a,b)=>b.value-a.value);
    let rx=x,ry=y,rw=w,rh=h;
    while (rem.length) {
      const remTotal = rem.reduce((s,i)=>s+i.value,0);
      const horiz = rw >= rh;
      const fixDim = horiz ? rh : rw;
      let best=Infinity, row=[];
      for (let i=0;i<rem.length;i++) {
        const cand = rem.slice(0,i+1);
        const cTotal = cand.reduce((s,c)=>s+c.value,0);
        const mainLen = (cTotal/remTotal) * (horiz?rw:rh);
        let worst=0;
        cand.forEach(c => { const cLen=(c.value/cTotal)*fixDim; const ar=Math.max(mainLen/cLen,cLen/mainLen)||999; if(ar>worst)worst=ar; });
        if (worst<=best) { best=worst; row=cand; } else break;
      }
      const rowTotal = row.reduce((s,r)=>s+r.value,0);
      const mainLen = (rowTotal/remTotal)*(horiz?rw:rh);
      let off=0;
      row.forEach(item => {
        const frac=item.value/rowTotal;
        if(horiz) { rects.push({item,x:rx,y:ry+off,w:mainLen,h:fixDim*frac}); off+=fixDim*frac; }
        else { rects.push({item,x:rx+off,y:ry,w:fixDim*frac,h:mainLen}); off+=fixDim*frac; }
      });
      if(horiz){rx+=mainLen;rw-=mainLen;}else{ry+=mainLen;rh-=mainLen;}
      rem=rem.slice(row.length);
    }
    return rects;
  }

  function svgN(tag,a){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e;}

  function draw(zCat) {
    svg.innerHTML=''; drillDiv.innerHTML='';
    if (!zCat) {
      bc.innerHTML=`<span style="color:var(--gold);font-size:10px;font-family:var(--font-mono);">ALL CATEGORIES</span>`;
      if(zoomBtn)zoomBtn.style.display='none';
      const catData = state.categoriesAssets.map(cat => {
        const val = state.assets.filter(a=>a.category===cat).reduce((s,a)=>s+assetCurrentValue(a),0);
        return { label:cat, value:val, color:categoryColor(cat), assets:state.assets.filter(a=>a.category===cat) };
      }).filter(d=>d.value>0);
      if (!catData.length) { svg.innerHTML=''; return; }
      const catRects = squarify(catData,PAD,PAD,W-PAD*2,H-PAD*2);
      catRects.forEach(({item:cat,x,y,w,h}) => {
        const bg = svgN('rect',{x,y,width:w,height:h,fill:cat.color,opacity:'.1',rx:'3'});
        svg.appendChild(bg);
        // inner holdings
        const holdRects = squarify(cat.assets.map(a=>({label:a.name,value:assetCurrentValue(a),asset:a})),x+1,y+20,w-2,h-22);
        holdRects.forEach(({item:h,x:hx,y:hy,w:hw,h:hh})=>{
          if(hw<3||hh<3)return;
          const r=svgN('rect',{x:hx+1,y:hy+1,width:Math.max(0,hw-2),height:Math.max(0,hh-2),fill:cat.color,opacity:'.6',rx:'2',style:'cursor:pointer;transition:opacity .12s,filter .12s;'});
          r.onmouseenter=e=>{r.setAttribute('opacity','1');r.style.filter='brightness(1.2)';showChartTooltip(e,`<strong>${escapeHTML(h.label)}</strong><br>${fmtINR(h.value)}<br>${escapeHTML(cat.label)}<br>${(h.value/tA*100).toFixed(1)}% of portfolio`);};
          r.onmousemove=moveChartTooltip; r.onmouseleave=()=>{r.setAttribute('opacity','.6');r.style.filter='';hideChartTooltip();};
          svg.appendChild(r);
          if(hw>50&&hh>16){const lt=svgN('text',{x:hx+hw/2,y:hy+hh/2+4,'text-anchor':'middle','font-size':hw>90?'9':'7.5',fill:'#fff','pointer-events':'none'});lt.textContent=hw>100?h.label:h.label.split(' ')[0];svg.appendChild(lt);}
        });
        // category label bar (clickable)
        if(w>30&&h>20){const lt=svgN('text',{x:x+6,y:y+14,'font-size':'9','font-weight':'600','font-family':'var(--font-body)',fill:cat.color,'pointer-events':'none'});lt.textContent=cat.label.toUpperCase()+' · '+fmtINR(cat.value);svg.appendChild(lt);}
        const zone=svgN('rect',{x,y,width:w,height:18,fill:'transparent',style:'cursor:pointer;'});
        zone.onclick=()=>{treemapZoomed=cat.label;draw(cat.label);};
        svg.appendChild(zone);
      });
    } else {
      const cat = { label:zCat, color:categoryColor(zCat), assets:state.assets.filter(a=>a.category===zCat) };
      const catVal = cat.assets.reduce((s,a)=>s+assetCurrentValue(a),0);
      bc.innerHTML=`<span style="cursor:pointer;color:var(--text-dim);font-size:10px;font-family:var(--font-mono);" id="tm-root">ALL CATEGORIES</span><span style="color:var(--border-soft);margin:0 5px;font-size:10px;">›</span><span style="color:var(--gold);font-size:10px;font-family:var(--font-mono);">${zCat.toUpperCase()}</span>`;
      if(zoomBtn){zoomBtn.style.display='';zoomBtn.onclick=()=>{treemapZoomed=null;draw(null);};}
      document.getElementById('tm-root').onclick=()=>{treemapZoomed=null;draw(null);};
      const rects=squarify(cat.assets.map((a,i)=>({label:a.name,value:assetCurrentValue(a),asset:a,idx:i})),PAD,PAD,W-PAD*2,H-PAD*2);
      rects.forEach(({item:h,x,y,w,h:hh},i)=>{
        const alpha=(0.45+(i/Math.max(cat.assets.length,1))*0.5).toFixed(2);
        const r=svgN('rect',{x:x+1,y:y+1,width:Math.max(0,w-2),height:Math.max(0,hh-2),fill:cat.color,opacity:alpha,rx:'3',style:'cursor:pointer;transition:filter .12s;'});
        r.onmouseenter=e=>{r.style.filter='brightness(1.22)';r.setAttribute('opacity','1');showChartTooltip(e,`<strong>${escapeHTML(h.label)}</strong><br>${fmtINR(h.value)}<br>${(h.value/catVal*100).toFixed(1)}% of ${escapeHTML(zCat)}<br>${(h.value/tA*100).toFixed(1)}% of portfolio`);};
        r.onmousemove=moveChartTooltip;
        r.onmouseleave=()=>{r.style.filter='';r.setAttribute('opacity',alpha);hideChartTooltip();};
        r.onclick=()=>{
          hideChartTooltip();
          const xirr=assetXIRR(h.asset);
          drillDiv.innerHTML=`<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:5px;padding:14px 18px;display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin-top:4px;">
            <div><div style="font-family:var(--font-display);font-size:14px;color:var(--gold);">${h.label}</div><div style="font-size:11px;color:var(--text-dim);margin-top:2px;">${zCat}</div></div>
            <div style="display:flex;gap:24px;flex-wrap:wrap;margin-left:auto;">
              ${[['Value',fmtINR(h.value)],['Invested',fmtINR(assetInvested(h.asset))],['Gain',fmtINR(h.value-assetInvested(h.asset))],['XIRR',xirr!==null?fmtPct(xirr):'—'],['Portfolio Wt.',(h.value/tA*100).toFixed(1)+'%'],['Cat. Wt.',(h.value/catVal*100).toFixed(1)+'%']].map(([l,v])=>`<div style="text-align:right;"><div style="font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;">${l}</div><div style="font-family:var(--font-mono);font-size:12.5px;color:var(--text);">${v}</div></div>`).join('')}
            </div>
            <button onclick="this.closest('div').parentElement.remove()" style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;margin-left:auto;line-height:1;">✕</button>
          </div>`;

        if(w>130&&hh>36){const lv=svgN('text',{x:x+w/2,y:y+hh/2+10,'text-anchor':'middle','font-size':'9.5','font-family':'var(--font-mono)',fill:'rgba(255,255,255,.6)','pointer-events':'none'});lv.textContent=fmtINR(h.value);svg.appendChild(lv);}

/* ═══════════════════════════════════════════════════════════
   BAR RACE — Holdings ranked by value across snapshot history
═══════════════════════════════════════════════════════════ */
let _raceAnimId = null, _raceFrame = 0, _racePlaying = false;
function renderBarRace() {
  const svg = document.getElementById('holdings-race-svg');
  const periodLbl = document.getElementById('race-period-lbl');
  const playBtn = document.getElementById('race-play-btn');
  const pauseBtn = document.getElementById('race-pause-btn');
  const resetBtn = document.getElementById('race-reset-btn');
  const speedInp = document.getElementById('race-speed-inp');
  const speedLbl = document.getElementById('race-speed-lbl');
  if (!svg || !playBtn) return;

  const W=820, H=360, PAD={l:170,r:90,t:16,b:30};
  const plotW=W-PAD.l-PAD.r, plotH=H-PAD.t-PAD.b;
  const BAR_H=24, BAR_GAP=5, MAX_BARS=10;

  // Build frames from actual snapshots. Snapshots saved after this feature was added carry
  // assetBreakdown — a real per-holding value at that date. Older snapshots don't have it,
  // so those frames fall back to today's values as an approximation and are flagged as such
  // rather than silently passed off as historical.
  const snaps = [...state.snapshots].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const frames = snaps.map(snap => {
    if (snap.assetBreakdown && snap.assetBreakdown.length) {
      return {
        approx: false,
        bars: snap.assetBreakdown.map(a => ({ name:a.name, value:a.value, color:categoryColor(a.category), category:a.category })).filter(h=>h.value>0)
      };
    }
    return {
      approx: true,
      bars: state.assets.map(a => ({ name:a.name, value:assetCurrentValue(a), color:categoryColor(a.category), category:a.category })).filter(h=>h.value>0)
    };
  });

  // Fallback: if no snapshots, generate one frame from current state
  const useFrames = frames.length ? frames : [{ approx:true, bars: state.assets.map(a=>({name:a.name,value:assetCurrentValue(a),color:categoryColor(a.category),category:a.category})).filter(h=>h.value>0) }];
  const frameLabels = snaps.length ? snaps.map(s=>fmtDate(s.date)) : ['Current'];

  function svgN(tag,a){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e;}

  function drawFrame(fi, transition) {
    const frame = useFrames[Math.min(fi, useFrames.length-1)];
    const sorted = frame.bars.slice().sort((a,b)=>b.value-a.value).slice(0,MAX_BARS);
    const maxVal = sorted[0]?.value || 1;
    if(periodLbl) periodLbl.textContent = (frameLabels[Math.min(fi,frameLabels.length-1)] || '') + (frame.approx ? ' (approx.)' : '');
    svg.innerHTML='';

    // Gridlines
    for(let g=0;g<=4;g++){
      const gx=PAD.l+(g/4)*plotW;
      svg.appendChild(svgN('line',{x1:gx,x2:gx,y1:PAD.t,y2:PAD.t+plotH,stroke:'var(--border-soft)','stroke-width':'1'}));
      const gt=svgN('text',{x:gx,y:PAD.t+plotH+16,'text-anchor':'middle','font-size':'8.5','font-family':'var(--font-mono)',fill:'var(--text-dim)'});
      gt.textContent=fmtINR(maxVal*g/4);
      svg.appendChild(gt);
    }

    // Defs for gradients
    const defs=svgN('defs',{});svg.appendChild(defs);

    sorted.forEach((h,rank)=>{
      const bw=Math.max(4,(h.value/maxVal)*plotW);
      const by=PAD.t+rank*(BAR_H+BAR_GAP);
      const bx=PAD.l;

      // gradient
      const gid='rg'+rank;
      const grad=svgN('linearGradient',{id:gid,x1:'0%',y1:'0%',x2:'100%',y2:'0%'});
      [['0%',h.color+'DD'],['100%',h.color+'66']].forEach(([o,c])=>{const s=svgN('stop',{'offset':o,'stop-color':c});grad.appendChild(s);});
      defs.appendChild(grad);

      // track
      svg.appendChild(svgN('rect',{x:bx,y:by,width:plotW,height:BAR_H,fill:'var(--border-soft)',rx:'2'}));
      // bar
      const bar=svgN('rect',{x:bx,y:by,width:bw,height:BAR_H,fill:`url(#${gid})`,rx:'2'});
      if(transition) bar.style.transition=`width ${Math.max(200,700/parseInt(speedInp?.value||3))}ms cubic-bezier(.25,.46,.45,.94)`;
      svg.appendChild(bar);

      // rank badge
      const bdg=svgN('rect',{x:bx-30,y:by+4,width:24,height:BAR_H-8,fill:h.color,opacity:'.18',rx:'2'});svg.appendChild(bdg);
      const rkt=svgN('text',{x:bx-18,y:by+BAR_H/2+4,'text-anchor':'middle','font-size':'9','font-family':'var(--font-mono)',fill:h.color,'font-weight':'600'});rkt.textContent='#'+(rank+1);svg.appendChild(rkt);

      // name
      const nm=svgN('text',{x:bx-36,y:by+BAR_H/2+4,'text-anchor':'end','font-size':'10.5','font-family':'var(--font-body)',fill:'var(--text-muted)'});
      nm.textContent=h.name.length>17?h.name.slice(0,16)+'…':h.name;svg.appendChild(nm);

      // value
      const vt=svgN('text',{x:bx+bw+7,y:by+BAR_H/2+4,'text-anchor':'start','font-size':'9.5','font-family':'var(--font-mono)',fill:'var(--text-muted)'});
      vt.textContent=fmtINR(h.value);svg.appendChild(vt);

      // category dot
      svg.appendChild(svgN('circle',{cx:bx+bw-9,cy:by+BAR_H/2,r:'3.5',fill:h.color,opacity:'.8'}));
    });

    // Period watermark
    const wm=svgN('text',{x:PAD.l+plotW-6,y:PAD.t+plotH-8,'text-anchor':'end','font-size':'28','font-family':'var(--font-display)','font-weight':'600',fill:'var(--gold)',opacity:'.06'});
    wm.textContent=frameLabels[Math.min(fi,frameLabels.length-1)]||'';svg.appendChild(wm);

    if(useFrames.length<=1){
      const note=svgN('text',{x:PAD.l+plotW/2,y:PAD.t+plotH/2+4,'text-anchor':'middle','font-size':'11',fill:'var(--text-dim)','font-family':'var(--font-body)'});
      note.textContent='Save multiple snapshots to animate the race over time';
      svg.appendChild(note);
    } else if (frame.approx) {
      const note=svgN('text',{x:PAD.l+plotW/2,y:PAD.t+plotH-6,'text-anchor':'middle','font-size':'9.5',fill:'var(--text-dim)','font-family':'var(--font-body)',opacity:'.7'});
      note.textContent="Saved before per-holding history was tracked — showing today's values as an estimate for this date";
      svg.appendChild(note);
    }
  }

  function play(){
    if(_raceFrame>=useFrames.length-1) _raceFrame=0;
    _racePlaying=true; if(playBtn)playBtn.disabled=true; if(pauseBtn)pauseBtn.disabled=false;
    step();
  }
  function step(){
    drawFrame(_raceFrame,true); _raceFrame++;
    if(_raceFrame<useFrames.length){
      _raceAnimId=setTimeout(step,Math.max(300,900/parseInt(speedInp?.value||3)));
    } else { _racePlaying=false; if(playBtn)playBtn.disabled=false; if(pauseBtn)pauseBtn.disabled=true; }
  }
  function pause(){ clearTimeout(_raceAnimId); _racePlaying=false; if(playBtn)playBtn.disabled=false; if(pauseBtn)pauseBtn.disabled=true; }
  function reset(){ pause(); _raceFrame=0; drawFrame(0,false); }

  playBtn.onclick=play; pauseBtn.onclick=pause; resetBtn.onclick=reset;
  if(speedInp) speedInp.oninput=()=>{ if(speedLbl) speedLbl.textContent=speedInp.value+'×'; };

  drawFrame(0,false);
}

/* ═══════════════════════════════════════════════════════════
   PACKED CIRCLES — used in Attribution report
   Draws on a <canvas id> with physics settling
═══════════════════════════════════════════════════════════ */
function renderPackedCircles(canvasId, items, onClickFn) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const W = canvas.offsetWidth || 700;
  const H = parseInt(canvas.getAttribute('height')) || 340;
  canvas.width = W; canvas.height = H;
  if (!items.length) { const ctx=canvas.getContext('2d'); ctx.fillStyle='var(--text-dim)'; ctx.font='13px Inter,sans-serif'; ctx.textAlign='center'; ctx.fillText('No holdings to display',W/2,H/2); return; }

  const maxVal = Math.max(...items.map(i=>i.value));
  let circles = items.map(item => ({
    ...item,
    r: 14 + (item.value/maxVal)*48,
    x: W/2 + (Math.random()-.5)*W*.6,
    y: H/2 + (Math.random()-.5)*H*.6,
    vx:0, vy:0
  }));

  // settle
  for(let it=0;it<200;it++){
    circles.forEach(c=>{ c.vx+=(W/2-c.x)*.01; c.vy+=(H/2-c.y)*.01; });
    for(let i=0;i<circles.length;i++) for(let j=i+1;j<circles.length;j++){
      const a=circles[i],b=circles[j],dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.01,min=a.r+b.r+3;
      if(dist<min){const p=(min-dist)/dist*.5; a.vx-=dx*p; a.vy-=dy*p; b.vx+=dx*p; b.vy+=dy*p;}
    }
    circles.forEach(c=>{c.vx*=.8;c.vy*=.8;c.x+=c.vx;c.y+=c.vy;c.x=Math.max(c.r+2,Math.min(W-c.r-2,c.x));c.y=Math.max(c.r+2,Math.min(H-c.r-2,c.y));});
  }

  function draw(hovIdx){
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,W,H);
    circles.forEach((c,i)=>{
      const isHov=i===hovIdx;
      const grd=ctx.createRadialGradient(c.x,c.y,c.r*.25,c.x,c.y,c.r);
      grd.addColorStop(0,c.color+(isHov?'FF':'BB'));
      grd.addColorStop(1,c.color+'33');
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.fillStyle=grd; ctx.fill();
      ctx.strokeStyle=c.color+(isHov?'FF':'88'); ctx.lineWidth=isHov?2.5:1.5; ctx.stroke();
      if(c.r>22){
        ctx.fillStyle='rgba(255,255,255,.88)'; ctx.textAlign='center'; ctx.textBaseline='middle';
        const words=c.label.split(' ');
        ctx.font=`${Math.min(10,c.r*.28)}px Inter,sans-serif`;
        if(c.r>32&&words.length>1){ctx.fillText(words[0],c.x,c.y-7);ctx.fillText(words.slice(1).join(' '),c.x,c.y+7);}
        else ctx.fillText(words[0],c.x,c.y);
      }
    });
  }

  let hov=null;
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect(),mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);
    const found=circles.findIndex(c=>Math.hypot(c.x-mx,c.y-my)<c.r);
    if(found!==hov){hov=found;draw(hov);
      if(hov>=0){const c=circles[hov];showChartTooltip(e,`<strong>${escapeHTML(c.label)}</strong>${c.sub?`<br><span style="opacity:.7">${escapeHTML(c.sub)}</span>`:''}<br>${fmtINR(c.value)}<br>${c.pct?c.pct.toFixed(1)+'% of portfolio':''}<div style="font-size:10px;opacity:.6;margin-top:2px;">Click for details</div>`);}
      else hideChartTooltip();
    } else if(hov>=0) moveChartTooltip(e);
  };
  canvas.onmouseleave=()=>{hov=null;draw(-1);hideChartTooltip();};
  canvas.onclick=e=>{if(hov>=0&&onClickFn){hideChartTooltip();onClickFn(circles[hov]);}};
  canvas.style.cursor='pointer';
  draw(-1);
}

/* ---------- Debt-to-asset ratio bands: single source of truth for the gauge's colors,
   percentage, verdict text, and card accent — all four always stay in sync. ---------- */
function debtRatioBand(ratio) {
  if (ratio < 30) return { sem: 'favorable', label: 'Healthy — low leverage', from: 0, to: 30 };
  if (ratio < 50) return { sem: 'neutral', label: 'Moderate leverage', from: 30, to: 50 };
  if (ratio < 70) return { sem: 'caution', label: 'Caution — elevated leverage', from: 50, to: 70 };
  return { sem: 'adverse', label: 'High leverage', from: 70, to: 100 };
}

/* ---------- Generic semicircular gauge dial, shared by every Financial Health indicator ----------
   Takes a set of semantic bands (0–gaugeMax), a value to fill to, and a verdict — draws the
   band track, the value arc, the animated center label, the caption, and syncs the parent
   card's accent border, all in one place so every gauge in the app stays visually consistent. */
function renderGaugeDial(container, opts) {
  container.innerHTML = '';
  const gaugeMax = opts.gaugeMax || 100;
  const angleValue = Math.max(0, Math.min(gaugeMax, opts.fillValue));
  const progress = angleValue / gaugeMax;
  const activeColor = semanticColorVar(opts.activeSem);

  const size = 200, cx = size / 2, cy = size / 2 + 18, r = 76, trackW = 14;
  const svg = svgEl('svg', { viewBox: `0 0 ${size} ${size * 0.68}`, width: '100%', style: `max-width:${size}px;display:block;margin:0 auto;animation:fadein 0.5s var(--ease);` });

  opts.bands.forEach(b => {
    const startAngle = -90 + (b.from / gaugeMax) * 180;
    const endAngle = -90 + (b.to / gaugeMax) * 180;
    const arc = svgEl('path', { d: describeArc(cx, cy, r, startAngle, endAngle), fill: 'none', stroke: semanticColorVar(b.sem), 'stroke-width': trackW, opacity: 0.22, 'stroke-linecap': 'butt' });
    svg.appendChild(arc);
  });

  const valueArc = svgEl('path', {
    d: describeArc(cx, cy, r, -90, -90 + progress * 180),
    fill: 'none', stroke: activeColor, 'stroke-width': trackW, 'stroke-linecap': 'round'
  });
  svg.appendChild(valueArc);

  const label = svgEl('text', { x: cx, y: cy - 10, 'text-anchor': 'middle', class: 'gauge-label-big', fill: activeColor, 'font-size': opts.labelFontSize || 22 });
  label.textContent = opts.formatLabel ? opts.formatLabel(0) : '0';
  svg.appendChild(label);
  const sub = svgEl('text', { x: cx, y: cy + 10, 'text-anchor': 'middle', fill: 'var(--text-dim)', 'font-size': 9.5, 'font-family': 'var(--font-body)', style: 'text-transform:uppercase;letter-spacing:0.08em;' });
  sub.textContent = opts.subText || '';
  svg.appendChild(sub);

  container.appendChild(svg);

  const caption = document.createElement('div');
  caption.className = 'gauge-caption';
  caption.style.color = activeColor;
  caption.textContent = (opts.hasData !== false ? semanticIcon(opts.activeSem) + ' ' : '') + opts.verdictText;
  container.appendChild(caption);

  const card = container.closest('.card');
  if (card) {
    card.style.borderTopColor = opts.hasData !== false ? activeColor : '';
    card.style.borderTopWidth = opts.hasData !== false ? '3px' : '';
    card.style.background = opts.hasData !== false ? `linear-gradient(180deg, ${semanticDimColorVar(opts.activeSem)}, var(--surface) 55%)` : '';
  }

  const animTarget = opts.displayValue !== undefined ? opts.displayValue : angleValue;
  animateValue(0, animTarget, 800, v => { label.textContent = opts.formatLabel ? opts.formatLabel(v) : v.toFixed(1); });
}

/* ---------- Debt-to-Asset gauge ---------- */
function renderHealthGauge(container, totalA, totalL) {
  const ratio = totalA > 0 ? (totalL / totalA) * 100 : (totalL > 0 ? 100 : 0);
  const band = debtRatioBand(ratio);
  renderGaugeDial(container, {
    fillValue: ratio,
    displayValue: Math.min(ratio, 999),
    gaugeMax: 100,
    bands: [
      { from: 0, to: 30, sem: 'favorable' },
      { from: 30, to: 50, sem: 'neutral' },
      { from: 50, to: 70, sem: 'caution' },
      { from: 70, to: 100, sem: 'adverse' }
    ],
    activeSem: totalA > 0 ? band.sem : 'neutral',
    subText: totalA > 0 ? 'of assets owed' : 'no assets yet',
    verdictText: totalA <= 0 ? 'Add an asset to see this gauge' : band.label,
    hasData: totalA > 0,
    formatLabel: v => v.toFixed(1) + '%'
  });
}

/* ---------- Liquidity Coverage gauge: liquid assets vs. obligations due within 30 days ---------- */
function renderLiquidityGauge(container) {
  const cov = liquidityCoverage(30);
  const band = liquidityBand(cov.ratioPct);
  const hasData = cov.due > 0;
  const fillValue = cov.ratioPct === null ? 100 : Math.min(cov.ratioPct, 200);
  renderGaugeDial(container, {
    fillValue,
    displayValue: fillValue,
    gaugeMax: 200,
    bands: [
      { from: 0, to: 50, sem: 'adverse' },
      { from: 50, to: 100, sem: 'caution' },
      { from: 100, to: 150, sem: 'neutral' },
      { from: 150, to: 200, sem: 'favorable' }
    ],
    activeSem: band.sem,
    subText: hasData ? fmtINR(cov.due) + ' due in 30 days' : 'nothing due in 30 days',
    verdictText: band.label,
    hasData: true,
    formatLabel: v => (cov.ratioPct === null ? '—' : (v >= 200 ? '200%+' : v.toFixed(0) + '%'))
  });
}

/* ---------- Concentration Risk gauge: dominant single asset or category exposure ---------- */
function renderConcentrationGauge(container) {
  const c = concentrationRisk();
  const hasData = !!c;
  const pct = c ? c.pct : 0;
  const band = c ? concentrationBand(pct) : { sem: 'neutral', label: 'Add an asset to see this' };
  renderGaugeDial(container, {
    fillValue: pct,
    displayValue: pct,
    gaugeMax: 100,
    bands: [
      { from: 0, to: 25, sem: 'favorable' },
      { from: 25, to: 40, sem: 'neutral' },
      { from: 40, to: 100, sem: 'caution' }
    ],
    activeSem: hasData ? band.sem : 'neutral',
    subText: hasData ? `in ${c.label}` : 'no assets yet',
    verdictText: band.label,
    hasData,
    formatLabel: v => v.toFixed(1) + '%'
  });
}

/* ---------- Debt Service Ratio gauge (spec 3.4) ---------- */
function renderDSRGauge(container) {
  const dsr = debtServiceRatio();
  const hasData = dsr !== null;
  const band = dsrBand(dsr);
  const fillValue = hasData ? Math.min(dsr, 100) : 0;
  renderGaugeDial(container, {
    fillValue,
    displayValue: fillValue,
    gaugeMax: 100,
    bands: [
      { from: 0, to: 20, sem: 'favorable' },
      { from: 20, to: 36, sem: 'neutral' },
      { from: 36, to: 43, sem: 'caution' },
      { from: 43, to: 100, sem: 'adverse' }
    ],
    activeSem: hasData ? band.sem : 'neutral',
    subText: hasData ? fmtINR(monthlyDebtObligations()) + ' / month' : 'set monthly income in Settings',
    verdictText: band.label,
    hasData,
    formatLabel: v => (hasData ? (v >= 100 ? '100%+' : v.toFixed(1) + '%') : '—')
  });
}

/* ---------- Upcoming payment urgency ----------
   normal when distant, gold at 15 days out, orange at 7 days, red at 3 days or overdue. */
function paymentUrgencySemantic(daysUntil) {
  const t = state.settings.reminderThresholds;
  if (daysUntil <= t.adverse) return 'adverse';   // includes overdue (negative days)
  if (daysUntil <= t.caution) return 'caution';
  if (daysUntil <= t.neutral) return 'neutral';
  return null; // distant — no special color, reads as normal
}
function upcomingPaymentsHTML() {
  const items = upcomingPayments();
  if (!items.length) return `<div class="card empty-state">${emptyStateIcon()}No upcoming credit card bills or EMIs logged.</div>`;
  const today = todayISO();
  const rows = items.slice(0, 10).map((it, i) => {
    const overdue = it.date < today;
    const daysUntil = daysBetween(today, it.date);
    const sem = paymentUrgencySemantic(daysUntil);
    const color = sem ? semanticColorVar(sem) : null;
    const nearest = i === 0;
    return `
    <div class="flex-between" style="padding:13px 18px;border-bottom:1px solid var(--border-soft);${nearest && sem ? `background:${semanticDimColorVar(sem)};border-left:3px solid ${color};` : ''}">
      <div>
        <div style="font-size:13px;${nearest && color ? `color:${color};font-weight:600;` : ''}">${it.label}</div>
        <div class="jn" style="margin-top:2px;">${it.sub}</div>
      </div>
      <div style="text-align:right;">
        <div class="num" style="font-size:13.5px;${color ? `color:${color};` : ''}">${fmtINR(it.amount)}</div>
        <div class="jn" style="margin-top:2px;${color ? `color:${color};` : ''}">${overdue ? 'Overdue · ' : 'Due '}${fmtDate(it.date)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card" style="padding:0;">${rows}</div>`;
}

function upcomingMaturitiesHTML() {
  const items = upcomingMaturities();
  if (!items.length) return `<div class="card empty-state" style="padding:22px;">${emptyStateIcon()}No upcoming maturities set — add a Maturity Date to an FD, bond, insurance policy, or similar asset to track it here.</div>`;
  const rows = items.slice(0, 8).map(it => `

/* Goal-Based Allocation table (§2.3) — deviation severity is based on magnitude only, not
   direction: being significantly over- or under-target are both just "off target," neither
   is inherently the good or bad direction, so this doesn't reuse the favorable/adverse
   framing the way e.g. the KPI cards' Δ-vs-snapshot text does. */
function goalAllocationTableHTML() {
  const rows = goalAllocationRows();
  if (!rows.length) return `<div class="empty-state" style="padding:22px 10px;">${emptyStateIcon()}Set a Target Allocation % per purpose in Settings, or assign a Purpose to your assets, to see goal-based allocation here.</div>`;
  const body = rows.map(r => {
    const dev = Math.abs(r.deviationPct);
    const sem = dev < 3 ? 'neutral' : dev < 8 ? 'caution' : 'adverse';
    return `<tr>
      <td>${escapeHTML(r.purpose)}</td>
      <td class="num">${r.targetPct ? r.targetPct.toFixed(1) + '%' : '—'}</td>
      <td class="num">${r.actualPct.toFixed(1)}%</td>
      <td class="num ${semanticClass(sem)}">${fmtPct(r.deviationPct)}</td>
      <td class="num">${fmtINR(r.rebalanceAmount, { forceSign: true })}</td>
    </tr>`;
  }).join('');
  return `<div style="overflow-x:auto;"><table class="ledger"><thead><tr><th>Purpose</th><th class="num">Target</th><th class="num">Actual</th><th class="num">Deviation</th><th class="num">Rebalance</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

/* ---------- Intelligent Snapshot Management (spec 5.2) ---------- */
function isAutoSnapshotDue() {
  const cfg = state.settings.autoSnapshot;
  if (!cfg.enabled) return false;
  const sorted = [...state.snapshots].sort((a, b) => new Date(b.date) - new Date(a.date));
  const last = sorted[0];
  if (!last) return true; // enabled, but never snapshotted — take the first one now
  const intervalDays = { weekly: 7, monthly: 30, quarterly: 91 }[cfg.frequency] || 30;
  if (daysBetween(last.date, todayISO()) >= intervalDays) return true;
  if (cfg.eventThresholdPct && last.netWorth) {
    const pctChange = Math.abs((netWorth() - last.netWorth) / last.netWorth) * 100;
    if (pctChange >= cfg.eventThresholdPct) return true;
  }
  return false;
}
/* `silent` (spec 5.2, called from init() for auto-snapshots) skips the toast/re-render —
   the caller's own renderAll() picks up the new snapshot instead. Explicit boolean, not
   just "was this called with an argument": an onclick handler passed a bare function
   reference receives the click MouseEvent as its first argument, which is truthy, so
   every call site below passes `false`/`true` explicitly rather than relying on arity. */
async function saveSnapshot(silent) {
  const tA = totalAssets(), tL = totalLiabilities();
  const today = todayISO();
  const existingIdx = state.snapshots.findIndex(s => s.date === today);
  // assetBreakdown captures each holding's value at snapshot time (spec: Holdings Race chart
  // needs real per-asset history, not just the aggregate totals below — see renderBarRace()).
  const assetBreakdown = state.assets.map(a => ({ id: a.id, name: a.name, value: assetCurrentValue(a), category: a.category }));
  const snap = { id: uid(), date: today, totalAssets: tA, totalLiabilities: tL, netWorth: tA - tL, assetBreakdown };
  if (existingIdx >= 0) state.snapshots[existingIdx] = snap; else state.snapshots.push(snap);
  logAudit('create', 'Snapshot', fmtDate(today), silent === true ? 'Automatic' : 'Manual');
  await Storage.save(state);
  if (silent === true) return;
  showToast('Snapshot saved for ' + fmtDate(today));
  renderDashboard();
}

/* ---------- Backdated snapshots ----------
   Important caveat (surfaced in the modal copy too): this files TODAY's computed asset/
   liability totals under a date you choose — it does not reconstruct what those totals
   actually were back on that date. There's no stored daily price history to derive that
   from. What this genuinely fixes: if you're entering transactions late (e.g. logging a
   25 Jul purchase on 2 Aug), taking a backdated snapshot dated 25 Jul right after entering
   that transaction files the resulting totals under the date the change belongs to, so the
   Net Worth Trend / attribution split the change at the right point in time instead of
   dumping it all on today. It's only as accurate as how promptly you snapshot relative to
   when you enter each transaction. */
async function saveSnapshotForDate(dateStr) {
  const tA = totalAssets(), tL = totalLiabilities();
  const existingIdx = state.snapshots.findIndex(s => s.date === dateStr);
  const assetBreakdown = state.assets.map(a => ({ id: a.id, name: a.name, value: assetCurrentValue(a), category: a.category }));
  const snap = { id: uid(), date: dateStr, totalAssets: tA, totalLiabilities: tL, netWorth: tA - tL, assetBreakdown };
  if (existingIdx >= 0) state.snapshots[existingIdx] = snap; else state.snapshots.push(snap);
  logAudit('create', 'Snapshot', fmtDate(dateStr), 'Manual (backdated)');
  await Storage.save(state);
  showToast('Snapshot saved for ' + fmtDate(dateStr));
  renderDashboard();
}
function openBackdatedSnapshotModal() {
  const today = todayISO();
  openModal(`
    <h3>Save Snapshot for a Date</h3>
    <div class="modal-sub">Uses today's current asset and liability figures, but files them under the date you pick below — useful when you're entering past transactions and want the change to land on the right date in the trend chart, not on today.</div>
    <div class="field"><label>Snapshot Date</label><input type="date" id="f-snap-date" value="${today}" max="${today}" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Save Snapshot</button>
    </div>
  `, (modal) => {
    modal.querySelector('#f-cancel').onclick = closeModal;
    modal.querySelector('#f-save').onclick = async () => {
      const d = modal.querySelector('#f-snap-date').value;
      if (!d) { showToast('Pick a date'); return; }
      if (d > today) { showToast('Date cannot be in the future'); return; }
      const exists = state.snapshots.some(s => s.date === d);
      if (exists && !confirm('A snapshot already exists for ' + fmtDate(d) + '. Replace it?')) return;
      closeModal();
      await saveSnapshotForDate(d);
    };
  });
}

/* ===================== MODAL HELPER ===================== */
let modalReturnFocusEl = null;
function openModal(innerHTML, onMount) {
  modalReturnFocusEl = document.activeElement;
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">${innerHTML}</div></div>`;
  const backdrop = document.getElementById('modal-backdrop');
  const modalEl = root.querySelector('.modal');
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', escCloseHandler);
  document.addEventListener('keydown', modalFocusTrapHandler);
  if (onMount) onMount(modalEl);
  // Focus the first focusable element (or an explicit [data-autofocus]) so keyboard users land inside the dialog
  const first = modalEl.querySelector('[data-autofocus]') || modalEl.querySelector('input, select, textarea, button, [tabindex]:not([tabindex="-1"])');
  if (first) first.focus();
}
function escCloseHandler(e) { if (e.key === 'Escape') closeModal(); }
function modalFocusTrapHandler(e) {
  if (e.key !== 'Tab') return;
  const modalEl = document.querySelector('#modal-root .modal');
  if (!modalEl) return;
  const focusables = Array.from(modalEl.querySelectorAll('input, select, textarea, button, a[href], [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!focusables.length) return;
  const firstEl = focusables[0], lastEl = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
  else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
  document.removeEventListener('keydown', escCloseHandler);
  document.removeEventListener('keydown', modalFocusTrapHandler);
  if (modalReturnFocusEl && document.body.contains(modalReturnFocusEl)) modalReturnFocusEl.focus();
  modalReturnFocusEl = null;
  // Lets confirmModal() below resolve its promise on ANY dismissal path (Escape key,
  // backdrop click), not just its own button clicks — same semantics as native confirm()
  // returning false when the user dismisses it without choosing OK.
  if (modalOnClose) { const cb = modalOnClose; modalOnClose = null; cb(); }
}

/* ---------- In-app confirm modal — replaces window.confirm() for restore flows ----------
   Root cause of the Guardian GOLD-08 regression: native confirm()/alert()/prompt() dialogs
   are auto-dismissed by default in CDP-driven automated browsers (this is documented,
   explicit default behavior in Playwright, and the same class of behavior applies to any
   headless/scripted Chromium session that doesn't register an explicit dialog handler —
   see Playwright's own docs: "By default, dialogs are auto-dismissed by Playwright... If
   there is no listener for Page.dialog, all dialogs are automatically dismissed.").
   applyImport() and the encrypted-restore flow in openRestorePinModal() both used to gate
   the actual restore on `if (!confirm(...)) return;` — under automated testing with no
   dialog handler registered, that confirm() silently resolves to false, so the click on
   "Import" appears to succeed (no error, no console warning — DSL steps look executable)
   while mergeLoadedState()/Storage.save()/renderAll() never run and the app is silently
   left showing whatever was there before. This is a UI-layer bug, not a storage/encryption/
   race-condition bug — the storage layer, mergeLoadedState(), and load precedence were all
   already correct once actually reached. This helper replaces the two restore-path confirm()
   calls with the same in-app modal pattern already used for Erase All Data, so the outcome
   no longer depends on how (or whether) a browser/automation context handles native dialogs.
   Returns a Promise<boolean> — true only if the user (or a real click on the OK button)
   explicitly confirms; any other dismissal (Cancel, Escape, backdrop click) resolves false,
   matching native confirm()'s own semantics. */
let modalOnClose = null;
function confirmModal(title, message, confirmLabel) {
  return new Promise((resolve) => {
    let decided = false;
    modalOnClose = () => { if (!decided) { decided = true; resolve(false); } };
    openModal(`
      <h3>${title}</h3>
      <div class="modal-sub">${message}</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirm-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="confirm-modal-ok">${confirmLabel || 'Continue'}</button>
      </div>
    `, (modal) => {
      modal.querySelector('#confirm-modal-cancel').onclick = () => { decided = true; closeModal(); resolve(false); };
      modal.querySelector('#confirm-modal-ok').onclick = () => { decided = true; closeModal(); resolve(true); };
    });
  });
}

/* ===================== INLINE POPOVER HELPER (Module 6) =====================
   Lighter-weight than openModal — anchored to the button that triggered it, no
   dimmed backdrop, closes on outside click / Escape. For single/few-field edits
   (e.g. "Update Price") where a full-screen modal is more interruption than the
   task warrants. Uses the same focus-trap/focus-restore discipline as openModal
   so it isn't a keyboard-accessibility step backward relative to modals. */
let popoverReturnFocusEl = null;
function openPopover(anchorEl, innerHTML, onMount) {
  closePopover();
  popoverReturnFocusEl = document.activeElement;
  const root = document.getElementById('modal-root');
  const holder = document.createElement('div');
  holder.className = 'popover-backdrop';
  holder.id = 'popover-backdrop';
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-modal', 'true');
  pop.innerHTML = innerHTML;
  holder.appendChild(pop);
  root.appendChild(holder);

  const rect = anchorEl.getBoundingClientRect();
  const popW = 260;
  const estPopH = 190;
  let left = rect.left;
  if (left + popW > document.documentElement.clientWidth - 12) {
    left = document.documentElement.clientWidth - popW - 12;
  }
  pop.style.left = Math.max(12, left) + 'px';
  const spaceBelow = window.innerHeight - rect.bottom;
  if (spaceBelow < estPopH && rect.top > estPopH) {
    pop.style.top = (rect.top - estPopH - 8) + 'px';
  } else {
    pop.style.top = (rect.bottom + 8) + 'px';
  }

  holder.addEventListener('mousedown', (e) => { if (e.target === holder) closePopover(); });
  document.addEventListener('keydown', popoverEscHandler);
  document.addEventListener('keydown', popoverFocusTrapHandler);
  if (onMount) onMount(pop);
  const first = pop.querySelector('[data-autofocus]') || pop.querySelector('input, select, textarea, button, [tabindex]:not([tabindex="-1"])');
  if (first) first.focus();
  if (first && first.tagName === 'INPUT') first.select();
}
function popoverEscHandler(e) { if (e.key === 'Escape') closePopover(); }
function popoverFocusTrapHandler(e) {
  if (e.key !== 'Tab') return;
  const pop = document.querySelector('#popover-backdrop .popover');
  if (!pop) return;
  const focusables = Array.from(pop.querySelectorAll('input, select, textarea, button, a[href], [tabindex]:not([tabindex="-1"])'))
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!focusables.length) return;
  const firstEl = focusables[0], lastEl = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
  else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
}
function closePopover() {
  const holder = document.getElementById('popover-backdrop');
  if (holder) holder.remove();
  document.removeEventListener('keydown', popoverEscHandler);
  document.removeEventListener('keydown', popoverFocusTrapHandler);
  if (popoverReturnFocusEl && document.body.contains(popoverReturnFocusEl)) popoverReturnFocusEl.focus();
  popoverReturnFocusEl = null;
}

/* ---------- Shared: fill any one of {qty, price, amount} from the other two, tracking which two
   fields were most recently touched so it's always clear which is the "computed" one ---------- */
function wireTriFieldCalc(qtyEl, priceEl, amtEl) {
  let order = [];
  const fieldEl = { qty: qtyEl, price: priceEl, amount: amtEl };
  function nums() {
    return {
      qty: qtyEl.value === '' ? null : parseFloat(qtyEl.value),
      price: priceEl.value === '' ? null : parseFloat(priceEl.value),
      amount: amtEl.value === '' ? null : parseFloat(amtEl.value)
    };
  }
  function recalc(editedField) {
    order = [editedField, ...order.filter(f => f !== editedField)];
    const n = nums();
    const has = (f) => n[f] !== null && !isNaN(n[f]);
    const touchedWithValues = order.filter(has);
    if (touchedWithValues.length < 2) return;
    const sourceFields = touchedWithValues.slice(0, 2);
    const targetField = ['qty', 'price', 'amount'].find(f => !sourceFields.includes(f));
    if (!targetField) return;
    let result = null;
    if (targetField === 'amount') result = n.qty * n.price;
    else if (targetField === 'price') result = n.qty !== 0 ? n.amount / n.qty : null;
    else if (targetField === 'qty') result = n.price !== 0 ? n.amount / n.price : null;
    if (result === null || !isFinite(result)) return;
    fieldEl[targetField].value = targetField === 'qty' ? (Math.round(result * 1000) / 1000) : result.toFixed(2);
  }
  qtyEl.addEventListener('input', () => recalc('qty'));
  priceEl.addEventListener('input', () => recalc('price'));
  amtEl.addEventListener('input', () => recalc('amount'));
}

/* Category filter / sort-by / sort-direction live in state.settings.assetsViewPrefs

function assetSortValue(a, key) {
  switch (key) {

/* V6 — split out from renderAssets() so the search box can re-filter the table
