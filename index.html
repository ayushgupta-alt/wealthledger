    return;
  }

  const q = assetSearchQuery.trim().toLowerCase();
  const cats = assetSubtab === 'All' ? state.categoriesAssets : [assetSubtab];
  let rows = '';
  let anyMatched = false;
  cats.forEach(cat => {
    let assetsInCat = state.assets.filter(a => a.category === cat);
    if (!assetsInCat.length) return;
    if (q) assetsInCat = assetsInCat.filter(a => a.name.toLowerCase().includes(q));
    if (!assetsInCat.length) return;
    anyMatched = true;
    if (viewPrefs.sortBy !== 'none') {
      assetsInCat = assetsInCat.slice().sort((x, y) => {
        const vx = assetSortValue(x, viewPrefs.sortBy), vy = assetSortValue(y, viewPrefs.sortBy);
        if (typeof vx === 'string') return viewPrefs.sortDir === 'asc' ? vx.localeCompare(vy) : vy.localeCompare(vx);
        return viewPrefs.sortDir === 'asc' ? vx - vy : vy - vx;
      });
    }
    const catInvested = baseCurrencySum(assetsInCat, a => assetInvested(a));
    const catValue = baseCurrencySum(assetsInCat, a => assetCurrentValue(a));
    const catPct = totalA > 0 ? (catValue / totalA) * 100 : 0;
    const catGain = catValue - catInvested;
    const catGainPct = categoryGainPct(assetsInCat, catInvested, catValue);
    const catGainSem = catGainPct !== null ? returnSemantic(catGainPct, null) : (catGain > 0 ? 'favorable' : (catGain < 0 ? 'adverse' : 'neutral'));
    const catXirr = categoryXIRR(assetsInCat);
    const catYrs = categoryHoldingYears(assetsInCat);
    // Only show subtotal row (and the group expand/collapse control) when viewing All
    // (individual category tab is self-evident) and not mid-search.
    const showGroupToggle = assetSubtab === 'All' && !q;
    const isCollapsed = showGroupToggle && collapsedAssetCats.has(cat);
    if (showGroupToggle) {
      rows += `<tr class="subtotal">${assetSelectMode ? '<td></td>' : ''}<td colspan="2">
        <button class="cat-toggle-btn" data-cat-toggle="${escapeAttr(cat)}" title="${isCollapsed ? 'Expand' : 'Collapse'} ${escapeAttr(cat)}" style="width:19px;height:19px;padding:0;margin-right:var(--sp-2);font-size:var(--text-sm);line-height:1;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid var(--gold-soft);background:var(--gold-dim);color:var(--gold);cursor:pointer;vertical-align:middle;">${isCollapsed ? '+' : '−'}</button>
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${categoryColor(cat)};margin-right:7px;"></span>${cat}
      </td><td class="num">${fmtINR(catInvested)}</td><td class="num">${fmtINR(catValue)}</td><td class="num ${semanticClass(catGainSem)}">${fmtINR(catGain, { forceSign: true })}${catGainPct !== null ? ' (' + fmtPct(catGainPct) + ')' : ''}</td><td class="num">${returnCellHTML(catXirr, catYrs)}</td><td class="num">${catPct.toFixed(1)}%</td></tr>`;
    }
    if (!isCollapsed) {
      assetsInCat.forEach(a => {
        rows += assetRowHTML(a, totalA);
        if (openAssetIds.has(a.id)) rows += assetDetailRowHTML(a);
      });
    }
  });

  if (!rows) {
    wrap.innerHTML = q
      ? `<div class="card empty-state">${emptyStateIcon()}<div class="big">No holdings match “${escapeAttr(assetSearchQuery)}”</div>Try a different name, or <span style="color:var(--gold);cursor:pointer;" id="clear-asset-search">clear the search</span>.</div>`
      : `<div class="card empty-state">${emptyStateIcon()}<div class="big">No assets in this category</div><div style="margin-top:16px;"><button class="btn btn-primary" id="btn-add-asset-cat">+ Add Asset</button></div></div>`;
    const clearBtn = document.getElementById('clear-asset-search');
    if (clearBtn) clearBtn.onclick = () => { assetSearchQuery = ''; renderAssets(); };
    const addBtn = document.getElementById('btn-add-asset-cat');
    if (addBtn) addBtn.onclick = openAddAssetModal;
    return;
  }

  wrap.innerHTML = `
    ${assetSelectMode && selectedAssetIds.size > 0 ? `
    <div class="card" style="padding:10px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;background:var(--gold-dim);border-color:var(--gold-soft);">
      <span style="font-size:13px;color:var(--text);">${selectedAssetIds.size} selected</span>
      <div class="btn-row">
        <button class="btn btn-ghost btn-sm" id="btn-bulk-clear">Clear</button>
        <button class="btn btn-sm btn-danger" id="btn-bulk-delete" style="border-color:var(--red);">Delete Selected</button>
      </div>
    </div>` : ''}
    <div class="card" style="padding:0;">
      <div class="table-scroll">
      <table class="ledger">
        <thead><tr>
          ${assetSelectMode ? `<th style="width:36px;"><input type="checkbox" id="asset-select-all" ${state.assets.length && selectedAssetIds.size === state.assets.length ? 'checked' : ''} /></th>` : ''}
          <th>Name</th><th>Unit</th><th class="num">Invested</th><th class="num">Current Value</th>
          <th class="num">Gain / Loss</th><th class="num">XIRR</th><th class="num">Allocation</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>
    </div>
  `;

  state.assets.forEach(a => {
    const row = document.getElementById('asset-row-' + a.id);
    if (row) row.onclick = () => { toggleAssetDetail(a.id); };
  });
  wrap.querySelectorAll('[data-row-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      toggleAssetDetail(btn.dataset.rowToggle);
    };
  });
  wrap.querySelectorAll('[data-cat-toggle]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const cat = btn.dataset.catToggle;
      if (collapsedAssetCats.has(cat)) collapsedAssetCats.delete(cat); else collapsedAssetCats.add(cat);
      renderAssetsTableOnly();
    };
  });
  // Keep the toolbar's master "Expand All / Collapse All" label in sync whenever a single
  // category is toggled (or the table re-renders for any other reason) without rebuilding
  // the toolbar itself.
  const masterToggleBtn = document.getElementById('btn-toggle-all-groups');
  if (masterToggleBtn) {
    const catsNow = state.categoriesAssets.filter(c => state.assets.some(a2 => a2.category === c));
    const allCollapsed = catsNow.length > 0 && catsNow.every(c => collapsedAssetCats.has(c));
    masterToggleBtn.textContent = allCollapsed ? '+ Expand All' : '− Collapse All';
  }
  wireAssetDetailEvents();
  wireAssetQuickActions();
  if (assetSelectMode) {
    const selectAllCb = document.getElementById('asset-select-all');
    if (selectAllCb) selectAllCb.onclick = () => {
      if (selectAllCb.checked) state.assets.forEach(a => selectedAssetIds.add(a.id));
      else selectedAssetIds.clear();
      renderAssetsTableOnly();
    };
    wrap.querySelectorAll('[data-select-asset]').forEach(cb => {
      cb.onclick = (e) => {
        e.stopPropagation();
        const id = cb.dataset.selectAsset;
        if (cb.checked) selectedAssetIds.add(id); else selectedAssetIds.delete(id);
        renderAssetsTableOnly();
      };
    });
    const clearBtn2 = document.getElementById('btn-bulk-clear');
    if (clearBtn2) clearBtn2.onclick = () => { selectedAssetIds.clear(); renderAssetsTableOnly(); };
    const delBtn = document.getElementById('btn-bulk-delete');
    if (delBtn) delBtn.onclick = () => bulkDeleteAssets(Array.from(selectedAssetIds));
  }
}
/* Bulk delete (Module 12 / L2) — reuses the exact same per-item deletion (including the
   audit-log entry deleteAsset() already writes) rather than a separate code path, just
   wrapped in one confirmation instead of N. Scoped to delete only for now — the other
   plausible bulk action (price updates) already exists via the CSV-paste "Bulk Update
   Prices" flow, so it wasn't rebuilt here. */
async function bulkDeleteAssets(ids) {
  if (!ids.length) return;
  if (!confirm(`Delete ${ids.length} asset${ids.length !== 1 ? 's' : ''} and all their transactions? This cannot be undone.`)) return;
  const deletedNames = [];
  ids.forEach(id => {
    const asset = state.assets.find(a => a.id === id);
    if (asset) { deletedNames.push(asset.name); logAudit('delete', 'Asset', asset.name); }
    openAssetIds.delete(id);
  });
  state.assets = state.assets.filter(a => !ids.includes(a.id));
  selectedAssetIds.clear();
  assetSelectMode = false;
  await Storage.save(state);
  showToast(`${deletedNames.length} asset${deletedNames.length !== 1 ? 's' : ''} deleted`);
  renderAssets();
}

function assetRowHTML(a, totalA) {
  const qty = assetQty(a);
  const invested = assetInvested(a);
  const cv = assetCurrentValue(a);
  const gain = cv - invested;
  const gainPct = assetGainPct(a);
  const x = assetXIRR(a);
  const yrs = assetHoldingYears(a);
  const pct = totalA > 0 ? (cv / totalA) * 100 : 0;
  const gainSem = gainPct !== null ? returnSemantic(gainPct, null) : (gain > 0 ? 'favorable' : (gain < 0 ? 'adverse' : 'neutral'));
  const initials = a.name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  const isOpen = openAssetIds.has(a.id);
  return `
    <tr class="data-row" id="asset-row-${a.id}">
      ${assetSelectMode ? `<td style="width:36px;" onclick="event.stopPropagation();"><input type="checkbox" class="asset-select-cb" data-select-asset="${a.id}" ${selectedAssetIds.has(a.id) ? 'checked' : ''} /></td>` : ''}
      <td>
        <div class="row-name">
          <button class="row-toggle-btn" data-row-toggle="${a.id}" title="${isOpen ? 'Collapse' : 'Expand'} ${escapeAttr(a.name)}" style="width:19px;height:19px;padding:0;flex:none;font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-alt);color:var(--text-muted);cursor:pointer;">${isOpen ? '−' : '+'}</button>
          <span class="avatar-chip" style="color:${categoryColor(a.category)};border-color:${categoryColor(a.category)}55;">${initials}</span>
          <div>
            <div>${escapeHTML(a.name)}</div>
            <div class="jn" style="margin-top:2px;">${assetLiquidity(a)} · Risk ${assetRisk(a)} — ${riskLabel(assetRisk(a))}</div>
          </div>
        </div>
        <div class="btn-row" style="margin-top:7px;gap:5px;margin-left:69px;">
          <button class="btn btn-ghost btn-sm" data-quick-price="${a.id}" style="padding:2px 7px;font-size:10.5px;">${a.hasUnits ? 'Update Price' : 'Update Value'}</button>
          <button class="btn btn-ghost btn-sm" data-quick-tx="${a.id}" style="padding:2px 7px;font-size:10.5px;">+ Transaction</button>
        </div>
      </td>
      <td class="jn">${a.hasUnits ? fmtNum(qty, 3) + ' ' + (a.unitLabel || '') : '—'}</td>
      <td class="num">${fmtINR(invested)}</td>
      <td class="num">${fmtINR(cv)}</td>
      <td class="num ${semanticClass(gainSem)}">${fmtINR(gain, { forceSign: true })}${gainPct !== null ? ' (' + fmtPct(gainPct) + ')' : ''}</td>
      <td class="num">${returnCellHTML(x, yrs)}</td>
      <td class="num">${pct.toFixed(1)}%</td>
    </tr>
  `;
}

function toggleAssetDetail(id) {
  if (openAssetIds.has(id)) openAssetIds.delete(id); else openAssetIds.add(id);
  // V6.1: re-render only the table body, not the whole toolbar — expanding/collapsing a
  // single asset row has no effect on the subtabs, search box, or sort controls, and
  // rebuilding them was the root cause of the "jumps to top of page" glitch.
  renderAssetsTableOnly();
}

/* Compact "Details" panel shown above the transaction/ledger table in the expanded row —
   surfaces whichever of the new §2 fields are actually set (custodian/currency/price
   source/issuer/purpose/income/maturity/notes are omitted when blank so a simple asset
   doesn't show a wall of dashes); Liquidity/Risk always show since they always resolve to
   at least an inferred value. */
function assetDetailsExtraHTML(a) {
  const rows = [];
  if (a.custodian) rows.push(['Custodian', a.custodian]);
  if (a.currency && a.currency !== state.settings.baseCurrency) rows.push(['Currency', a.currency]);
  if (a.priceSource) rows.push(['Price Source', a.priceSource]);
  if (a.issuer) rows.push([assetIssuerLabel(a.category), a.issuer]);
  rows.push(['Liquidity', assetLiquidity(a) + (a.liquidity ? '' : ' (auto)')]);
  rows.push(['Risk', `${assetRisk(a)} — ${riskLabel(assetRisk(a))}` + (a.risk ? '' : ' (auto)')]);
  if (a.purpose) rows.push(['Purpose', a.purpose]);
  if (a.expectedIncome && a.expectedIncome.amount) rows.push(['Expected Income', `${fmtINR(a.expectedIncome.amount)} ${a.expectedIncome.type.toLowerCase()} (${a.expectedIncome.frequency})`]);
  if (a.maturityDate) rows.push(['Maturity Date', fmtDate(a.maturityDate)]);
  const potentialTax = assetPotentialTax(a);
  if (potentialTax !== null) rows.push(['Potential Tax (unrealized)', fmtINR(potentialTax)]);
  if (a.nominee) rows.push(['Nominee', a.nominee]);
  if (a.notes) rows.push(['Notes', a.notes]);
  return `<div class="jn" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px;margin-bottom:14px;padding:10px 12px;background:var(--bg-alt);border-radius:var(--radius);">
    ${rows.map(([label, value]) => `<div><span style="color:var(--text-dim);">${label}:</span> <span style="color:var(--text-muted);">${escapeHTML(value)}</span></div>`).join('')}
  </div>`;
}

function assetDetailRowHTML(a) {
  if (a.ledgerStyle) return ledgerAssetDetailRowHTML(a);
  const txRows = [...a.transactions].sort((x, y) => new Date(y.date) - new Date(x.date)).map((t, i, arr) => {
    const jn = 'JE-' + String(arr.length - i).padStart(3, '0');
    return `<tr>
      <td class="jn">${jn}</td>
      <td>${fmtDate(t.date)}</td>
      <td style="text-transform:capitalize;">${t.type}</td>
      <td class="num">${a.hasUnits && t.qty ? fmtNum(t.qty, 3) : '—'}</td>
      <td class="num">${a.hasUnits && t.price ? fmtINR(t.price, { decimals: 2 }) : '—'}</td>
      <td class="num">${fmtINR(t.amount)}</td>
      <td class="num">
        <button class="btn btn-ghost btn-sm" data-edit-tx="${a.id}|${t.id}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-del-tx="${a.id}|${t.id}">Delete</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <tr class="detail-row open"><td colspan="7">
    <div class="flex-between" style="margin-bottom:14px;">
      <div>
        <div style="font-family:var(--font-display);font-size:15px;">${escapeHTML(a.name)}</div>
        <div class="jn" style="margin-top:2px;">${escapeHTML(a.category)}${a.hasUnits ? ' · ' + (a.unitLabel || 'units') : ''}</div>
      </div>
      <div class="btn-row">
        ${a.hasUnits
          ? `<button class="btn btn-sm" data-update-price="${a.id}">Update Price</button>`
          : `<button class="btn btn-sm" data-update-value="${a.id}">Update Current Value</button>`}
        <button class="btn btn-sm" data-add-tx="${a.id}">+ Add Transaction</button>
        <button class="btn btn-sm" data-edit-asset="${a.id}">Edit Asset</button>
        <button class="btn btn-sm" data-save-template="${a.id}">Save as Template</button>
        <button class="btn btn-sm btn-danger" data-del-asset="${a.id}">Delete Asset</button>
      </div>
    </div>
    ${a.hasUnits ? `<div class="jn" style="margin-bottom:12px;color:var(--text-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>Current price: ${a.currentPrice ? fmtINR(a.currentPrice, { decimals: 2 }) : '—'} / ${a.unitLabel || 'unit'}${a.lastUpdated ? ' · updated ' + fmtDate(a.lastUpdated) : ''}</span>${a.livePriceMode && a.livePriceMode !== 'manual' ? `<span class="badge b-auto">Live</span><button class="btn btn-sm btn-ghost" data-refresh-price="${a.id}" title="Refresh this asset's price now">↻ Refresh</button>` : ''}</div>` : ''}
    ${assetDetailsExtraHTML(a)}
    ${a.transactions.length ? `
    <table class="ledger">
      <thead><tr><th>Entry</th><th>Date</th><th>Type</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th><th></th></tr></thead>
      <tbody>${txRows}</tbody>
    </table>
    ` : `<div class="empty-state">No transactions logged yet.</div>`}
  </td></tr>
  `;
}

/* Bank-statement style ledger for Savings-Account-like assets: date, description, debit, credit, running balance */
function ledgerRunningRows(a) {
  const sorted = [...a.transactions].sort((x, y) => new Date(x.date) - new Date(y.date) || (x.id < y.id ? -1 : 1));
  let bal = a.openingBalance || 0;
  return sorted.map(t => {
    const credit = t.type === 'contribution' ? (t.amount || 0) : 0;
    const debit = t.type === 'withdrawal' ? (t.amount || 0) : 0;
    bal += credit - debit;
    return { ...t, credit, debit, balance: bal };
  }).reverse();
}
function ledgerAssetDetailRowHTML(a) {
  const rows = ledgerRunningRows(a);
  const txRows = rows.map(t => `<tr>
      <td>${fmtDate(t.date)}</td>
      <td>${t.note ? escapeHTML(t.note) : (t.type === 'contribution' ? 'Deposit' : 'Withdrawal')}</td>
      <td class="num ${t.debit ? 'loss' : ''}">${t.debit ? fmtINR(t.debit) : '—'}</td>
      <td class="num ${t.credit ? 'gain' : ''}">${t.credit ? fmtINR(t.credit) : '—'}</td>
      <td class="num">${fmtINR(t.balance)}</td>
      <td class="num">
        <button class="btn btn-ghost btn-sm" data-edit-tx="${a.id}|${t.id}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-del-tx="${a.id}|${t.id}">Delete</button>
      </td>
    </tr>`).join('');
  return `
  <tr class="detail-row open"><td colspan="7">
    <div class="flex-between" style="margin-bottom:14px;">
      <div>
        <div style="font-family:var(--font-display);font-size:15px;">${escapeHTML(a.name)}</div>
        <div class="jn" style="margin-top:2px;">${escapeHTML(a.category)} · Bank-statement ledger · Opening balance ${fmtINR(a.openingBalance || 0)}</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" data-add-tx="${a.id}">+ Add Entry</button>
        <button class="btn btn-sm" data-edit-asset="${a.id}">Edit Asset</button>
        <button class="btn btn-sm" data-save-template="${a.id}">Save as Template</button>
        <button class="btn btn-sm btn-danger" data-del-asset="${a.id}">Delete Asset</button>
      </div>
    </div>
    ${assetDetailsExtraHTML(a)}
    ${a.transactions.length ? `
    <table class="ledger">
      <thead><tr><th>Date</th><th>Description</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Running Balance</th><th></th></tr></thead>
      <tbody>${txRows}</tbody>
    </table>
    ` : `<div class="empty-state">No entries logged yet.</div>`}
  </td></tr>
  `;
}

function wireAssetDetailEvents() {
  document.querySelectorAll('[data-add-tx]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openAddTransactionModal(b.dataset.addTx); });
  document.querySelectorAll('[data-update-price]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openUpdatePriceModal(b.dataset.updatePrice); });
  document.querySelectorAll('[data-update-value]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openUpdateValueModal(b.dataset.updateValue); });
  document.querySelectorAll('[data-refresh-price]').forEach(b => b.onclick = (e) => { e.stopPropagation(); refreshSingleAssetPrice(b.dataset.refreshPrice); });
  document.querySelectorAll('[data-edit-asset]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEditAssetModal(b.dataset.editAsset); });
  document.querySelectorAll('[data-save-template]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const asset = state.assets.find(a => a.id === b.dataset.saveTemplate);
    if (asset) saveAssetAsTemplate(asset);
  });
  document.querySelectorAll('[data-del-asset]').forEach(b => b.onclick = (e) => { e.stopPropagation(); deleteAsset(b.dataset.delAsset); });
  document.querySelectorAll('[data-edit-tx]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const [aid, tid] = b.dataset.editTx.split('|');
    const asset = state.assets.find(a => a.id === aid);
    if (asset && asset.ledgerStyle) openEditLedgerEntryModal(aid, tid);
    else openEditTransactionModal(aid, tid);
  });
  document.querySelectorAll('[data-del-tx]').forEach(b => b.onclick = (e) => { e.stopPropagation(); const [aid, tid] = b.dataset.delTx.split('|'); deleteTransaction(aid, tid); });
}

/* Quick actions on the collapsed row itself (spec 1.5) — Update Price/Value and + Transaction
   without expanding the row first. Update Price/Value now opens as an inline popover
   anchored to the button (Module 6) instead of a full modal — it's a 1-2 field edit, so a
   popover matches the task's weight; + Transaction still opens the full modal since logging
   a transaction has more fields and deserves the room. */
function wireAssetQuickActions() {
  document.querySelectorAll('[data-quick-price]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const asset = state.assets.find(a => a.id === b.dataset.quickPrice);
    if (!asset) return;
    if (asset.hasUnits) openUpdatePricePopover(asset.id, b); else openUpdateValuePopover(asset.id, b);
  });
  document.querySelectorAll('[data-quick-tx]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const asset = state.assets.find(a => a.id === b.dataset.quickTx);
    if (!asset) return;
    if (asset.ledgerStyle) openAddLedgerEntryModal(asset.id); else openAddTransactionModal(asset.id);
  });
}

/* ===================== ASSET MODALS & ACTIONS ===================== */

const UNIT_LABEL_OPTIONS = ['shares', 'units', 'grams', 'kilograms', 'ounces', 'sq. ft.', 'bonds', 'lots'];
function unitLabelSelectValue(existingLabel) {
  if (!existingLabel) return { select: 'units', other: '' };
  const match = UNIT_LABEL_OPTIONS.find(u => u.toLowerCase() === existingLabel.trim().toLowerCase());
  return match ? { select: match, other: '' } : { select: 'Other', other: existingLabel };
}

/* ---------- Optional master-data-backed field (Custodian / Price Source / Purpose) ----------
   Same "pick from list, or type a new one" pattern as Unit Label above, but for fields
   that are genuinely optional (default "— None —", not a fallback value) and that write
   any newly-typed value back into the matching Settings master list on save — the form
   never requires a trip to Settings first. */
function masterFieldSelectValue(list, existingValue) {
  if (!existingValue) return { select: '', other: '' };
  const match = list.find(v => v.toLowerCase() === existingValue.trim().toLowerCase());
  return match ? { select: match, other: '' } : { select: 'Other', other: existingValue };
}
function optionalMasterFieldHTML(fieldId, list, existingValue, label) {
  const sel = masterFieldSelectValue(list, existingValue);
  return `
    <div class="field">
      <label>${label}</label>
      <select id="${fieldId}-select">
        <option value="">— None —</option>
        ${list.map(v => `<option value="${escapeAttr(v)}" ${sel.select === v ? 'selected' : ''}>${v}</option>`).join('')}
        <option value="Other" ${sel.select === 'Other' ? 'selected' : ''}>Other (add new)</option>
      </select>
      <input id="${fieldId}-other" placeholder="Type a new ${label.toLowerCase()}" value="${escapeAttr(sel.other)}" style="margin-top:6px;display:${sel.select === 'Other' ? '' : 'none'};" />
    </div>`;
}
function wireOptionalMasterField(modal, fieldId) {
  const select = modal.querySelector(`#${fieldId}-select`);
  const other = modal.querySelector(`#${fieldId}-other`);
  select.onchange = () => { other.style.display = select.value === 'Other' ? '' : 'none'; };
}
function optionalMasterFieldValue(modal, fieldId) {
  const select = modal.querySelector(`#${fieldId}-select`);
  if (select.value === 'Other') return modal.querySelector(`#${fieldId}-other`).value.trim() || null;
  return select.value || null;
}
function setOptionalMasterFieldValue(modal, fieldId, value, list) {
  const select = modal.querySelector(`#${fieldId}-select`);
  const other = modal.querySelector(`#${fieldId}-other`);
  const sel = masterFieldSelectValue(list, value);
  select.value = sel.select;
  other.value = sel.other;
  other.style.display = sel.select === 'Other' ? '' : 'none';
}
function ensureInMasterList(listKey, value) {

/* ---------- Asset Templates: reusable structural presets (§2.1) ----------
   Captures only the "what kind of holding is this" fields — never name/amounts, which
   are always instance-specific. Created from the Asset detail panel, applied from the
   "Start from Template" picker at the top of the Add Asset modal. */
async function saveAssetAsTemplate(asset) {
  const name = (prompt('Template name:', asset.category + ' template') || '').trim();
  if (!name) return;
  const template = {
    id: uid(), name,
    category: asset.category, hasUnits: asset.hasUnits, unitLabel: asset.unitLabel, ledgerStyle: asset.ledgerStyle,
    custodian: asset.custodian || null, currency: asset.currency || state.settings.baseCurrency, priceSource: asset.priceSource || null,
    liquidity: asset.liquidity || null, risk: asset.risk || null, purpose: asset.purpose || null, issuer: asset.issuer || null
  };
  state.assetTemplates.push(template);
  await Storage.save(state);
  showToast('Saved as template: ' + template.name);
}
function applyAssetTemplateToForm(modal, template, syncRows) {
  modal.querySelector('#f-category').value = template.category;
  modal.querySelector('#f-has-units').checked = template.hasUnits;
  const unitSel = unitLabelSelectValue(template.unitLabel);
  modal.querySelector('#f-unit-label-select').value = unitSel.select;
  modal.querySelector('#f-unit-label-other').value = unitSel.other;
  modal.querySelector('#unit-label-other-row').style.display = unitSel.select === 'Other' ? '' : 'none';
  modal.querySelector('#f-ledger-style').checked = !!template.ledgerStyle;
  setOptionalMasterFieldValue(modal, 'f-custodian', template.custodian, state.settings.custodians);
  modal.querySelector('#f-currency').value = template.currency || state.settings.baseCurrency;
  setOptionalMasterFieldValue(modal, 'f-price-source', template.priceSource, state.settings.priceSources);
  modal.querySelector('#f-issuer').value = template.issuer || '';
  modal.querySelector('#f-issuer-label').textContent = assetIssuerLabel(template.category);
  modal.querySelector('#f-liquidity').value = template.liquidity || '';
  modal.querySelector('#f-risk').value = template.risk || '';
  setOptionalMasterFieldValue(modal, 'f-purpose', template.purpose, state.settings.purposes);
  syncRows();
}

      const source = modal.querySelector('#f-source').value;
      if (isEdit) {
        Object.assign(existingTx, { date: baseDate, type, qty, price, amount, source });
        // A transaction's price is HISTORICAL cost-basis data, not a live market quote —
        // asset.currentPrice must only change via an explicit Update Price action or a
        // live-price refresh (see openUpdatePriceModal/maybeAutoRefreshLivePrices), never
        // as a side effect of logging/editing a buy or sell here (Phase 5 hardening).
        logTransaction('edit', 'Transaction', asset.name, `${type} · ${fmtINR(amount)} on ${fmtDate(baseDate)}`);
        await Storage.save(state);
        closeModal();
        showToast('Transaction updated');
        openAssetIds.add(asset.id);
        renderAssets();
        return;
      }
      const dates = getRepeatOccurrences(modal, baseDate);
      dates.forEach(date => {
        asset.transactions.push({ id: uid(), date, type, qty, price, amount, source });
      });
      // See "isEdit" branch above — transaction price is historical, never mutates currentPrice.
      logTransaction('add', 'Transaction', asset.name, `${type} · ${fmtINR(amount)}${dates.length > 1 ? ` × ${dates.length}` : ' on ' + fmtDate(baseDate)}`);
      await Storage.save(state);
      closeModal();
      showToast(dates.length > 1 ? `${dates.length} transactions added` : 'Transaction added');
      openAssetIds.add(asset.id);
      renderAssets();
    };
  });
}

async function applyAssetPriceUpdate(asset, priceVal, dateVal) {
  const price = parseFloat(priceVal);
  // A per-unit price can't legitimately be negative, and a silent `|| 0` fallback would mask
  // a bad/blank input as "price is now zero" -- reject and tell the user instead (Phase 6
  // hardening). Zero itself is allowed (e.g. a written-off holding).
  if (!Number.isFinite(price) || price < 0) { showToast('Enter a valid, non-negative price'); return false; }
  asset.currentPrice = price;
  asset.lastUpdated = dateVal || todayISO();
  await Storage.save(state);
  showToast('Price updated');
  return true;
}
async function applyAssetValueUpdate(asset, valueVal, dateVal) {
  asset.currentValue = parseFloat(valueVal) || 0;
  asset.lastUpdated = dateVal || todayISO();
  await Storage.save(state);

}

/* ---------- Move Money (Item: reduce cross-tab duplication) ----------
   A "transfer between two accounts" and "pay a receivable/EMI/bill from an account" are,
   underneath, the exact same primitive: reduce one cash-like asset, increase something
   else. Rather than making the user hand-edit both sides separately (the workflow that
   was flagged as tedious — a Cash Debt Given repayment, an inter-bank transfer, and an
   EMI payment used to take 4-5 separate edits across Assets and Liabilities), this single
   modal does both sides of the movement in one save.

   Scoped to non-hasUnits assets only (Savings Accounts, Cash Debt Given, and similar
   lump-sum/ledger assets) — a hasUnits asset (stocks, MF, gold) needs qty/price context to
   move money correctly, which is what the existing per-asset transaction form is for.
   This does NOT create a bidirectional-synced link (editing/deleting one side later won't
   cascade to the other) — both entries share a `linkId` purely for traceability in the
   Transaction Log, not for automatic sync. */
function applyMoneyMovement(asset, amount, direction, date, note, linkId) {
  // Scoped to !hasUnits assets by the picker above — a hasUnits asset would need qty/price
  // context to move money correctly, which the existing per-asset transaction form covers.
  const type = direction === 'in' ? 'contribution' : 'withdrawal';
  asset.transactions.push({ id: uid(), date, type, amount, note: note || '', qty: null, price: null, linkId });
  if (!asset.ledgerStyle) {
    const delta = direction === 'in' ? amount : -amount;
    asset.currentValue = Math.max(0, (asset.currentValue || 0) + delta);
  }
}
function moveMoneyEligibleAssets() { return state.assets.filter(a => !a.hasUnits); }
function moveMoneyInvestTargets() { return state.assets.filter(a => a.hasUnits); }

function openMoveMoneyModal(defaultMode) {
  const eligible = moveMoneyEligibleAssets();
  const investable = moveMoneyInvestTargets();
  if (!eligible.length) { showToast('Move Money works with non-unit assets (Savings Accounts, Cash Debt Given, etc.) — add one first.'); return; }
  const mode0 = defaultMode === 'liability' ? 'liability' : defaultMode === 'invest' ? 'invest' : defaultMode === 'divest' ? 'divest' : 'asset';
  const unpaidCardOptions = state.creditCards.filter(c => nearestUnpaidBill(c)).map(c => {
    const b = nearestUnpaidBill(c);
    return `<option value="${c.id}">${escapeAttr(c.name)} — next bill ${fmtINR(b.amount - (b.paidAmount || 0))} due ${fmtDate(b.dueDate)}</option>`;
  }).join('');

  // "From" and "To" are both mode-aware: a plain Transfer or a Liability Payment draws cash
  // from a non-unit account; Buying an Investment draws cash from a non-unit account and
  // deposits units into a unit-tracked one; Selling one reverses that — the source is the
  // unit-tracked holding and the destination is a non-unit (cash) account. This is what lets
  // "I moved money into my Mutual Fund" be one action instead of a withdrawal recorded here
  // and a separate Buy transaction recorded on the asset itself.
  const optionsFor = (list, excludeId) => list.filter(a => a.id !== excludeId).map(a => `<option value="${a.id}">${escapeAttr(a.name)} (${a.category}) — ${fmtINR(assetCurrentValue(a))}</option>`).join('');
  const fromListForMode = (mode) => mode === 'divest' ? investable : eligible;
  const toListForMode = (mode) => mode === 'invest' ? investable : eligible;

  openModal(`
    <h3>Move Money</h3>
    <div class="modal-sub">Moves cash between accounts, pays a liability, or buys/sells an investment — updating both sides in one step.</div>
    <div class="field">
      <label>Moving To</label>
      <select id="f-mm-mode">
        <option value="asset" ${mode0 === 'asset' ? 'selected' : ''}>Another Account</option>
        <option value="liability" ${mode0 === 'liability' ? 'selected' : ''}>A Liability Payment</option>
        <option value="invest" ${mode0 === 'invest' ? 'selected' : ''}>An Investment — Buy</option>
        <option value="divest" ${mode0 === 'divest' ? 'selected' : ''}>Sell an Investment — Deposit Proceeds</option>
      </select>
    </div>
    <div class="field" id="mm-from-row">
      <label id="mm-from-label">From Account</label>
      <select id="f-mm-from">${optionsFor(fromListForMode(mode0), null)}</select>
    </div>
    <div class="field" id="mm-to-asset-row">
      <label id="mm-to-asset-label">To Account</label>
      <select id="f-mm-to-asset"></select>
    </div>
    <div class="field" id="mm-liab-type-row" style="display:none;">
      <label>Liability Type</label>
      <select id="f-mm-liab-type">
        <option value="loan">Loan / EMI</option>
        <option value="card">Credit Card Bill</option>
        <option value="cashloan">Cash Loan Taken</option>
      </select>
    </div>
    <div class="field" id="mm-liab-instance-row" style="display:none;">
      <label id="mm-liab-instance-label">Which one?</label>
      <select id="f-mm-liab-instance"></select>
    </div>
    <div class="field-row" id="mm-qty-price-row" style="display:none;">
      <div class="field"><label id="mm-qty-label">Quantity</label><input type="number" id="f-mm-qty" step="any" placeholder="0.00" /></div>
      <div class="field"><label id="mm-price-label">Price per unit</label><input type="number" id="f-mm-price" step="any" placeholder="0.00" /></div>
    </div>
    <div class="field helptext" id="mm-qty-price-hint" style="display:none;">Enter any two of quantity, price, and amount below — the third fills in automatically.</div>
    <div class="field-row">
      <div class="field"><label>Amount (₹)</label><input type="number" id="f-mm-amount" step="any" placeholder="0.00" /></div>
      <div class="field"><label>Date</label><input type="date" id="f-mm-date" value="${todayISO()}" /></div>
    </div>
    <div class="field"><label>Note <span class="hint" style="text-transform:none;">optional</span></label><input id="f-mm-note" placeholder="e.g. EMI repayment from brother" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Move Money</button>
    </div>
  `, (modal) => {
    const modeSel = modal.querySelector('#f-mm-mode');
    const fromLabel = modal.querySelector('#mm-from-label');
    const fromSel = modal.querySelector('#f-mm-from');
    const toAssetRow = modal.querySelector('#mm-to-asset-row');
    const toAssetLabel = modal.querySelector('#mm-to-asset-label');
    const toAssetSel = modal.querySelector('#f-mm-to-asset');
    const liabTypeRow = modal.querySelector('#mm-liab-type-row');
    const liabTypeSel = modal.querySelector('#f-mm-liab-type');
    const liabInstanceRow = modal.querySelector('#mm-liab-instance-row');
    const liabInstanceLabel = modal.querySelector('#mm-liab-instance-label');
    const liabInstanceSel = modal.querySelector('#f-mm-liab-instance');
    const qtyPriceRow = modal.querySelector('#mm-qty-price-row');
    const qtyPriceHint = modal.querySelector('#mm-qty-price-hint');
    const qtyLabel = modal.querySelector('#mm-qty-label');
    const priceLabel = modal.querySelector('#mm-price-label');
    const qtyEl = modal.querySelector('#f-mm-qty');
    const priceEl = modal.querySelector('#f-mm-price');
    const amountEl = modal.querySelector('#f-mm-amount');
    let triWired = false;

    function refreshFromOptions() {
      const list = fromListForMode(modeSel.value);
      if (!list.length) { fromSel.innerHTML = '<option value="">None available</option>'; return; }
      fromSel.innerHTML = optionsFor(list, modeSel.value === 'invest' || modeSel.value === 'asset' ? toAssetSel.value : null);
    }
    function refreshToAssetOptions() {
      const list = toListForMode(modeSel.value);
      if (!list.length) { toAssetSel.innerHTML = '<option value="">None available</option>'; return; }
      toAssetSel.innerHTML = optionsFor(list, modeSel.value === 'divest' || modeSel.value === 'asset' ? fromSel.value : null);
    }
    function refreshLiabInstances() {
      const type = liabTypeSel.value;
      if (type === 'loan') {
        liabInstanceLabel.textContent = 'Loan / EMI';
        liabInstanceSel.innerHTML = state.loans.map(l => `<option value="${l.id}">${escapeAttr(l.name)} — EMI ${fmtINR(emiAmount(l.principal, l.rate, l.tenureMonths, l.interestType))}</option>`).join('') || '<option value="">No loans yet</option>';
      } else if (type === 'card') {
        liabInstanceLabel.textContent = 'Credit Card';
        liabInstanceSel.innerHTML = unpaidCardOptions || '<option value="">No unpaid bills</option>';
      } else {
        liabInstanceLabel.textContent = 'Cash Loan Taken';
        liabInstanceSel.innerHTML = state.cashLoans.map(c => `<option value="${c.id}">${escapeAttr(c.name)} — owed ${fmtINR(cashLoanOutstanding(c))}</option>`).join('') || '<option value="">No cash loans yet</option>';
      }
      autofillAmount();
    }
    function autofillAmount() {
      if (modeSel.value !== 'liability' || amountEl.value) return;
      const type = liabTypeSel.value;
      const id = liabInstanceSel.value;
      if (!id) return;
      if (type === 'loan') {
        const l = state.loans.find(x => x.id === id);
        if (l) amountEl.value = emiAmount(l.principal, l.rate, l.tenureMonths, l.interestType).toFixed(2);
      } else if (type === 'card') {
        const c = state.creditCards.find(x => x.id === id);
        const b = c && nearestUnpaidBill(c);
        if (b) amountEl.value = (b.amount - (b.paidAmount || 0)).toFixed(2);
      }
    }
    function autofillPrice() {
      // Pre-fill the current price so the user only has to type Amount (or Quantity) — the
      // third field computes itself via wireTriFieldCalc.
      if (priceEl.value) return;
      const mode = modeSel.value;
      const asset = mode === 'invest' ? state.assets.find(a => a.id === toAssetSel.value) : mode === 'divest' ? state.assets.find(a => a.id === fromSel.value) : null;
      if (asset && asset.currentPrice) priceEl.value = asset.currentPrice;
    }
    function syncMode() {
      const mode = modeSel.value;
      const isLiab = mode === 'liability';
      const isInvest = mode === 'invest';
      const isDivest = mode === 'divest';
      fromLabel.textContent = isDivest ? 'From Investment' : 'From Account';
      toAssetLabel.textContent = isInvest ? 'To Investment' : 'To Account';
      toAssetRow.style.display = isLiab ? 'none' : '';
      liabTypeRow.style.display = isLiab ? '' : 'none';
      liabInstanceRow.style.display = isLiab ? '' : 'none';
      qtyPriceRow.style.display = (isInvest || isDivest) ? '' : 'none';
      qtyPriceHint.style.display = (isInvest || isDivest) ? '' : 'none';
      const unitLabel = isInvest ? (state.assets.find(a => a.id === toAssetSel.value)?.unitLabel) : isDivest ? (state.assets.find(a => a.id === fromSel.value)?.unitLabel) : null;
      qtyLabel.textContent = `Quantity${unitLabel ? ` (${unitLabel})` : ''}`;
      priceLabel.textContent = `Price per ${unitLabel || 'unit'}`;
      refreshFromOptions();
      refreshToAssetOptions();
      if (isLiab) refreshLiabInstances();
      if (isInvest || isDivest) {
        if (!triWired) { wireTriFieldCalc(qtyEl, priceEl, amountEl); triWired = true; }
        autofillPrice();
      }
    }
    modeSel.onchange = () => { qtyEl.value = ''; priceEl.value = ''; syncMode(); };
    fromSel.onchange = () => { if (modeSel.value === 'asset') refreshToAssetOptions(); if (modeSel.value === 'divest') autofillPrice(); };
    toAssetSel.onchange = () => { if (modeSel.value === 'asset') refreshFromOptions(); if (modeSel.value === 'invest') autofillPrice(); };
    liabTypeSel.onchange = refreshLiabInstances;
    liabInstanceSel.onchange = autofillAmount;
    syncMode();

    modal.querySelector('#f-cancel').onclick = closeModal;
    modal.querySelector('#f-save').onclick = async () => {
      const mode = modeSel.value;
      const fromAsset = state.assets.find(a => a.id === fromSel.value);
      const amount = parseFloat(amountEl.value);
      const date = modal.querySelector('#f-mm-date').value || todayISO();
      const note = modal.querySelector('#f-mm-note').value.trim();
      if (!fromAsset) { showToast(mode === 'divest' ? 'Pick which investment to sell' : 'Pick a From account'); return; }
      if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
      const linkId = uid();

      if (mode === 'asset') {
        const toAsset = state.assets.find(a => a.id === toAssetSel.value);
        if (!toAsset || toAsset.id === fromAsset.id) { showToast('Pick a different To account'); return; }
        applyMoneyMovement(fromAsset, amount, 'out', date, note || `Transfer to ${toAsset.name}`, linkId);
        applyMoneyMovement(toAsset, amount, 'in', date, note || `Transfer from ${fromAsset.name}`, linkId);
        logTransaction('add', 'Transfer', `${fromAsset.name} → ${toAsset.name}`, fmtINR(amount));
        await Storage.save(state);
        closeModal();
        showToast(`Moved ${fmtINR(amount)}: ${fromAsset.name} → ${toAsset.name}`);
        openAssetIds.add(fromAsset.id); openAssetIds.add(toAsset.id);
        renderAssets(); renderLiabilities();
        return;
      }

      if (mode === 'invest') {
        const toAsset = state.assets.find(a => a.id === toAssetSel.value);
        if (!toAsset) { showToast('Pick which investment to buy into'); return; }
        const qty = qtyEl.value ? parseFloat(qtyEl.value) : null;
        const price = priceEl.value ? parseFloat(priceEl.value) : null;
        applyMoneyMovement(fromAsset, amount, 'out', date, note || `Invested in ${toAsset.name}`, linkId);
        toAsset.transactions.push({ id: uid(), date, type: 'buy', qty, price, amount, source: 'Regular', note: note || `Funded from ${fromAsset.name}`, linkId });
        // Historical transaction price — must not overwrite currentPrice (Phase 5 hardening).
        logTransaction('add', 'Investment', `${fromAsset.name} → ${toAsset.name}`, `${fmtINR(amount)} on ${fmtDate(date)} (via Move Money)`);
        await Storage.save(state);
        closeModal();
        showToast(`Invested ${fmtINR(amount)}: ${fromAsset.name} → ${toAsset.name}`);
        openAssetIds.add(fromAsset.id); openAssetIds.add(toAsset.id);
        renderAssets(); renderDashboard();
        return;
      }

      if (mode === 'divest') {
        const toAsset = state.assets.find(a => a.id === toAssetSel.value);
        if (!toAsset) { showToast('Pick which account receives the proceeds'); return; }
        const qty = qtyEl.value ? parseFloat(qtyEl.value) : null;
        const price = priceEl.value ? parseFloat(priceEl.value) : null;
        fromAsset.transactions.push({ id: uid(), date, type: 'sell', qty, price, amount, source: 'Regular', note: note || `Deposited to ${toAsset.name}`, linkId });
        // Historical transaction price — must not overwrite currentPrice (Phase 5 hardening).
        applyMoneyMovement(toAsset, amount, 'in', date, note || `Proceeds from ${fromAsset.name}`, linkId);
        logTransaction('add', 'Divestment', `${fromAsset.name} → ${toAsset.name}`, `${fmtINR(amount)} on ${fmtDate(date)} (via Move Money)`);
        await Storage.save(state);
        closeModal();
        showToast(`Sold ${fmtINR(amount)} from ${fromAsset.name} → ${toAsset.name}`);
        openAssetIds.add(fromAsset.id); openAssetIds.add(toAsset.id);
        renderAssets(); renderDashboard();
        return;
      }

      // Liability payment mode
      const type = liabTypeSel.value;
      const instanceId = liabInstanceSel.value;
      if (!instanceId) { showToast('Pick which liability this pays'); return; }
      let liabLabel = '';
      if (type === 'loan') {
        const loan = state.loans.find(l => l.id === instanceId);
        if (!loan) { showToast('Loan not found'); return; }
        loan.payments = loan.payments || [];
        loan.payments.push({ id: uid(), date, amount, linkId });
        liabLabel = loan.name;
        logTransaction('add', 'Loan Payment', loan.name, `${fmtINR(amount)} on ${fmtDate(date)} (via Move Money)`);
        mirrorAutoExpense('EMI/Loan Payment', loan.name, amount, date, fromAsset.name, `loan-${loan.id}-${linkId}`);
        openLiabIds.add(loan.id);
      } else if (type === 'card') {
        const card = state.creditCards.find(c => c.id === instanceId);
        const bill = card && nearestUnpaidBill(card);
        if (!card || !bill) { showToast('No unpaid bill found for this card'); return; }
        bill.paidAmount = (bill.paidAmount || 0) + amount;
        bill.paidDate = date;
        if (bill.paidAmount >= bill.amount) bill.paid = true;
        liabLabel = card.name;
        logTransaction('update', 'Credit Card Bill', card.name, `${fmtINR(amount)} paid on ${fmtDate(date)} (via Move Money)`);
        mirrorAutoExpense('Credit Card Bill', card.name, amount, date, fromAsset.name, `cardbill-${bill.id}-${linkId}`);
        openLiabIds.add(card.id);
      } else {
        const cl = state.cashLoans.find(c => c.id === instanceId);
        if (!cl) { showToast('Cash loan not found'); return; }
        cl.repayments = cl.repayments || [];
        cl.repayments.push({ id: uid(), date, amount, linkId });
        liabLabel = cl.name;
        logTransaction('add', 'Cash Loan Repayment', cl.name, `${fmtINR(amount)} on ${fmtDate(date)} (via Move Money)`);
        // Cash loan repayments now mirror into Cash Flow the same way loan/card payments do
        // (Phase 8 hardening — previously cash loan repayments never appeared in Cash Flow
        // through any path).
        mirrorAutoExpense('EMI/Loan Payment', cl.name, amount, date, fromAsset.name, `cashloan-${cl.id}-${linkId}`);
        openLiabIds.add(cl.id);
      }
      applyMoneyMovement(fromAsset, amount, 'out', date, note || `Payment: ${liabLabel}`, linkId);
      logTransaction('add', 'Transfer', `${fromAsset.name} → ${liabLabel}`, fmtINR(amount));
      await Storage.save(state);
      closeModal();
      showToast(`Paid ${fmtINR(amount)} to ${liabLabel} from ${fromAsset.name}`);
      openAssetIds.add(fromAsset.id);
      renderAssets(); renderLiabilities();
    };
  });
}

        const touchedAssets = new Set();
        lines.forEach(line => {
          const parts = csvParseLine(line);

          const [assetName, date, type, qtyStr, priceStr, amountStr, note] = parts;

          const price = asset.hasUnits ? (parseFloat(priceStr) || null) : null;
          let amount = parseFloat(amountStr);
          if ((isNaN(amount) || !amount) && qty && price) amount = qty * price;
          if (isNaN(amount) || !amount) { skipped++; return; }
          asset.transactions.push({ id: uid(), date, type: type.toLowerCase(), qty, price, amount, note: note ? note.trim() : '' });

          // (Phase 5 hardening). A dedicated currentPrice CSV column exists for bulk

        touchedAssets.forEach(id => openAssetIds.add(id));
        renderAssets();
        return;

      const asset = state.assets.find(a => a.id === assetSelect.value);
      if (!asset) { showToast('No asset selected'); return; }

      if (asset.ledgerStyle) {
        lines.forEach(line => {
          const parts = csvParseLine(line);
          if (parts.length < 3) { skipped++; return; }
          const [date, note, debitStr, creditStr] = parts;
          if (isNaN(Date.parse(date))) { skipped++; return; } // likely a header row
          const debit = parseFloat(debitStr) || 0;
          const credit = parseFloat(creditStr) || 0;
          if (!debit && !credit) { skipped++; return; }
          if (debit > 0) { asset.transactions.push({ id: uid(), date, type: 'withdrawal', amount: debit, note: note || '', qty: null, price: null }); added++; }
          if (credit > 0) { asset.transactions.push({ id: uid(), date, type: 'contribution', amount: credit, note: note || '', qty: null, price: null }); added++; }
        });
      } else {
        lines.forEach(line => {
          const parts = line.split(',').map(p => p.trim());
          if (parts.length < 3) { skipped++; return; }
          const [date, type, qtyStr, priceStr, amountStr] = parts;
          if (isNaN(Date.parse(date))) { skipped++; return; } // likely a header row
          if (!['buy', 'sell', 'contribution', 'withdrawal'].includes(type.toLowerCase())) { skipped++; return; }
          const qty = parseFloat(qtyStr) || null;
          const price = parseFloat(priceStr) || null;
          let amount = parseFloat(amountStr);
          if (isNaN(amount) && qty && price) amount = qty * price;
          if (isNaN(amount) || !amount) { skipped++; return; }
          asset.transactions.push({ id: uid(), date, type: type.toLowerCase(), qty, price, amount });
          // Historical transaction price — must not overwrite currentPrice (Phase 5 hardening).
          added++;
        });
      }

      await Storage.save(state);
      closeModal();
      showToast(`Imported ${added} entr${added !== 1 ? 'ies' : 'y'}${skipped ? `, skipped ${skipped}` : ''}`);
      openAssetIds.add(asset.id);
      renderAssets();
    };
  });
}

/* ===================== LIVE PRICES ENGINE =====================
   Manual-effort reduction: fetches current prices instead of requiring the
   user to type them in.

   Every fetch function below returns { price, error } rather than just a
   price-or-null — a bare null gave no way to tell "no symbol set" apart
   from "network blocked" apart from "Yahoo returned no data", which is
   exactly what made failures look silent. Now every failure carries a
   reason, and refreshAllLivePrices() surfaces it in a results modal that
   stays open until dismissed (not a toast that can auto-vanish in 2-3s).

   Reliability by source, honestly:
   - mfapi.in (Mutual Funds) and open.er-api.com (FX) are free, keyless, and
     CORS-open — these should just work from the browser every time.
   - goldapi.io (Gold/Silver) is free but needs a key (Settings > Live
     Prices) and does support browser CORS with the x-access-token header.
   - Stocks ("Yahoo Finance" source) go through YOUR Netlify Function first
     (netlify/functions/stock-quote.js, called same-origin at /api/stock-
     quote — no CORS or mixed-content possible, this is the reliable path),
     with one plain direct-to-Yahoo request as a free backup if the function
     is briefly unreachable. Earlier versions of this chased CORS failures
     through public proxies and a third-party community API — that's gone;
     the function replaces all of it. If both attempts fail, the price is
     left untouched and reported with the real reason, never silently
     zeroed out.
   ========================================================================= */
const YAHOO_DIRECT_URL = (symbol) => `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}`;

async function fetchWithTimeout(url, opts = {}, timeoutMs = 14000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(t);
  }
}
function describeFetchError(e) {
  if (e && e.name === 'AbortError') return 'Timed out';
  if (e instanceof TypeError) return 'Network/CORS blocked'; // fetch() rejects with a generic TypeError for CORS failures — the browser never exposes the real reason to JS
  return (e && e.message) ? e.message : 'Unknown error';
}
function parseYahooChartPrice(json) {
  const price = json?.chart?.result?.[0]?.meta?.regularMarketPrice;
  return typeof price === 'number' ? price : null;
}

async function fetchYahooQuote(symbol) {
  if (!symbol) return { price: null, error: 'No ticker symbol set on this asset' };
  // Down to 2 attempts, on purpose: your Netlify Function (/api/stock-quote) is the real
  // fix and works reliably now that it's deployed — same-origin, no CORS/mixed-content
  // possible. The old 6-attempt chain (2 public CORS proxies + a 3rd-party community API,
  // each tried twice) was noise once that function existed; it's gone. What's left is one
  // plain direct-to-Yahoo attempt as a free, simple backup in case the function has an off
  // day — nothing routed through a public proxy anymore.
  const attempts = [
    { label: 'your Netlify Function (/api/stock-quote)', url: `/api/stock-quote?symbol=${encodeURIComponent(symbol)}`, timeout: 8000, parse: (json) => (typeof json?.price === 'number' ? json.price : null) },
    { label: 'Yahoo direct (backup)', url: YAHOO_DIRECT_URL(symbol), timeout: 10000, parse: parseYahooChartPrice }
  ];
  let lastError = 'Unknown error';
  for (const attempt of attempts) {
    try {
      const res = await fetchWithTimeout(attempt.url, {}, attempt.timeout);
      if (!res.ok) {
        let detail = `HTTP ${res.status}${res.status === 401 ? ' (rejecting unauthenticated requests)' : res.status === 404 && attempt.url.startsWith('/api/') ? ' — not deployed yet?' : ''}`;
        try { const errJson = await res.json(); if (errJson?.error) detail = errJson.error; } catch (_) { /* body wasn't JSON, keep the HTTP-status message */ }
        lastError = `${attempt.label}: ${detail}`;
        continue;
      }
      const json = await res.json();
      const price = attempt.parse(json);
      if (typeof price === 'number' && price > 0) return { price, error: null, via: attempt.label };
      lastError = `${attempt.label}: no price returned for "${symbol}" — check the ticker is correct`;
    } catch (e) {
      lastError = `${attempt.label}: ${describeFetchError(e)}`;
      console.error('[Live Prices] Stock fetch attempt failed —', attempt.label, e);
    }
  }
  return { price: null, error: lastError };
}

async function fetchMFNav(schemeCode) {
  if (!schemeCode) return { price: null, error: 'No scheme code set on this asset' };
  try {
    const res = await fetchWithTimeout(`https://api.mfapi.in/mf/${encodeURIComponent(schemeCode)}/latest`);
    if (!res.ok) return { price: null, error: `HTTP ${res.status} — check the scheme code is correct` };
    const json = await res.json();
    const nav = json?.data?.[0]?.nav;
    if (!nav) return { price: null, error: 'No NAV data returned for this scheme code' };
    return { price: parseFloat(nav), error: null };
  } catch (e) {
    console.error('[Live Prices] mfapi.in fetch failed —', e);
    return { price: null, error: describeFetchError(e) };
  }
}

async function fetchMetalPricePerGram(metalSymbol, apiKey) {
  if (!apiKey) return { price: null, error: 'No Gold API key set — add one in Settings → Live Prices' };
  try {
    const res = await fetchWithTimeout(`https://www.goldapi.io/api/${metalSymbol}/INR`, { headers: { 'x-access-token': apiKey, 'Content-Type': 'application/json' } });
    if (!res.ok) return { price: null, error: `HTTP ${res.status}${res.status === 401 ? ' — check your API key' : ''}` };
    const json = await res.json();
    if (typeof json.price_gram_24k === 'number') return { price: json.price_gram_24k, error: null };
    if (typeof json.price === 'number') return { price: json.price / 31.1034768, error: null }; // per troy ounce → per gram
    return { price: null, error: 'No price field in goldapi.io response' };
  } catch (e) {
    console.error('[Live Prices] goldapi.io fetch failed —', e);
    return { price: null, error: describeFetchError(e) };
  }
}

async function fetchFXRatesLive() {
  try {
    const res = await fetchWithTimeout(`https://open.er-api.com/v6/latest/${encodeURIComponent(state.settings.baseCurrency)}`);
    if (!res.ok) return { rates: null, error: `HTTP ${res.status}` };
    const json = await res.json();
    if (json.result !== 'success' || !json.rates) return { rates: null, error: 'Unexpected response from open.er-api.com' };
    return { rates: json.rates, error: null };
  } catch (e) {
    console.error('[Live Prices] open.er-api.com fetch failed —', e);
    return { rates: null, error: describeFetchError(e) };
  }
}

async function refreshLiveExchangeRates(manual) {
  const { rates, error } = await fetchFXRatesLive();
  if (!rates) {
    console.error('[Live Prices] FX refresh failed —', error);
    if (manual) showToast(`Could not reach the FX rate service — ${error}`);
    return;
  }
  let updated = 0;
  state.settings.currencies.filter(c => c !== state.settings.baseCurrency).forEach(code => {
    if (typeof rates[code] === 'number' && rates[code] > 0) {
      state.settings.exchangeRates[code] = 1 / rates[code]; // invert: "1 unit of code → X base currency"
      updated++;
    }
  });
  await Storage.save(state);
  if (manual) showToast(updated ? `Updated ${updated} exchange rate${updated !== 1 ? 's' : ''}` : 'No matching currencies to update');
  if (document.getElementById('tab-settings').classList.contains('active')) renderSettings();
}

// Single dispatch point for "given this asset, go get its live price" — shared by the bulk
// refresh and the per-asset refresh button so the two can never drift out of sync.
const _liveMetalCache = { gold: undefined, silver: undefined, day: null };
async function resolveLivePrice(a) {
  const goldKey = state.settings.livePrices.goldApiKey;
  if (a.livePriceMode === 'yahoo') return fetchYahooQuote(a.apiSymbol);
  if (a.livePriceMode === 'mfapi') return fetchMFNav(a.apiSymbol);
  if (a.livePriceMode === 'gold' || a.livePriceMode === 'silver') {
    // Cache per calendar day within a single refresh run, not across runs — a stale in-memory
    // cache surviving a manual re-click would look exactly like the "silent failure" this whole
    // engine was rebuilt to avoid.
    const today = todayISO();
    if (_liveMetalCache.day !== today) { _liveMetalCache.gold = undefined; _liveMetalCache.silver = undefined; _liveMetalCache.day = today; }
    if (a.livePriceMode === 'gold') { if (_liveMetalCache.gold === undefined) _liveMetalCache.gold = await fetchMetalPricePerGram('XAU', goldKey); return _liveMetalCache.gold; }
    if (_liveMetalCache.silver === undefined) _liveMetalCache.silver = await fetchMetalPricePerGram('XAG', goldKey); return _liveMetalCache.silver;
  }
  return { price: null, error: 'Unknown Live Price Source' };
}

async function refreshAllLivePrices(manual) {
  const targets = state.assets.filter(a => a.hasUnits && a.livePriceMode && a.livePriceMode !== 'manual');
  if (manual && !targets.length) { showToast('No assets set up for live pricing yet — set a Live Price Source on an asset first'); return; }
  const today = todayISO();
  const results = [];

  for (const a of targets) {
    const outcome = await resolveLivePrice(a);
    if (outcome.price !== null && outcome.price > 0) {
      a.currentPrice = outcome.price;
      a.lastUpdated = today;
      results.push({ name: a.name, mode: a.livePriceMode, ok: true, price: outcome.price });
    } else {
      results.push({ name: a.name, mode: a.livePriceMode, ok: false, detail: outcome.error || 'Failed' });
      console.error(`[Live Prices] ${a.name} (${a.livePriceMode}) failed —`, outcome.error);
    }
  }
  const ok = results.filter(r => r.ok).length;
  const failed = results.length - ok;
  // Track last-attempted and last-successful separately (Phase 9 hardening): a completely
  // failed refresh (ok === 0, e.g. network/API down) must not stamp `lastRefresh`, or
  // maybeAutoRefreshLivePrices()'s once-a-day throttle below would silently block every
  // retry for the rest of the day even though nothing actually succeeded. `lastAttempt`
  // always records the attempt (for diagnostics / "last tried at" display).
  state.settings.livePrices.lastAttempt = today;
  if (ok > 0) state.settings.livePrices.lastRefresh = today;
  await Storage.save(state);
  if (ok) logTransaction('update', 'Live Prices', `${ok} asset${ok !== 1 ? 's' : ''}`, failed ? `${failed} failed — see console/results` : 'all succeeded');

  if (manual) {
    showLivePriceResultsModal(results, targets.length);
  } else if (failed) {
    // Auto-refresh stays quiet on success (that's the point), but a failure — especially a
    // recurring one — shouldn't be invisible just because it happened in the background.
    showToast(`Live price refresh: ${ok} updated, ${failed} failed — check Assets or Settings → Live Prices`);
    console.warn('[Live Prices] Background refresh had failures:', results.filter(r => !r.ok));
  }
  if (document.getElementById('tab-assets').classList.contains('active')) renderAssets();
  renderDashboard();
  if (document.getElementById('tab-settings').classList.contains('active')) renderSettings();
}

async function refreshSingleAssetPrice(assetId) {
  const a = state.assets.find(x => x.id === assetId);
  if (!a) return;
  if (!a.livePriceMode || a.livePriceMode === 'manual') { showToast('No Live Price Source set for this asset — set one under Edit Asset'); return; }
  const btn = document.querySelector(`[data-refresh-price="${assetId}"]`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const outcome = await resolveLivePrice(a);
  if (outcome.price !== null && outcome.price > 0) {
    a.currentPrice = outcome.price;
    a.lastUpdated = todayISO();
    logTransaction('update', 'Live Prices', a.name, `${fmtINR(outcome.price, { decimals: 2 })} via ${a.livePriceMode}`);
    await Storage.save(state);
    showToast(`${a.name}: ${fmtINR(outcome.price, { decimals: 2 })}`);
  } else {
    console.error(`[Live Prices] ${a.name} (${a.livePriceMode}) failed —`, outcome.error);
    showToast(`${a.name} failed — ${outcome.error}`);
  }
  openAssetIds.add(a.id);
  renderAssets();
  renderDashboard();
}

async function maybeAutoRefreshLivePrices() {
  const cfg = state.settings.livePrices;
  if (!cfg || !cfg.autoRefreshOnOpen) return;
  // Throttled to once/day, but ONLY once a refresh has actually succeeded (at least
  // partially) today -- see refreshAllLivePrices()'s lastAttempt/lastRefresh split. A fully
  // failed attempt must not block the next automatic retry (Phase 9 hardening).
  if (cfg.lastRefresh === todayISO()) return;
  await refreshAllLivePrices(false);
  await refreshLiveExchangeRates(false);
}

    };
    modal.querySelector('#f-cancel').onclick = closeModal;

      const raw = csvArea.value.trim();
      if (!raw) { showToast('Add, paste, or upload some rows first'); return; }
      const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      let updated = 0;
      const unmatched = [];
      const today = todayISO();
      lines.forEach(line => {
        const parts = csvParseLine(line);
        if (parts.length < 2) return;
        const name = parts[0].trim();
        const price = parseFloat(parts[1]);
        if (!name || isNaN(price)) return; // likely a header row or blank price
        const asset = unitAssets.find(a => a.name.toLowerCase() === name.toLowerCase());
        if (!asset) { unmatched.push(name); return; }
        asset.currentPrice = price;
        asset.lastUpdated = today;

      renderAssets();
    };
  });
}

async function deleteAsset(assetId) {
  if (!confirm('Delete this asset and all its transactions? This cannot be undone.')) return;
  const asset = state.assets.find(a => a.id === assetId);
  state.assets = state.assets.filter(a => a.id !== assetId);
  openAssetIds.delete(assetId);
  if (asset) logAudit('delete', 'Asset', asset.name);
  await Storage.save(state);
  showToast('Asset deleted');
  renderAssets();
}
async function deleteTransaction(assetId, txId) {
  const asset = state.assets.find(a => a.id === assetId);
  if (!asset) return;
  const tx = asset.transactions.find(t => t.id === txId);
  asset.transactions = asset.transactions.filter(t => t.id !== txId);
  if (tx) logTransaction('delete', 'Transaction', asset.name, `${tx.type} · ${fmtINR(tx.amount)} on ${fmtDate(tx.date)}`);
  await Storage.save(state);
  showToast('Transaction deleted');
  renderAssets();
}

/* ---------- EMI Calendar subtab (Item 8) ----------
   Shows a CSS grid calendar for each visible month + a month filter (multi-select pills).
   emiCalendarFilter is a Set of 'YYYY-MM' strings; empty = show all months in the window. */
let emiCalendarFilter = new Set();

function renderEMICalendar() {
  const wrap = document.getElementById('liab-content');
  const allGroups = upcomingObligationsGrouped(12); // extend to 12 months for better filter range
  if (!allGroups.length) {
    wrap.innerHTML = `<div class="card empty-state">${emptyStateIcon()}<div class="big">Nothing scheduled</div>No loan EMIs or unpaid credit card bills due in the next 12 months.</div>`;
    return;
  }

  // Build month keys from groups
  const allMonthKeys = allGroups.map(g => g.monthKey || g.items[0]?.date?.slice(0, 7) || '');
  // If filter has keys that no longer exist, clean up
  emiCalendarFilter = new Set([...emiCalendarFilter].filter(k => allMonthKeys.includes(k)));

  const activeGroups = emiCalendarFilter.size
    ? allGroups.filter(g => {
        const key = g.monthKey || g.items[0]?.date?.slice(0, 7) || '';
        return emiCalendarFilter.has(key);
      })
    : allGroups;

  // Month filter pills
  const filterPills = allGroups.map(g => {
    const key = g.monthKey || g.items[0]?.date?.slice(0, 7) || '';
    return `<button class="chip ${emiCalendarFilter.has(key) ? 'active' : ''}" data-emi-month="${key}">${g.monthLabel} <span class="count">${fmtINR(g.total)}</span></button>`;
  }).join('');

  // Calendar grid for each active month
  function buildCalendarGrid(g) {
    const key = g.monthKey || g.items[0]?.date?.slice(0, 7) || '';
    if (!key) return '';
    const [yr, mo] = key.split('-').map(Number);
    const firstDay = new Date(yr, mo - 1, 1);
    const lastDay = new Date(yr, mo, 0);
    const startDow = firstDay.getDay(); // 0=Sun
    const totalDays = lastDay.getDate();
    const today = todayISO();

    // Map days to items
    const dayItems = {};
    g.items.forEach(it => {
      const d = it.date?.slice(8, 10);
      if (d) { (dayItems[parseInt(d)] = dayItems[parseInt(d)] || []).push(it); }
    });

    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const headerCells = dayNames.map((d, i) => `<div style="text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:${i === 0 || i === 6 ? 'var(--text-muted)' : 'var(--text-dim)'};padding:4px 0;">${d}</div>`).join('');

    let cells = '';
    // Leading blanks
    for (let i = 0; i < startDow; i++) cells += '<div></div>';
    for (let d = 1; d <= totalDays; d++) {
      const dateStr = `${key}-${String(d).padStart(2,'0')}`;
      const isToday = dateStr === today;
      const items = dayItems[d] || [];
      const hasPayment = items.length > 0;
      const dow = new Date(yr, mo - 1, d).getDay();
      const isWeekend = dow === 0 || dow === 6;
      const cls = ['emi-day', isWeekend ? 'weekend' : '', hasPayment ? 'has-payment' : '', isToday ? 'is-today' : ''].filter(Boolean).join(' ');
      cells += `<div class="${cls}">
        <div class="day-num">${d}</div>
        ${items.map(it => `<div class="day-item" title="${it.label} · ${fmtINR(it.amount)}">${it.label.split(' ')[0]} <span class="amt">${fmtINR(it.amount)}</span></div>`).join('')}
      </div>`;
    }

    return `
      <div class="block">
        <div class="section-label">${g.monthLabel} <span class="hint">${fmtINR(g.total)} total · ${g.items.length} payment${g.items.length !== 1 ? 's' : ''}</span></div>
        <div class="card" style="padding:14px;">
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;">${headerCells}</div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">${cells}</div>
        </div>
        <div class="card" style="padding:0;margin-top:10px;">
          ${g.items.map(it => `
          <div class="flex-between" style="padding:10px 16px;border-bottom:1px solid var(--border-soft);">
            <div>
              <div style="font-size:13px;">${it.label}</div>
              <div class="jn" style="margin-top:2px;">${it.sub}</div>
            </div>
            <div style="text-align:right;">
              <div class="num" style="font-size:13.5px;">${fmtINR(it.amount)}</div>
              <div class="jn" style="margin-top:2px;">${fmtDate(it.date)}</div>
            </div>
          </div>`).join('')}
        </div>
      </div>`;

async function bulkDeleteLiabilities(keys) {
  if (!keys.length) return;
  if (!confirm(`Delete ${keys.length} selected liabilit${keys.length === 1 ? 'y' : 'ies'}? This cannot be undone.`)) return;
  let count = 0;
  keys.forEach(k => {
    const [kind, id] = k.split(':');
    // Clean up any mirrored Cash Flow entries for each deleted record — same prefix schemes
    // used by the single-item delete functions above (Phase 7/8 hardening).
    if (kind === 'creditcards') {
      const x = state.creditCards.find(v => v.id === id);
      if (x) { logAudit('delete', 'Credit Card', x.name); count++; (x.bills || []).forEach(b => unmirrorAutoExpensesByPrefix(`cardbill-${b.id}`)); }
      state.creditCards = state.creditCards.filter(v => v.id !== id);
    }
    else if (kind === 'loans') { const x = state.loans.find(v => v.id === id); if (x) { logAudit('delete', 'Loan/EMI', x.name); count++; unmirrorAutoExpensesByPrefix(`loan-${id}-`); } state.loans = state.loans.filter(v => v.id !== id); }
    else if (kind === 'cashloans') { const x = state.cashLoans.find(v => v.id === id); if (x) { logAudit('delete', 'Cash Loan', x.name); count++; unmirrorAutoExpensesByPrefix(`cashloan-${id}-`); } state.cashLoans = state.cashLoans.filter(v => v.id !== id); }
    else if (kind === 'bills') { const x = state.bills.find(v => v.id === id); if (x) { logAudit('delete', 'Bill', x.name || x.category); count++; unmirrorAutoExpensesByPrefix(`bill-${id}-`); } state.bills = state.bills.filter(v => v.id !== id); }
    openLiabIds.delete(id);
  });
  selectedLiabIds.clear(); liabSelectMode = false;
  await Storage.save(state);
  showToast(`${count} liabilit${count !== 1 ? 'ies' : 'y'} deleted`);
  renderLiabilities();
  renderDashboard();
}

async function markBillPaid(id) {
  const b = state.bills.find(x => x.id === id);
  if (!b) return;
  b.history = b.history || [];
  const paidDate = todayISO();
  b.history.push({ id: uid(), date: paidDate, amount: b.amount });
  if (b.recurring === 'none') { b.status = 'paid'; }
  else { b.dueDate = addMonths(b.dueDate, b.recurring === 'monthly' ? 1 : b.recurring === 'quarterly' ? 3 : 12); b.status = 'due'; }
  logTransaction('update', 'Bill', b.name || b.category, `${fmtINR(b.amount)} marked paid`);
  mirrorAutoExpense(BILL_TYPE_EXPENSE_CATEGORY[b.type] || 'Other', b.name || b.category, b.amount, paidDate, null, `bill-${b.id}-${paidDate}`);
  await Storage.save(state); showToast('Marked as paid'); renderLiabilities(); renderDashboard();
}
async function markBillUnpaid(id) {
  const b = state.bills.find(x => x.id === id);
  if (!b) return;
  b.status = 'due';
  // Undo the most recently recorded payment (if any): pop its history entry and remove the
  // Cash Flow entry mirrorAutoExpense() created for it, or that entry would be left behind
  // as a stale automatic expense with no corresponding "paid" record (Phase 7 hardening).
  const lastPaid = (b.history || []).length ? b.history[b.history.length - 1] : null;
  if (lastPaid) {
    b.history.pop();
    unmirrorAutoExpense(`bill-${b.id}-${lastPaid.date}`);
  }
  logTransaction('update', 'Bill', b.name || b.category, 'Marked unpaid');
  await Storage.save(state); showToast('Marked as unpaid'); renderLiabilities(); renderDashboard();
}
async function deleteLiabilityBill(id) {
  const b = state.bills.find(x => x.id === id);
  if (!b) return;
  if (!confirm(`Delete "${b.name || b.category}"? This cannot be undone.`)) return;
  logAudit('delete', 'Bill', b.name || b.category);
  // Every paid instance of this bill was mirrored as `bill-<id>-<date>` (see markBillPaid) --
  // remove all of them by prefix now that the parent record itself is gone (Phase 7 hardening).
  unmirrorAutoExpensesByPrefix(`bill-${b.id}-`);
  state.bills = state.bills.filter(x => x.id !== id);
  openLiabIds.delete(id);
  await Storage.save(state); showToast('Deleted'); renderLiabilities(); renderDashboard();
}
