      </select>
    </div>
    <div class="field"><label>Notes <span class="hint" style="text-transform:none;">optional</span></label><input id="f-bill-notes" value="${isEdit ? escapeAttr(existing.notes || '') : ''}" /></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">${isEdit ? 'Save Changes' : 'Add ' + cfg.noun}</button>
    </div>
  `, (modal) => {
    modal.querySelector('#f-cancel').onclick = closeModal;
    modal.querySelector('#f-save').onclick = async () => {
      const category = modal.querySelector('#f-bill-category').value;
      const name = modal.querySelector('#f-bill-name').value.trim();
      const amount = parseFloat(modal.querySelector('#f-bill-amount').value);
      const dueDate = modal.querySelector('#f-bill-due').value;
      const recurring = modal.querySelector('#f-bill-recurring').value;
      const notes = modal.querySelector('#f-bill-notes').value.trim();
      if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
      if (!dueDate) { showToast('Pick a due date'); return; }
      if (isEdit) {
        Object.assign(existing, { category, name, amount, dueDate, recurring, notes });
        logAudit('update', 'Bill', name || category);
      } else {
        state.bills.push({ id: uid(), type, category, name, amount, dueDate, recurring, notes, status: 'due', history: [] });
        logAudit('create', 'Bill', name || category);
      }
      await Storage.save(state); showToast(isEdit ? 'Changes saved' : `${cfg.noun} added`); closeModal(); renderLiabilities();
    };
  });
}

function renderCreditCards() {
  const wrap = document.getElementById('liab-content');
  const toolbar = `<div class="flex-between block" style="gap:10px;flex-wrap:wrap;">
    <div style="display:flex;gap:10px;flex:1;min-width:220px;">
      ${liabSearchBoxHTML('Search credit cards…')}
      ${liabSortSelectHTML()}
    </div>
    <button class="btn btn-primary" id="btn-add-card">+ Add Credit Card</button>
  </div>`;
  if (!state.creditCards.length) {
    wrap.innerHTML = toolbar + `<div class="card empty-state">${emptyStateIcon()}<div class="big">No credit cards tracked</div>Add a card, then log each monthly statement as a bill.</div>`;
    document.getElementById('btn-add-card').onclick = openAddCardModal;
    wireLiabSortSelect(); wireLiabSearchBox();
    return;
  }
  const q = liabSearchQuery.trim().toLowerCase();
  const visibleCards = q ? state.creditCards.filter(c => c.name.toLowerCase().includes(q) || (c.issuerBank || '').toLowerCase().includes(q)) : state.creditCards;
  if (!visibleCards.length) {
    wrap.innerHTML = toolbar + `<div class="card empty-state">${emptyStateIcon()}<div class="big">No cards match “${escapeAttr(liabSearchQuery)}”</div></div>`;
    document.getElementById('btn-add-card').onclick = openAddCardModal;
    wireLiabSortSelect(); wireLiabSearchBox();
    return;
  }
  function cardRowsHTML(cards) {
    let rows = '';
    sortByAmount(cards, creditCardOutstanding).forEach(c => {
      const outstanding = creditCardOutstanding(c);
      const unpaidCount = c.bills.filter(b => !b.paid).length;
      const util = creditCardUtilization(c);
      const utilBand = creditUtilizationBand(util);
      rows += `<tr class="data-row" id="card-row-${c.id}">
        <td>
          <div class="row-name">
            <span class="avatar-chip">${c.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}</span>
            <div>
              <div>${escapeHTML(c.name)}</div>
              ${util !== null ? `<div class="jn ${semanticClass(utilBand.sem)}" style="margin-top:2px;">${util.toFixed(0)}% of ${fmtINR(c.creditLimit)} limit</div>` : ''}
            </div>
          </div>
          <div class="btn-row" style="margin-top:7px;gap:5px;margin-left:40px;">
            ${unpaidCount ? `<button class="btn btn-ghost btn-sm" data-quick-pay-card="${c.id}" style="padding:2px 7px;font-size:10.5px;">Mark Latest Bill Paid</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-quick-gen-bill="${c.id}" style="padding:2px 7px;font-size:10.5px;">+ Generate Next Bill</button>
            <button class="btn btn-ghost btn-sm" data-quick-view-card="${c.id}" style="padding:2px 7px;font-size:10.5px;" title="Fast glance without opening the full row">Quick View</button>
          </div>
        </td>
        <td class="num">${c.bills.length}</td>
        <td class="num">${unpaidCount}</td>
        <td class="num ${outstanding > 0 ? 'loss' : ''}">${fmtINR(outstanding)}</td>
      </tr>`;
      if (openLiabIds.has(c.id)) rows += creditCardDetailHTML(c);
    });
    return rows;
  }
  function cardTableHTML(cards) {
    return `<div class="card" style="padding:0;overflow-x:auto;">
      <table class="ledger">
        <thead><tr><th>Card</th><th class="num">Bills Logged</th><th class="num">Unpaid</th><th class="num">Outstanding</th></tr></thead>
        <tbody>${cardRowsHTML(cards)}</tbody>
      </table>
    </div>`;
  }
  const hasUPIGrouping = visibleCards.some(c => c.isUPI);
  let tableHTML;
  if (hasUPIGrouping) {
    const upiCards = visibleCards.filter(c => c.isUPI);
    const otherCards = visibleCards.filter(c => !c.isUPI);
    tableHTML = `
      ${upiCards.length ? `<div class="section-label" style="margin:16px 0 8px;">UPI Cards</div>${cardTableHTML(upiCards)}` : ''}
      ${otherCards.length ? `<div class="section-label" style="margin:16px 0 8px;">Non-UPI Cards</div>${cardTableHTML(otherCards)}` : ''}
    `;
  } else {
    tableHTML = cardTableHTML(visibleCards);
  }
  wrap.innerHTML = toolbar + tableHTML;
  document.getElementById('btn-add-card').onclick = openAddCardModal;
  wireLiabSortSelect(); wireLiabSearchBox();
  visibleCards.forEach(c => { const r = document.getElementById('card-row-' + c.id); if (r) r.onclick = () => { toggleLiab(c.id); renderLiabilities(); }; });
  wireCreditCardEvents();
  wireCreditCardQuickActions();
}

function creditCardDetailHTML(c) {
  const billRows = [...c.bills].sort((a, b) => new Date(b.billDate) - new Date(a.billDate)).map(b => {
    const dueSoon = !b.paid && daysBetween(todayISO(), b.dueDate) <= 5 && daysBetween(todayISO(), b.dueDate) >= 0;
    const overdue = !b.paid && new Date(b.dueDate) < new Date(todayISO());
    const status = b.paid ? '<span class="badge b-favorable">Paid</span>' : (overdue ? '<span class="badge b-adverse">Overdue</span>' : (dueSoon ? '<span class="badge b-caution">Due Soon</span>' : '<span class="badge b-neutral">Unpaid</span>'));
    return `<tr>
      <td>${fmtDate(b.billDate)}</td><td>${fmtDate(b.dueDate)}</td>
      <td class="num">${fmtINR(b.amount)}</td>
      <td class="num">${b.paid ? fmtINR(b.paidAmount || b.amount) : '—'}</td>
      <td>${status}</td>
      <td class="num">
        ${!b.paid ? `<button class="btn btn-ghost btn-sm" data-quick-pay-bill="${c.id}|${b.id}">Mark Paid</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-edit-bill="${c.id}|${b.id}">Edit</button>
        <button class="btn btn-ghost btn-sm" data-del-bill="${c.id}|${b.id}">Delete</button>
      </td>
    </tr>`;
  }).join('');
  // Combined bank limit across all cards from same issuer
  let combinedLimitHTML = '';
  if (c.issuerBank && c.combinedBankLimit) {
    const sameIssuerCards = state.creditCards.filter(x => x.issuerBank === c.issuerBank);
    const totalOutstanding = sameIssuerCards.reduce((s, x) => s + creditCardOutstanding(x), 0);
    const combinedUtil = c.combinedBankLimit > 0 ? (totalOutstanding / c.combinedBankLimit) * 100 : null;
    combinedLimitHTML = `<div class="jn" style="margin-top:4px;">Combined ${c.issuerBank} limit: ${fmtINR(c.combinedBankLimit)} · ${sameIssuerCards.length} card${sameIssuerCards.length !== 1 ? 's' : ''} · ${fmtINR(totalOutstanding)} used${combinedUtil !== null ? ` (${combinedUtil.toFixed(0)}%)` : ''}</div>`;
  }
  // Linked EMIs (Item H) — loans converted from a purchase on this card, blocking part of its limit
  const linkedLoans = state.loans.filter(l => l.linkedCardId === c.id);
  let linkedEMIsHTML = '';
  if (linkedLoans.length) {
    const linkedTotal = linkedLoans.reduce((s, l) => s + loanActualBalance(l), 0);
    linkedEMIsHTML = `
      <div class="jn" style="margin:14px 0 8px;text-transform:uppercase;letter-spacing:0.06em;">Linked EMIs <span style="font-weight:400;text-transform:none;letter-spacing:0;">— counted against this card's limit, tracked as their own Loan/EMI entries</span></div>
      <table class="ledger"><thead><tr><th>EMI</th><th class="num">Outstanding</th></tr></thead><tbody>
        ${linkedLoans.map(l => `<tr><td>${escapeHTML(l.name)}</td><td class="num">${fmtINR(loanActualBalance(l))}</td></tr>`).join('')}
      </tbody></table>
      <div class="jn" style="margin-top:6px;color:var(--red);">Total blocked by linked EMIs: ${fmtINR(linkedTotal)}</div>`;
  }
  return `<tr class="detail-row open"><td colspan="4">
    <div class="flex-between" style="margin-bottom:14px;">
      <div>
        <div style="font-family:var(--font-display);font-size:15px;">${escapeHTML(c.name)}</div>
        ${c.issuerBank ? `<div class="jn" style="margin-top:2px;">Issuer: ${c.issuerBank}</div>` : ''}
        ${combinedLimitHTML}
      </div>
      <div class="btn-row">
        <button class="btn btn-sm" data-bulk-mark-paid="${c.id}">Bulk Mark Paid</button>
        <button class="btn btn-sm" data-add-bill="${c.id}">+ Log Bill</button>
        <button class="btn btn-sm" data-edit-card="${c.id}">Edit Card</button>
        <button class="btn btn-sm btn-danger" data-del-card="${c.id}">Delete Card</button>
      </div>
    </div>
    ${c.bills.length ? `<table class="ledger"><thead><tr><th>Bill Date</th><th>Due Date</th><th class="num">Amount</th><th class="num">Paid</th><th>Status</th><th></th></tr></thead><tbody>${billRows}</tbody></table>` : '<div class="empty-state">No bills logged yet.</div>'}
    ${linkedEMIsHTML}
  </td></tr>`;
}

function wireCreditCardEvents() {
  document.querySelectorAll('[data-add-bill]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openAddBillModal(b.dataset.addBill); });
  document.querySelectorAll('[data-edit-card]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openEditCardModal(b.dataset.editCard); });
  document.querySelectorAll('[data-del-card]').forEach(b => b.onclick = (e) => { e.stopPropagation(); deleteCard(b.dataset.delCard); });
  document.querySelectorAll('[data-quick-pay-bill]').forEach(b => b.onclick = (e) => { e.stopPropagation(); const [cid, bid] = b.dataset.quickPayBill.split('|'); quickMarkBillPaid(cid, bid); });
  document.querySelectorAll('[data-edit-bill]').forEach(b => b.onclick = (e) => { e.stopPropagation(); const [cid, bid] = b.dataset.editBill.split('|'); openEditBillModal(cid, bid); });
  document.querySelectorAll('[data-del-bill]').forEach(b => b.onclick = (e) => { e.stopPropagation(); const [cid, bid] = b.dataset.delBill.split('|'); deleteBill(cid, bid); });
  document.querySelectorAll('[data-bulk-mark-paid]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openBulkMarkPaidModal(b.dataset.bulkMarkPaid); });
}

/* ---------- Item 4: Bulk Mark Paid modal ----------
   Shows all unpaid bills for a card with checkboxes; user selects which to mark paid. */
function openBulkMarkPaidModal(cardId) {
  const card = state.creditCards.find(c => c.id === cardId);
  if (!card) return;
  const unpaid = card.bills.filter(b => !b.paid).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
  if (!unpaid.length) { showToast('No unpaid bills for this card'); return; }
  const billRows = unpaid.map(b => `
    <div class="toggle-row" style="border-bottom:1px solid var(--border-soft);padding:8px 0;">
      <input type="checkbox" id="bulk-bill-${b.id}" value="${b.id}" checked />
      <label for="bulk-bill-${b.id}" style="flex:1;display:flex;justify-content:space-between;">
        <span>${fmtDate(b.billDate)} — due ${fmtDate(b.dueDate)}</span>
        <span class="num">${fmtINR(b.amount)}</span>
      </label>
    </div>`).join('');
  openModal(`
    <h3>Bulk Mark Bills Paid</h3>
    <div class="modal-sub">${escapeHTML(card.name)} — ${unpaid.length} unpaid bill${unpaid.length !== 1 ? 's' : ''}</div>
    <div style="margin-bottom:10px;">${billRows}</div>
    <div class="field helptext">Each selected bill will be marked paid at full amount today. Use Edit on individual bills to set a partial payment or different date.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Mark Selected as Paid</button>
    </div>
  `, (modal) => {
    modal.querySelector('#f-cancel').onclick = closeModal;
    modal.querySelector('#f-save').onclick = async () => {
      const checked = [...modal.querySelectorAll('input[type="checkbox"]:checked')].map(x => x.value);
      if (!checked.length) { showToast('No bills selected'); return; }
      checked.forEach(billId => {
        const bill = card.bills.find(b => b.id === billId);
        if (bill) { bill.paid = true; bill.paidAmount = bill.amount; bill.paidDate = todayISO(); }
      });
      logTransaction('update', 'Credit Card Bill', card.name, `${checked.length} bill${checked.length !== 1 ? 's' : ''} bulk marked paid`);
      await Storage.save(state);
      closeModal();
      showToast(`${checked.length} bill${checked.length !== 1 ? 's' : ''} marked paid`);
      openLiabIds.add(cardId);
      renderLiabilities();
    };
  });
}

/* ---------- Credit Card / Loan / Cash Loan quick actions (spec 3.3) ----------
   One-click, no modal, for the overwhelmingly common case; corrections (a different
   amount, a different date) still go through the existing Edit modals unchanged. */
async function quickMarkBillPaid(cardId, billId) {
  const card = state.creditCards.find(c => c.id === cardId);
  if (!card) return;
  const bill = card.bills.find(b => b.id === billId);
  if (!bill) return;
  bill.paidAmount = bill.amount;
  bill.paidDate = todayISO();
  bill.paid = true;
  logTransaction('update', 'Credit Card Bill', card.name, `${fmtINR(bill.amount)} marked paid`);
  mirrorAutoExpense('Credit Card Bill', card.name, bill.amount, bill.paidDate, null, `cardbill-${bill.id}`);
  await Storage.save(state);
  showToast('Bill marked paid');
  openLiabIds.add(cardId);
  renderLiabilities();
  renderDashboard();
}
function nearestUnpaidBill(card) {
  return card.bills.filter(b => !b.paid).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate))[0] || null;
}
async function quickMarkLatestBillPaid(cardId) {
  const card = state.creditCards.find(c => c.id === cardId);
  if (!card) return;
  const bill = nearestUnpaidBill(card);
  if (!bill) { showToast('No unpaid bills for this card'); return; }
  await quickMarkBillPaid(cardId, bill.id);
}
function quickGenerateNextBill(cardId) {
  const card = state.creditCards.find(c => c.id === cardId);
  if (!card) return;
  const lastBill = card.bills.slice().sort((a, b) => new Date(b.billDate) - new Date(a.billDate))[0];
  if (!lastBill) { showToast('Log at least one bill manually first, so the next date can be inferred'); return; }
  const offset = card.dueDayOffset || 20;
  const billDate = addMonths(lastBill.billDate, 1);
  const dueDate = addDays(billDate, offset);
  openModal(`
    <h3>Generate Next Bill</h3>
    <div class="modal-sub">${escapeHTML(card.name)} — bill date ${fmtDate(billDate)}, due ${fmtDate(dueDate)}</div>
    <div class="field">
      <label>Bill Amount (₹)</label>
      <input type="number" id="f-gen-amount" step="any" placeholder="${lastBill.amount}" value="${lastBill.amount}" />
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="f-same-as-prev" />
      <label for="f-same-as-prev">Use same amount as previous bill (${fmtINR(lastBill.amount)})</label>
    </div>
    <div class="field helptext">Bill date is one month after the last bill. Adjust the amount if this month's bill differs, or check the box to copy it from last month.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      <button class="btn btn-primary" id="f-save">Generate Bill</button>
    </div>
  `, (modal) => {
    const amountEl = modal.querySelector('#f-gen-amount');
    modal.querySelector('#f-same-as-prev').onchange = (e) => {
      if (e.target.checked) { amountEl.value = lastBill.amount; amountEl.disabled = true; }
      else { amountEl.disabled = false; }
    };
    modal.querySelector('#f-cancel').onclick = closeModal;
    modal.querySelector('#f-save').onclick = async () => {
      const amount = parseFloat(amountEl.value);
      if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
      card.bills.push({ id: uid(), billDate, dueDate, amount, paid: false, paidAmount: 0, paidDate: null });
      logTransaction('add', 'Credit Card Bill', card.name, `${fmtINR(amount)} due ${fmtDate(dueDate)}`);
      await Storage.save(state);
      closeModal();
      showToast(`Bill generated — ${fmtINR(amount)} due ${fmtDate(dueDate)}`);
      openLiabIds.add(cardId);
      renderLiabilities();
    };
  });
}
function wireCreditCardQuickActions() {
  document.querySelectorAll('[data-quick-pay-card]').forEach(b => b.onclick = (e) => { e.stopPropagation(); quickMarkLatestBillPaid(b.dataset.quickPayCard); });
  document.querySelectorAll('[data-quick-gen-bill]').forEach(b => b.onclick = (e) => { e.stopPropagation(); quickGenerateNextBill(b.dataset.quickGenBill); });
  document.querySelectorAll('[data-quick-view-card]').forEach(b => b.onclick = (e) => { e.stopPropagation(); openCreditCardQuickView(b.dataset.quickViewCard); });
}

/* V6 — read-only fast-glance drawer for a credit card. Deliberately read-only (no mutation
   wiring) so it stays simple: mutations still happen via the tested inline detail-row expand
   (toggleLiab). The drawer's own "Manage Bills" button just closes itself and triggers that
   existing expand path. */
function openCreditCardQuickView(cardId) {
  const c = state.creditCards.find(x => x.id === cardId);
  if (!c) return;
  const outstanding = creditCardOutstanding(c);
  const unpaid = c.bills.filter(b => !b.paid);
  const nextBill = nearestUnpaidBill(c);
  const util = creditCardUtilization(c);
  const utilBand = util !== null ? creditUtilizationBand(util) : null;
  openDrawer(`
    <div class="drawer-header"><h3>${escapeHTML(c.name)}</h3><button class="drawer-close" aria-label="Close">✕</button></div>
    <div class="drawer-sub">${c.issuerBank ? `Issued by ${c.issuerBank}` : 'Credit card'} · ${c.bills.length} bill${c.bills.length !== 1 ? 's' : ''} logged</div>
    <div class="drawer-section">
      <div class="drawer-stat-grid">
        ${drawerStatHTML('Outstanding', fmtINR(outstanding))}
        ${drawerStatHTML('Unpaid Bills', unpaid.length)}
        ${util !== null ? `<div class="drawer-stat"><div class="k">Utilization</div><div class="v num ${semanticClass(utilBand.sem)}">${util.toFixed(0)}%</div></div>` : ''}
        ${drawerStatHTML('Credit Limit', c.creditLimit ? fmtINR(c.creditLimit) : '—')}
      </div>
    </div>
    ${nextBill ? `
    <div class="drawer-section">
      <div class="dt-label">Next Due</div>
      <div class="card" style="padding:14px;">
        <div class="flex-between"><span>${fmtDate(nextBill.dueDate)}</span><span class="num" style="font-weight:600;">${fmtINR(nextBill.amount)}</span></div>
      </div>
    </div>` : `<div class="drawer-section"><div class="empty-state" style="padding:20px;">No unpaid bills — you're all caught up.</div></div>`}
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="drawer-manage-bills">Manage Bills →</button>
  `);
  document.getElementById('drawer-manage-bills').onclick = () => {
    closeDrawer();
    openLiabIds.add(cardId);
    renderLiabilities();
    setTimeout(() => document.getElementById('card-row-' + cardId)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 60);
  };
}

/* ---------- Loans & EMIs ---------- */
function renderLoans() {
  const wrap = document.getElementById('liab-content');
  const filterPills = ['All', ...state.loanCategories].map(c =>
    `<button data-loan-cat-filter="${escapeAttr(c)}" class="${loanCategoryFilter === c ? 'active' : ''}">${c}</button>`
  ).join('');
  const toolbar = `<div class="flex-between block" style="gap:10px;flex-wrap:wrap;">
    <div style="display:flex;gap:10px;flex:1;min-width:220px;">
      ${liabSearchBoxHTML('Search loans & EMIs…')}
      ${liabSortSelectHTML()}
    </div>
    <button class="btn btn-primary" id="btn-add-loan">+ Add Loan / EMI</button>
  </div>
  ${state.loans.length ? `<div class="subtabs" style="margin-bottom:14px;">${filterPills}</div>` : ''}`;
  if (!state.loans.length) {
    wrap.innerHTML = toolbar + `<div class="card empty-state">${emptyStateIcon()}<div class="big">No loans tracked</div>Add a personal loan or any EMI — the amortization schedule is generated automatically.</div>`;
    document.getElementById('btn-add-loan').onclick = openAddLoanModal;
    wireLiabSortSelect(); wireLiabSearchBox();
    return;
  }
  const q = liabSearchQuery.trim().toLowerCase();
  let visibleLoans = state.loans;
  if (loanCategoryFilter !== 'All') visibleLoans = visibleLoans.filter(l => l.category === loanCategoryFilter);
  if (q) visibleLoans = visibleLoans.filter(l => l.name.toLowerCase().includes(q) || (l.category || '').toLowerCase().includes(q));
  if (!visibleLoans.length) {
    wrap.innerHTML = toolbar + `<div class="card empty-state">${emptyStateIcon()}<div class="big">No loans match ${q ? `“${escapeAttr(liabSearchQuery)}”` : `this filter`}</div></div>`;
    document.getElementById('btn-add-loan').onclick = openAddLoanModal;
    wireLiabSortSelect(); wireLiabSearchBox();
    document.querySelectorAll('[data-loan-cat-filter]').forEach(b => b.onclick = () => { loanCategoryFilter = b.dataset.loanCatFilter; renderLoans(); });
    return;
  }
  let rows = '';
  sortByAmount(visibleLoans, loanActualBalance).forEach(l => {
    const emi = emiAmount(l.principal, l.rate, l.tenureMonths, l.interestType);
    const schedBal = loanScheduledBalance(l);
    const actualBal = loanActualBalance(l);
    const diff = actualBal - schedBal;
    const status = Math.abs(diff) < 1 ? '<span class="badge b-neutral">On Track</span>' : (diff < 0 ? `<span class="badge b-favorable">Ahead ${fmtINR(Math.abs(diff))}</span>` : `<span class="badge b-caution">Behind ${fmtINR(diff)}</span>`);
    const cls = loanDebtClass(l);
    rows += `<tr class="data-row" id="loan-row-${l.id}">
      <td>
        <div class="row-name">
          <span class="avatar-chip">${l.name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}</span>
          <div>
            <div>${escapeHTML(l.name)}</div>
            <div class="jn ${semanticClass(debtClassSemantic(cls))}" style="margin-top:2px;">${escapeHTML(l.category)} · ${debtClassLabel(cls)} Debt</div>
          </div>
        </div>
        <div class="btn-row" style="margin-top:7px;gap:5px;margin-left:40px;">
          <button class="btn btn-ghost btn-sm" data-quick-log-emi="${l.id}" style="padding:2px 7px;font-size:10.5px;">Log EMI Payment</button>
        </div>
      </td>
      <td class="num">${fmtINR(l.principal)}</td>
      <td class="num">${fmtINR(emi, { decimals: 0 })}</td>

        ${payRows ? `<table class="ledger"><thead><tr><th>Date</th><th class="num">Amount</th><th></th></tr></thead><tbody>${payRows}</tbody></table>` : '<div class="empty-state">No payments logged yet.</div>'}
      </div>

async function quickLogEMIPayment(loanId) {
  const loan = state.loans.find(l => l.id === loanId);
  if (!loan) return;
  const emi = emiAmount(loan.principal, loan.rate, loan.tenureMonths, loan.interestType);
  if (!emi) { showToast('Cannot compute an EMI for this loan — check its rate/tenure'); return; }
  loan.payments = loan.payments || [];
  const paidAmount = Math.round(emi * 100) / 100;
  const paidDate = todayISO();
  const payment = { id: uid(), date: paidDate, amount: paidAmount };
  loan.payments.push(payment);
  logTransaction('add', 'Loan Payment', loan.name, `${fmtINR(emi)} on ${fmtDate(paidDate)}`);
  // linkedId keyed off this payment's own stable id (Phase 7 hardening — see
  // openLoanPaymentFormModal for the matching edit/delete linkedId scheme).
  mirrorAutoExpense('EMI/Loan Payment', loan.name, paidAmount, paidDate, null, `loan-${loanId}-${payment.id}`);
  await Storage.save(state);
  showToast('EMI payment logged — ' + fmtINR(emi));
  openLiabIds.add(loanId);
  renderLiabilities();
  renderDashboard();
}

/* ---- Credit Card ---- */
function openCardFormModal(existingCard) {
  const isEdit = !!existingCard;
  const issuerBankOptions = (state.settings.issuerBanks || []).map(b =>
    `<option value="${escapeAttr(b)}" ${isEdit && existingCard.issuerBank === b ? 'selected' : ''}>${b}</option>`
  ).join('');

  openModal(`
    <h3>${isEdit ? 'Edit Credit Card' : 'Add Credit Card'}</h3>
    ${!isEdit && cardTemplates.length ? `
    <div class="field-row" style="align-items:flex-end;">
      <div class="field">
        <label>Start from Template <span class="hint" style="text-transform:none;">optional</span></label>
        <select id="f-card-template">
          <option value="">— Blank card —</option>
          ${cardTemplates.map(t => `<option value="${t.id}">${escapeHTML(t.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <button class="btn btn-ghost btn-sm" id="f-card-template-delete" type="button" style="display:none;">✕ Delete Template</button>
      </div>
    </div>` : ''}
    <div class="field"><label>Card Name</label><input id="f-name" placeholder="e.g. HDFC Regalia, ICICI Coral" value="${isEdit ? existingCard.name : ''}" /></div>
    <div class="field-row">
      <div class="field">
        <label>Issuer Bank <span class="hint" style="text-transform:none;">optional</span></label>
        <select id="f-issuer-bank">
          <option value="">— Select Bank —</option>
          ${issuerBankOptions}
          <option value="__other__">Other (type below)</option>
        </select>
      </div>
      <div class="field" id="f-issuer-bank-other-wrap" style="display:none;">
        <label>Bank Name</label>
        <input id="f-issuer-bank-other" placeholder="e.g. Kotak, Yes Bank" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Bill Date <span class="hint" style="text-transform:none;">any recent statement date</span></label>
        <input type="date" id="f-bill-date" value="${isEdit ? (existingCard.sampleBillDate || '') : ''}" />
      </div>
      <div class="field">
        <label>Due Date <span class="hint" style="text-transform:none;">for that same bill</span></label>
        <input type="date" id="f-due-date" value="${isEdit ? (existingCard.sampleDueDate || '') : ''}" />
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Typical Days from Bill to Due Date <span class="hint" style="text-transform:none;">auto-computed above, or set directly</span></label>
        <input type="number" id="f-due-offset" step="1" placeholder="e.g. 20" value="${isEdit ? (existingCard.dueDayOffset || 20) : 20}" />
      </div>
      <div class="field">
        <label>Individual Credit Limit (₹) <span class="hint" style="text-transform:none;">optional</span></label>
        <input type="number" id="f-credit-limit" step="any" placeholder="e.g. 200000" value="${isEdit ? (existingCard.creditLimit || '') : ''}" />
      </div>
    </div>
    <div class="field">
      <label>Combined Bank Limit (₹) <span class="hint" style="text-transform:none;">optional — total limit the bank caps across all your cards</span></label>
      <input type="number" id="f-combined-limit" step="any" placeholder="e.g. 50000" value="${isEdit ? (existingCard.combinedBankLimit || '') : ''}" />
    </div>
    <div class="field" style="display:flex;align-items:center;gap:8px;flex-direction:row;">
      <input type="checkbox" id="f-is-upi" style="width:auto;" ${isEdit && existingCard.isUPI ? 'checked' : ''} />
      <label style="margin:0;" for="f-is-upi">This is a UPI-linked card <span class="hint" style="text-transform:none;">groups it separately from non-UPI cards in the list</span></label>
    </div>
    <div class="field helptext">Due-date offset auto-fills the due date whenever you log a new bill. Individual limit enables per-card utilization; combined bank limit tracks total exposure across all cards from the same issuer.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      ${isEdit ? `<button class="btn btn-ghost" id="f-save-template">Save as Template</button>` : ''}
      <button class="btn btn-primary" id="f-save">${isEdit ? 'Save Changes' : 'Add Card'}</button>
    </div>
  `, (modal) => {
    // Template picker for add mode
    if (!isEdit && cardTemplates.length) {
      const tSel = modal.querySelector('#f-card-template');
      const tDel = modal.querySelector('#f-card-template-delete');
      tSel.onchange = () => {
        const t = cardTemplates.find(x => x.id === tSel.value);
        tDel.style.display = t ? '' : 'none';
        if (t) {
          const issuerSel = modal.querySelector('#f-issuer-bank');
          if (t.issuerBank && issuerSel) {
            const exists = (state.settings.issuerBanks || []).includes(t.issuerBank);
            issuerSel.value = exists ? t.issuerBank : '__other__';
            if (!exists) { modal.querySelector('#f-issuer-bank-other-wrap').style.display = ''; modal.querySelector('#f-issuer-bank-other').value = t.issuerBank; }
          }
          if (t.dueDayOffset) modal.querySelector('#f-due-offset').value = t.dueDayOffset;
          if (t.creditLimit) modal.querySelector('#f-credit-limit').value = t.creditLimit;
          if (t.combinedBankLimit) modal.querySelector('#f-combined-limit').value = t.combinedBankLimit;
        }
      };
      tDel.onclick = async () => {
        if (!confirm('Delete this template?')) return;
        state.settings.liabTemplates = (state.settings.liabTemplates || []).filter(x => x.id !== tSel.value);
        await Storage.save(state); showToast('Template deleted'); closeModal(); openCardFormModal(null);
      };
    }
    // Pre-fill issuer bank select for edit mode
    if (isEdit && existingCard.issuerBank) {
      const sel = modal.querySelector('#f-issuer-bank');
      const exists = (state.settings.issuerBanks || []).includes(existingCard.issuerBank);
      if (exists) { sel.value = existingCard.issuerBank; }
      else { sel.value = '__other__'; modal.querySelector('#f-issuer-bank-other-wrap').style.display = ''; modal.querySelector('#f-issuer-bank-other').value = existingCard.issuerBank; }
    }
    modal.querySelector('#f-issuer-bank').onchange = (e) => {
      modal.querySelector('#f-issuer-bank-other-wrap').style.display = e.target.value === '__other__' ? '' : 'none';
    };
    // Bill Date / Due Date -> auto-compute the typical-days offset (Item E.10)
    const billDateInput = modal.querySelector('#f-bill-date');
    const dueDateInput = modal.querySelector('#f-due-date');
    const dueOffsetInput = modal.querySelector('#f-due-offset');
    function recomputeOffsetFromDates() {
      if (!billDateInput.value || !dueDateInput.value) return;
      const days = daysBetween(billDateInput.value, dueDateInput.value);
      if (days > 0) dueOffsetInput.value = days;
    }
    billDateInput.addEventListener('change', recomputeOffsetFromDates);
    dueDateInput.addEventListener('change', recomputeOffsetFromDates);
    modal.querySelector('#f-cancel').onclick = closeModal;
    if (isEdit) {
      modal.querySelector('#f-save-template').onclick = async () => {
        const tName = (prompt('Template name:', (existingCard.issuerBank || '') + ' card template') || '').trim();
        if (!tName) return;
        if (!state.settings.liabTemplates) state.settings.liabTemplates = [];
        state.settings.liabTemplates.push({
          id: uid(), name: tName, kind: 'card',
          issuerBank: existingCard.issuerBank || null,
          dueDayOffset: existingCard.dueDayOffset || 20,
          creditLimit: existingCard.creditLimit || null,
          combinedBankLimit: existingCard.combinedBankLimit || null
        });
        await Storage.save(state);
        showToast('Saved as template: ' + tName);
      };
    }
    modal.querySelector('#f-save').onclick = async () => {
      const name = modal.querySelector('#f-name').value.trim();
      if (!name) { showToast('Name is required'); return; }
      const dueDayOffset = parseInt(modal.querySelector('#f-due-offset').value) || 20;
      const sampleBillDate = billDateInput.value || null;
      const sampleDueDate = dueDateInput.value || null;
      const isUPI = modal.querySelector('#f-is-upi').checked;
      // creditLimit/combinedBankLimit are optional -- `|| null` correctly treats blank/zero/NaN
      // as "not set", but a plain `|| null` lets a NEGATIVE number through (negative numbers are
      // truthy), which would later divide utilization % by a negative limit. Explicitly reject
      // negatives back to null too (Phase 6 hardening).
      const creditLimitRaw = parseFloat(modal.querySelector('#f-credit-limit').value);
      const creditLimit = (Number.isFinite(creditLimitRaw) && creditLimitRaw > 0) ? creditLimitRaw : null;
      const combinedLimitRaw = parseFloat(modal.querySelector('#f-combined-limit').value);
      const combinedBankLimit = (Number.isFinite(combinedLimitRaw) && combinedLimitRaw > 0) ? combinedLimitRaw : null;
      const selVal = modal.querySelector('#f-issuer-bank').value;
      let issuerBank = '';
      if (selVal === '__other__') {
        issuerBank = modal.querySelector('#f-issuer-bank-other').value.trim();
        if (issuerBank && !(state.settings.issuerBanks || []).includes(issuerBank)) {
          (state.settings.issuerBanks = state.settings.issuerBanks || []).push(issuerBank);
        }
      } else { issuerBank = selVal; }
      if (isEdit) {
        Object.assign(existingCard, { name, dueDayOffset, sampleBillDate, sampleDueDate, isUPI, creditLimit, combinedBankLimit, issuerBank });
        logAudit('update', 'Credit Card', name);
      } else {
        state.creditCards.push({ id: uid(), name, dueDayOffset, sampleBillDate, sampleDueDate, isUPI, creditLimit, combinedBankLimit, issuerBank, bills: [] });
        logAudit('create', 'Credit Card', name);
      }
      await Storage.save(state);
      closeModal(); showToast(isEdit ? 'Card updated' : 'Card added'); renderLiabilities();
    };
  });
}

function openBillFormModal(cardId, existingBill) {
  const card = state.creditCards.find(c => c.id === cardId);
  if (!card) return;
  const isEdit = !!existingBill;
  const offset = card.dueDayOffset || 20;
  const lastBill = !isEdit ? card.bills.slice().sort((a, b) => new Date(b.billDate) - new Date(a.billDate))[0] : null;
  const suggestedBillDate = isEdit ? existingBill.billDate : (lastBill ? addMonths(lastBill.billDate, 1) : todayISO());
  const suggestedDueDate = isEdit ? existingBill.dueDate : addDays(suggestedBillDate, offset);
  openModal(`
    <h3>${isEdit ? 'Edit Bill' : 'Log Bill'}</h3>
    <div class="modal-sub">${escapeHTML(card.name)}${!isEdit && lastBill ? ' — pre-filled one month after your last bill' : ''}</div>
    <div class="field-row">
      <div class="field"><label>Bill / Statement Date</label><input type="date" id="f-bill-date" value="${suggestedBillDate}" /></div>

/* ---------- Loan Prepayment Calculator (spec 3.4) ----------
   Pure what-if — simulates payoff from today's actual balance at either a lump-sum
   prepayment and/or a new (higher) EMI, and compares against the no-change baseline.
   Never mutates `state`; reuses the loan's own rate, just like amortizationSchedule(). */
function openPrepaymentCalculatorModal(loanId) {
  const loan = state.loans.find(l => l.id === loanId);
  if (!loan) return;
  const currentBalance = loanActualBalance(loan);
  const currentEMI = emiAmount(loan.principal, loan.rate, loan.tenureMonths, loan.interestType);
  openModal(`
    <h3>Prepayment Calculator</h3>
    <div class="modal-sub">${escapeHTML(loan.name)} — current balance ${fmtINR(currentBalance)}, EMI ${fmtINR(currentEMI)}</div>
    <div class="field-row">
      <div class="field"><label>Lump-Sum Prepayment (₹)</label><input type="number" id="f-lumpsum" step="any" placeholder="0.00" /></div>
      <div class="field"><label>New EMI (₹) <span class="hint" style="text-transform:none;">optional</span></label><input type="number" id="f-new-emi" step="any" placeholder="leave blank to keep ${fmtINR(currentEMI, { decimals: 0 })}" /></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>Foreclosure Charges (₹) <span class="hint" style="text-transform:none;">optional</span></label>
        <input type="number" id="f-foreclosure" step="any" placeholder="0.00" />
      </div>
      <div class="field">
        <label>Foreclosure Charge % <span class="hint" style="text-transform:none;">auto-computes charge from balance</span></label>
        <input type="number" id="f-foreclosure-pct" step="any" placeholder="e.g. 2 for 2% of balance" />
      </div>
    </div>
    <div class="field helptext">Simulates payoff from today's actual balance — doesn't change any logged data. Foreclosure charge is a one-time cost deducted from the interest saving to show true net benefit.</div>
    <div id="prepay-result" style="margin-top:14px;"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="f-close">Close</button>
    </div>
  `, (modal) => {
    const lumpsumInput = modal.querySelector('#f-lumpsum');
    const newEmiInput = modal.querySelector('#f-new-emi');
    const foreclosureInput = modal.querySelector('#f-foreclosure');
    const foreclosurePctInput = modal.querySelector('#f-foreclosure-pct');
    const resultDiv = modal.querySelector('#prepay-result');
    const r = loan.rate / 12 / 100;
    // When % is entered, auto-compute flat charge from remaining balance after lump sum
    foreclosurePctInput.addEventListener('input', () => {
      const lumpsum = Math.max(0, parseFloat(lumpsumInput.value) || 0);
      const balAfterLump = Math.max(0, currentBalance - lumpsum);
      const pct = parseFloat(foreclosurePctInput.value) || 0;
      if (pct > 0) foreclosureInput.value = (balAfterLump * pct / 100).toFixed(2);
      recompute();
    });
    function simulate(startBalance, emi) {
      let balance = startBalance, months = 0, interestPaid = 0;
      while (balance > 0.01 && months < 1200) {
        const interest = balance * r;
        let principal = emi - interest;
        if (principal <= 0) return null;
        if (principal > balance) principal = balance;
        balance -= principal;
        interestPaid += interest;
        months++;
      }
      return { months, interestPaid };
    }
    function recompute() {
      const lumpsum = Math.max(0, parseFloat(lumpsumInput.value) || 0);
      const newEmi = parseFloat(newEmiInput.value) || currentEMI;
      const foreclosure = Math.max(0, parseFloat(foreclosureInput.value) || 0);
      const baseline = simulate(currentBalance, currentEMI);
      const withPrepay = simulate(Math.max(0, currentBalance - lumpsum), newEmi);
      if (!baseline || !withPrepay) {
        resultDiv.innerHTML = `<div class="empty-state">That EMI doesn't cover the interest — it would never pay off. Try a higher EMI.</div>`;
        return;
      }
      const monthsSaved = baseline.months - withPrepay.months;
      const interestSaved = baseline.interestPaid - withPrepay.interestPaid;
      const netSaving = interestSaved - foreclosure;
      const worthIt = netSaving > 0;
      resultDiv.innerHTML = `

/* ===================== CASH FLOW (Income & Expenses) =====================
   Parallel manual-effort-reduction ledger — see the plan discussed in-chat.
   Design choices worth remembering:
   - income[] / expenses[] are separate arrays, same {id,date,category,amount,
     account,note,recurring,source,linkedId} shape.
   - source:'auto' entries are mirrored in by mirrorAutoExpense() whenever a
     Bill / Card Bill / Loan EMI is marked paid elsewhere in the app, so paid
     obligations are never logged twice. They render with an "Auto" badge and
     are NOT independently editable here — edit the underlying payment in
     Liabilities instead, which is the single source of truth for it.
   - Deliberately NOT wired into Assets/net worth. This ledger explains *why*
     net worth moved; it never silently moves it.
   ========================================================================= */
let cfIncomeFilter = 'All', cfExpenseFilter = 'All', cfIncomeSearch = '', cfExpenseSearch = '';

/* Upsert semantics: creates the auto-expense for this linkedId if none exists yet, or
   updates the existing one in place if it does. Previously this only ever created-once
   and silently no-opped on a repeat call, so editing a payment's amount/date never
   propagated to its mirrored Cash Flow entry (Phase 7 hardening) -- see also
   unmirrorAutoExpense()/unmirrorAutoExpensesByPrefix() for the delete/unpay side. */
function mirrorAutoExpense(category, note, amount, date, account, linkedId) {
  if (!amount || amount <= 0) { if (linkedId) unmirrorAutoExpense(linkedId); return; }
  const existing = linkedId ? state.expenses.find(e => e.linkedId === linkedId && e.source === 'auto') : null;
  if (existing) {
    Object.assign(existing, { date: date || todayISO(), category, amount, account: account || '—', note });
    return;
  }
  state.expenses.push({
    id: uid(), date: date || todayISO(), category, amount, account: account || '—',
    note, recurring: null, source: 'auto', linkedId: linkedId || null
  });
}
// Removes the single automatic Cash Flow entry linked to a deleted/unpaid source payment
// event. Manually created entries (source !== 'auto') are never touched.
function unmirrorAutoExpense(linkedId) {
  if (!linkedId) return;
  state.expenses = state.expenses.filter(e => !(e.linkedId === linkedId && e.source === 'auto'));
}
// Removes ALL automatic Cash Flow entries whose linkedId starts with the given prefix --
// used when a whole parent record (e.g. a recurring Bill with many paid instances in its
// history) is deleted outright, not just one payment event.
function unmirrorAutoExpensesByPrefix(prefix) {
  if (!prefix) return;
  state.expenses = state.expenses.filter(e => !(e.source === 'auto' && e.linkedId && e.linkedId.startsWith(prefix)));
}

function cfMonthRange(monthsBack) {
  const end = todayISO().slice(0, 7);
  const start = addMonths(todayISO(), -monthsBack).slice(0, 7);
  return { start, end };
}
function cfSumForMonth(arr, ym) { return arr.filter(e => e.date && e.date.slice(0, 7) === ym).reduce((s, e) => s + (e.amount || 0), 0); }
function cfCurrentMonthKey() { return todayISO().slice(0, 7); }
function cfPrevMonthKey() { return addMonths(todayISO(), -1).slice(0, 7); }

function cashflowSummary() {
  const thisM = cfCurrentMonthKey(), prevM = cfPrevMonthKey();
  const income = cfSumForMonth(state.income, thisM);
  const expenses = cfSumForMonth(state.expenses, thisM);
  const prevIncome = cfSumForMonth(state.income, prevM);
  const prevExpenses = cfSumForMonth(state.expenses, prevM);
  const net = income - expenses;
  const prevNet = prevIncome - prevExpenses;
  const savingsRate = income > 0 ? (net / income) * 100 : null;
  const prevSavingsRate = prevIncome > 0 ? (prevNet / prevIncome) * 100 : null;
  return { income, expenses, net, savingsRate, prevIncome, prevExpenses, prevNet, prevSavingsRate };
}

function cfCategoryBreakdown(arr, ym) {
  const rows = arr.filter(e => e.date && e.date.slice(0, 7) === ym);
  const byCat = {};
  rows.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (e.amount || 0); });
  const total = Object.values(byCat).reduce((s, v) => s + v, 0);
  const palette = ['var(--chart-comp-growth)', 'var(--red)', 'var(--orange)', 'var(--chart-comp-defensive)', 'var(--chart-comp-liquid)', 'var(--gold)', 'var(--text-dim)'];
  return Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([category, amount], i) => ({
    category, amount, pct: total > 0 ? (amount / total) * 100 : 0, color: palette[i % palette.length]
  }));
}

function householdCashflow(monthsBack = 6) {
  const months = [];
  for (let i = monthsBack - 1; i >= 0; i--) {
    const ym = addMonths(todayISO(), -i).slice(0, 7);
    months.push({ ym, income: cfSumForMonth(state.income, ym), expenses: cfSumForMonth(state.expenses, ym) });
  }
  return months;
}

function cfDeltaText(curr, prev, invert) {
  if (!prev) return { sem: 'neutral', text: 'No prior month to compare' };
  const delta = curr - prev;
  if (delta === 0) return { sem: 'neutral', text: 'No change vs last month' };
  const pct = Math.abs(delta) / Math.abs(prev) * 100;
  const rising = delta > 0;
  const favorable = invert ? !rising : rising;
  const sem = favorable ? 'favorable' : 'adverse';
  const arrow = rising ? '↑' : '↓';
  return { sem, text: `${arrow} ${fmtINR(Math.abs(delta))} (${pct.toFixed(1)}%) vs last month` };
}
function dashboardCashflowSectionHTML() {
  const s = cashflowSummary();
  const incDelta = cfDeltaText(s.income, s.prevIncome, false);
  const expDelta = cfDeltaText(s.expenses, s.prevExpenses, true);
  const srDelta = (s.savingsRate !== null && s.prevSavingsRate !== null)
    ? { sem: s.savingsRate >= s.prevSavingsRate ? 'favorable' : 'adverse', text: `${s.savingsRate >= s.prevSavingsRate ? '↑' : '↓'} ${Math.abs(s.savingsRate - s.prevSavingsRate).toFixed(1)}pp vs last month` }
    : { sem: 'neutral', text: 'No prior month to compare' };
  return `
    <section class="block">
      <div class="section-label">Cash Flow <span class="hint">this month · from the Cash Flow tab</span></div>
      <div class="grid-3">
        <div class="stat-card" style="${statCardAccentStyle('favorable')};cursor:pointer;" onclick="goCashflow('income')" title="Go to Cash Flow → Income">
          <div class="label">Income <span style="font-size:10px;opacity:0.45;font-weight:400;">→</span></div>
          <div class="value num">${fmtINR(s.income)}</div>
          <div class="delta ${semanticClass(incDelta.sem)}">${state.income.length ? incDelta.text : 'No income logged yet'}</div>
        </div>
        <div class="stat-card" style="${statCardAccentStyle('adverse')};cursor:pointer;" onclick="goCashflow('expenses')" title="Go to Cash Flow → Expenses">
          <div class="label">Expenses <span style="font-size:10px;opacity:0.45;font-weight:400;">→</span></div>
          <div class="value num">${fmtINR(s.expenses)}</div>
          <div class="delta ${semanticClass(expDelta.sem)}">${state.expenses.length ? expDelta.text : 'No expenses logged yet'}</div>
        </div>
        <div class="stat-card" style="${statCardAccentStyle('neutral')};cursor:pointer;" onclick="goCashflow('overview')" title="Go to Cash Flow → Overview">
          <div class="label">Savings Rate <span style="font-size:10px;opacity:0.45;font-weight:400;">→</span></div>
          <div class="value num">${s.savingsRate !== null ? s.savingsRate.toFixed(1) + '%' : '—'}</div>
          <div class="delta ${semanticClass(srDelta.sem)}">${srDelta.text}</div>
        </div>
      </div>
    </section>`;
}

function renderCfLedger(which) {
  const isIncome = which === 'income';
  const body = document.getElementById('cf-body');
  const cats = isIncome ? state.categoriesIncome : state.categoriesExpenses;
  const filter = isIncome ? cfIncomeFilter : cfExpenseFilter;

  const arr = (isIncome ? state.income : state.expenses).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
  const filtered = arr.filter(e => {
    const catOk = filter === 'All' || e.category === filter;
    const q = search.trim().toLowerCase();
    const textOk = !q || `${e.category} ${e.note || ''} ${e.account || ''}`.toLowerCase().includes(q);
    return catOk && textOk;
  });
  const chipCats = ['All', ...cats];

function openIncomeExpenseFormModal(type, existing = null) {
  const isIncome = type === 'income';
  const cats = isIncome ? state.categoriesIncome : state.categoriesExpenses;
  openModal(`
    <h3>${existing ? 'Edit' : 'Add'} ${isIncome ? 'Income' : 'Expense'}</h3>
    <div class="field-row">
      <div class="field"><label>Date</label><input type="date" id="f-cf-date" value="${existing ? existing.date : todayISO()}"></div>
      <div class="field"><label>Amount (₹)</label><input type="number" id="f-cf-amount" min="0" step="any" value="${existing ? existing.amount : ''}" placeholder="0"></div>
    </div>
    <div class="field"><label>Category</label><select id="f-cf-category">${cats.map(c => `<option ${existing && existing.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="field-row">
      <div class="field"><label>Account / Source</label><input type="text" id="f-cf-account" value="${existing ? escapeAttr(existing.account || '') : ''}" placeholder="e.g. HDFC Savings, Cash, UPI"></div>
      <div class="field"><label>Note (optional)</label><input type="text" id="f-cf-note" value="${existing ? escapeAttr(existing.note || '') : ''}" placeholder="Short description"></div>
    </div>
    ${!existing ? repeatControlsHTML({ defaultCount: 12 }) : ''}
    <div class="btn-row" style="margin-top:18px;justify-content:flex-end;">
      <button class="btn" id="btn-cf-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-cf-save">${existing ? 'Save Changes' : 'Save Entry'}</button>
    </div>
  `, (modal) => {
    wireRepeatToggle(modal);
    modal.querySelector('#btn-cf-cancel').onclick = closeModal;
    modal.querySelector('#btn-cf-save').onclick = async () => {
      const date = modal.querySelector('#f-cf-date').value || todayISO();
      const amount = parseFloat(modal.querySelector('#f-cf-amount').value);
      if (!amount || amount <= 0) { showToast('Enter a valid amount'); return; }
      const category = modal.querySelector('#f-cf-category').value;
      const account = modal.querySelector('#f-cf-account').value.trim();
      const note = modal.querySelector('#f-cf-note').value.trim();
      const arr = isIncome ? state.income : state.expenses;
      if (existing) {
        Object.assign(existing, { date, amount, category, account, note });
        logTransaction('update', isIncome ? 'Income' : 'Expense', category, `${fmtINR(amount)} on ${fmtDate(date)}`);
      } else {
        const dates = getRepeatOccurrences(modal, date);
        const recurring = dates.length > 1 ? { freq: modal.querySelector('#f-freq') ? modal.querySelector('#f-freq').value : 'monthly', count: dates.length } : null;
        dates.forEach(d => arr.push({ id: uid(), date: d, category, amount, account, note, recurring, source: 'manual' }));
        logTransaction('create', isIncome ? 'Income' : 'Expense', category, dates.length > 1 ? `${fmtINR(amount)} × ${dates.length}, from ${fmtDate(date)}` : `${fmtINR(amount)} on ${fmtDate(date)}`);
      }
      await Storage.save(state);
      closeModal();
      showToast(`${isIncome ? 'Income' : 'Expense'} ${existing ? 'updated' : 'logged'}`);
      renderCfLedger(isIncome ? 'income' : 'expenses');
      renderDashboard();
    };
  });
}
async function deleteIncomeExpenseEntry(type, id) {
  const isIncome = type === 'income';
  const arr = isIncome ? state.income : state.expenses;
  const idx = arr.findIndex(e => e.id === id);
  if (idx === -1) return;
  const [removed] = arr.splice(idx, 1);
  logTransaction('delete', isIncome ? 'Income' : 'Expense', removed.category, `${fmtINR(removed.amount)} on ${fmtDate(removed.date)}`);
  await Storage.save(state);
  showToast(`${isIncome ? 'Income' : 'Expense'} entry deleted`);
  renderCfLedger(isIncome ? 'income' : 'expenses');
  renderDashboard();
}

  const wrap = document.getElementById('reports-content');
  const granularity = state.settings.reportsPrefs.granularity;
  const displaySnaps = aggregatedSnapshots(granularity);
  const snapRows = displaySnaps.slice().reverse().map((s) => {

    return `<tr>
      <td>${s.periodLabel}</td>

  }).join('');

  const assetPerfRows = state.assets.slice().sort((a, b) => {
    const xa = assetXIRR(a), xb = assetXIRR(b);

  }).map(a => {
    const x = assetXIRR(a), c = assetCAGRApprox(a), gp = assetGainPct(a);

    const gpSem = gp !== null ? returnSemantic(gp, null) : 'neutral';

    return `<tr>
      <td>${escapeHTML(a.name)}<div class="jn">${a.category}</div></td>
      <td class="num">${fmtINR(assetInvested(a))}</td>
      <td class="num">${fmtINR(assetCurrentValue(a))}</td>
      <td class="num ${gp !== null ? semanticClass(gpSem) : ''}">${gp !== null ? fmtPct(gp) : '—'}</td>
      <td class="num">${returnCellHTML(x, yrs)}</td>
      <td class="num">${returnCellHTML(c, yrs)}</td>
      <td class="num">${potentialTax !== null ? fmtINR(potentialTax) : '—'}</td>

  }).join('');

  const overallPx = overallPortfolioXIRR();

  wrap.innerHTML = `

    <section class="block">
      <div class="flex-between section-label"><span>Asset Performance <span class="hint">ranked by XIRR</span></span>${state.assets.length ? `<button class="btn btn-ghost btn-sm" id="btn-csv-asset-perf">Download CSV</button>` : ''}</div>
      <div class="card" style="padding:0;overflow-x:auto;">
        ${state.assets.length ? `<table class="ledger"><thead><tr><th>Asset</th><th class="num">Invested</th><th class="num">Current Value</th><th class="num">Gain / Loss</th><th class="num">XIRR</th><th class="num">Approx. CAGR</th><th class="num">Potential Tax <span class="hint" style="text-transform:none;">on unrealized gain, if rates set</span></th></tr></thead><tbody>${assetPerfRows}</tbody></table>` : `<div class="empty-state">Add assets to see performance rankings.</div>`}
      </div>

    <section class="block">

          <select id="reports-granularity" aria-label="Snapshot history granularity" style="width:auto;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 26px 6px 10px;border-radius:var(--radius-sm);font-size:12px;">
            <option value="raw" ${granularity === 'raw' ? 'selected' : ''}>Every Snapshot</option>
            <option value="monthly" ${granularity === 'monthly' ? 'selected' : ''}>Monthly</option>
            <option value="quarterly" ${granularity === 'quarterly' ? 'selected' : ''}>Quarterly (FY)</option>
            <option value="halfyearly" ${granularity === 'halfyearly' ? 'selected' : ''}>Half-Yearly (FY)</option>
            <option value="yearly" ${granularity === 'yearly' ? 'selected' : ''}>Yearly (FY Apr–Mar)</option>

        ${displaySnaps.length ? `<table class="ledger"><thead><tr><th>Period</th><th class="num">Assets</th><th class="num">Liabilities</th><th class="num">Net Worth</th><th class="num">Change</th><th></th></tr></thead><tbody>${snapRows}</tbody></table>` : `<div class="empty-state">No snapshots saved yet — save one from the Dashboard tab.</div>`}

          <strong style="color:var(--text);">XIRR</strong> is computed from every logged cash flow (each buy/sell/contribution/withdrawal) plus current value as a final inflow — it correctly weights money invested at different times, so it's the right number for SIPs, top-ups, and partial exits.<br/><br/>
          <strong style="color:var(--text);">Approx. CAGR</strong> shown here is a simplified point-to-point calculation: (current value ÷ total invested) raised to (1 ÷ years since first transaction), minus one. It treats all capital as if invested in one lump sum on the first transaction date — so for assets with multiple staggered investments, it will understate or overstate the true annualised return. Treat XIRR as the accurate figure and CAGR as a rough cross-check.
        </div>
      </details>

  `;

  document.querySelectorAll('[data-del-snap]').forEach(b => b.onclick = () => deleteSnapshot(b.dataset.delSnap));

async function deleteSnapshot(id) {

function executiveSummaryAssetRowHTML(item, expanded) {
  const tA = totalAssets();
  const rows = `<tr class="data-row" data-report-row="asset-${item.id}">
    <td>${escapeHTML(item.name)}<div class="jn">${item.category}</div></td>
    <td class="num">${fmtINR(item.value)}</td>
    <td class="num">${tA > 0 ? ((item.value / tA) * 100).toFixed(1) : '0.0'}%</td>
  </tr>`;
  if (!expanded) return rows;
  const asset = state.assets.find(a => a.id === item.id);
  if (!asset) return rows;
  const gp = assetGainPct(asset), x = assetXIRR(asset), yrs = assetHoldingYears(asset);
  const bits = [
    `Invested ${fmtINR(assetInvested(asset))}`,
    `Gain ${gp !== null ? fmtPct(gp) : '—'}`,
    `XIRR ${x !== null ? fmtPct(x) : '—'}`
  ];
  if (asset.custodian) bits.push(asset.custodian);
  if (asset.purpose) bits.push(asset.purpose);
  return rows + `<tr class="detail-row open"><td colspan="3"><div class="jn">${bits.join(' · ')}</div></td></tr>`;
}
function executiveSummaryLiabilityRowHTML(item, expanded) {

  if (!expanded) return rows;
  let detail = '';
  if (item.kind === 'loans') {

  } else if (item.kind === 'creditcards') {

/* ---------- Goals & Performance (spec 4.5) ---------- */
function renderReportsGoals() {
  const wrap = document.getElementById('reports-content');
  const rows = goalAllocationRows();
  if (!rows.length) {
    wrap.innerHTML = `<div class="card empty-state">${emptyStateIcon()}Set a Target Allocation in Settings, or assign a Purpose to your assets, to see goal performance here.</div>`;
    return;
  }
  const body = rows.map(r => {
    const dev = Math.abs(r.deviationPct);
    const sem = dev < 3 ? 'neutral' : dev < 8 ? 'caution' : 'adverse';
    const x = purposeXIRR(r.purpose);
    return `<tr>
      <td>${escapeHTML(r.purpose)}</td>
      <td class="num">${r.targetPct ? r.targetPct.toFixed(1) + '%' : '—'}</td>
      <td class="num">${r.actualPct.toFixed(1)}%</td>
      <td class="num ${semanticClass(sem)}">${fmtPct(r.deviationPct)}</td>
      <td class="num">${fmtINR(r.rebalanceAmount, { forceSign: true })}</td>
      <td class="num">${x !== null ? fmtPct(x) : '—'}</td>
    </tr>`;
  }).join('');
  const worst = rows.slice().sort((a, b) => Math.abs(b.deviationPct) - Math.abs(a.deviationPct))[0];
  const worstDev = Math.abs(worst.deviationPct);
  const worstSem = worstDev < 3 ? 'neutral' : worstDev < 8 ? 'caution' : 'adverse';
  const otherOffTarget = rows.filter(r => r.purpose !== worst.purpose && Math.abs(r.deviationPct) >= 3);
  const { overflowCount: otherOffCount } = topNWithOverflow(otherOffTarget, 0, 'purpose');
  const heroSub = `${fmtPct(worst.deviationPct)} deviation · ${fmtINR(worst.rebalanceAmount, { forceSign: true })} to rebalance` +
    (otherOffCount ? ` — +${otherOffCount} other purpose${otherOffCount !== 1 ? 's' : ''} also off target (see table below)` : '');
  wrap.innerHTML = `
    ${reportHeroHTML('Furthest From Target', worst.purpose, heroSub, worstSem)}
    <section class="block">
      <div class="flex-between section-label"><span>Goal &amp; Performance Reporting <span class="hint">allocation vs. target, and growth, per purpose</span></span><button class="btn btn-ghost btn-sm" id="btn-csv-goals">Download CSV</button></div>
      <div class="card" style="padding:0;overflow-x:auto;">
        <table class="ledger"><thead><tr><th>Purpose</th><th class="num">Target</th><th class="num">Actual</th><th class="num">Deviation</th><th class="num">Rebalance</th><th class="num">XIRR</th></tr></thead><tbody>${body}</tbody></table>
      </div>
    </section>
  `;
  document.getElementById('btn-csv-goals').onclick = () => downloadTextFile('goals-report.csv',
    'purpose,target_pct,actual_pct,deviation_pct,rebalance_amount,xirr_pct\n' +
    rows.map(r => {
      const x = purposeXIRR(r.purpose);
      return [r.purpose, r.targetPct.toFixed(1), r.actualPct.toFixed(1), r.deviationPct.toFixed(1), r.rebalanceAmount, x !== null ? x.toFixed(2) : ''].map(csvEscape).join(',');
    }).join('\n'), 'text/csv');
}

/* ---------- Annual Wealth Report (spec 4.7) ----------
   No new calc functions — composes the ones above, bounded to a selected FY's date range. */
function availableFYs() {
  const dates = [];
  state.snapshots.forEach(s => dates.push(s.date));
  state.assets.forEach(a => a.transactions.forEach(t => dates.push(t.date)));
  if (!dates.length) return [];
  return [...new Set(dates.map(d => fyStartYearFor(d)))].sort((a, b) => b - a);
}
/* ---------- Tax Report (Item 12) ----------
   Covers: Capital Gains (STCG / LTCG per asset), Interest Income (loan payments interest component),
   and Dividend / Expected Income. FY = April–March. User selects FY; computations are indicative.
   Rates: Equity LTCG 12.5% (>1 yr), STCG 20%; Non-equity LTCG 12.5%, STCG as per slab (shown as "slab"). */
let taxReportFY = null;
function renderReportsTax() {
  const wrap = document.getElementById('reports-content');
  const fys = availableFYs();
  // Build FY list from transaction dates too
  const txDates = state.assets.flatMap(a => (a.transactions || []).map(t => t.date)).filter(Boolean);
  const txFYs = [...new Set(txDates.map(d => fyStartYearFor(d)))].sort((a, b) => b - a);
  const allFYs = [...new Set([...fys, ...txFYs])].sort((a, b) => b - a);
  if (!allFYs.length) {
    wrap.innerHTML = `<div class="card empty-state">${emptyStateIcon()}<div class="big">No data yet</div>Add assets with transactions to generate a Tax Report.</div>`;
    return;
  }
  if (!taxReportFY || !allFYs.includes(taxReportFY)) taxReportFY = allFYs[0];
  const fyStart = `${taxReportFY}-04-01`;
  const fyEnd = `${taxReportFY + 1}-03-31`;

  // Helper: holding period from first buy to a sell date
  function holdingMonths(buyDate, sellDate) {
    const b = new Date(buyDate), s = new Date(sellDate);
    return (s.getFullYear() - b.getFullYear()) * 12 + s.getMonth() - b.getMonth();
  }

  // --- Capital Gains: scan sell/redemption transactions within FY ---
  const EQUITY_CATS = ['Listed Stocks', 'Equity Mutual Funds', 'ELSS', 'ETF'];
  const cgRows = [];
  state.assets.forEach(a => {
    const txs = (a.transactions || []).filter(t => t.date >= fyStart && t.date <= fyEnd && (t.type === 'sell' || t.type === 'redeem' || t.type === 'redemption'));
    txs.forEach(tx => {
      const buyTxs = (a.transactions || []).filter(t => t.date < tx.date && (t.type === 'buy' || t.type === 'invest' || t.type === 'purchase'));
      // Transaction schema is qty/price/amount (see assetQty()/assetInvested()) — 'units',
      // 'quantity', and 'nav' are not real fields on this model, so falling through to
      // them always landed on the final "|| 1" default, silently treating every sale as
      // exactly 1 unit sold regardless of its actual qty. Read qty/price directly.
      const avgBuy = buyTxs.length ? buyTxs.reduce((s, t) => s + (t.price || 0) * (t.qty || 0), 0) / (buyTxs.reduce((s, t) => s + (t.qty || 0), 0) || 1) : 0;
      const sellPrice = tx.price || 0;
      const units = tx.qty || 0;
      const proceeds = sellPrice * units;
      const costBasis = avgBuy * units;
      const gain = proceeds - costBasis;
      const isEquity = EQUITY_CATS.some(c => a.category.toLowerCase().includes(c.toLowerCase()));
      const firstBuy = buyTxs.length ? buyTxs[0].date : tx.date;
      const holdMonths = holdingMonths(firstBuy, tx.date);
      const ltThreshold = isEquity ? 12 : 24; // months
      const isLT = holdMonths >= ltThreshold;
      const rate = isEquity ? (isLT ? 12.5 : 20) : (isLT ? 12.5 : null);
      const taxAmt = rate !== null ? Math.max(0, gain) * rate / 100 : null;
      cgRows.push({ asset: a.name, category: a.category, txDate: tx.date, proceeds, costBasis, gain, isLT, holdMonths, rate, taxAmt, isEquity });
    });
  });

  // --- Interest Income: from loan payment records (interest component) ---
  const intRows = [];
  state.loans.forEach(loan => {
    const r = loan.rate / 12 / 100;
    let balance = loan.principal;
    const schedule = [];
    for (let i = 0; i < loan.tenureMonths && balance > 0.01; i++) {
      const interest = balance * r;
      const emi = emiAmount(loan.principal, loan.rate, loan.tenureMonths, loan.interestType);
      const principal = Math.min(emi - interest, balance);
      const date = addMonths(loan.startDate, i);
      schedule.push({ date, interest, principal });
      balance -= principal;
    }
    const fyInterest = schedule.filter(s => s.date >= fyStart && s.date <= fyEnd).reduce((sum, s) => sum + s.interest, 0);
    if (fyInterest > 0) intRows.push({ name: loan.name, category: loan.category, interest: fyInterest });
  });
  // Cash Loans Taken also carry a `rate` field (simple interest, per cashLoanOutstanding())
  // and are taxable in the lender's hands exactly like a Loan/EMI — previously omitted here
  // entirely (audit item B2). Prorate the loan's flat annual simple interest to whichever
  // days of its life overlap the selected FY.
  state.cashLoans.forEach(cl => {
    if (!cl.rate || cl.rate <= 0) return;
    const overlapStart = cl.startDate > fyStart ? cl.startDate : fyStart;
    const overlapEnd = fyEnd;
    if (overlapStart > overlapEnd) return;
    const days = Math.max(0, daysBetween(overlapStart, overlapEnd) + 1);
    const fyInterest = cl.principal * (cl.rate / 100) * (days / 365);
    if (fyInterest > 0) intRows.push({ name: cl.name, category: 'Cash Loan Taken', interest: fyInterest });
  });

  // --- Dividend / Expected Income ---
  // The Asset model's expectedIncome schema (see expectedMonthlyIncome()) is
  // { amount, type, frequency } — there is no `annualAmount` field, so this
  // filter/map was always empty (annualAmount is always undefined → the
  // `> 0` check always fails). Annualize amount/frequency the same way
  // expectedMonthlyIncome() does, just ×12 instead of ÷12.
  const divRows = state.assets.filter(a => a.expectedIncome && a.expectedIncome.amount > 0 && a.expectedIncome.type && a.expectedIncome.type !== 'None').map(a => {
    const inc = a.expectedIncome;
    const perYear = { monthly: 12, quarterly: 4, yearly: 1 }[inc.frequency] || 12;
    const annualAmt = (inc.amount || 0) * perYear;
    const type = inc.type || 'Income';
    // Prorate if asset was bought mid-FY
    return { name: a.name, category: a.category, type, annualAmount: annualAmt };
  });

  // --- Tax on interest income from savings/FD-like assets ---
  const interestAssets = state.assets.filter(a => a.expectedIncome && ['Interest', 'FD Interest', 'Savings Interest'].includes(a.expectedIncome.type));

  const totalCGTax = cgRows.reduce((s, r) => s + (r.taxAmt || 0), 0);
  const totalInterest = intRows.reduce((s, r) => s + r.interest, 0);
  const totalDividend = divRows.filter(r => r.type === 'Dividend').reduce((s, r) => s + r.annualAmount, 0);
  const totalInterestIncome = divRows.filter(r => r.type === 'Interest' || r.type === 'FD Interest').reduce((s, r) => s + r.annualAmount, 0);

  const fyLabel = `FY ${taxReportFY}–${String(taxReportFY + 1).slice(2)}`;
  const fySelect = allFYs.map(fy => `<option value="${fy}" ${fy === taxReportFY ? 'selected' : ''}>FY ${fy}–${String(fy + 1).slice(2)}</option>`).join('');

  wrap.innerHTML = `
    <div class="flex-between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      <div class="section-label" style="margin:0;">Tax Report — ${fyLabel}</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-ghost btn-sm" id="btn-csv-tax">Download CSV</button>
        <select id="tax-fy-select" aria-label="Financial year" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 28px 7px 11px;border-radius:var(--radius-sm);font-size:12.5px;">${fySelect}</select>
      </div>
    </div>

    ${reportHeroHTML('Est. Capital Gains Tax', fmtINR(totalCGTax), fyLabel + ' — indicative only, not tax advice', totalCGTax > 0 ? 'caution' : 'neutral')}
    <div class="stat-row" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;">
      <div class="stat-card"><div class="label">Interest Income (Loans)</div><div class="value num">${fmtINR(totalInterest)}</div></div>
      <div class="stat-card"><div class="label">Dividend Income</div><div class="value num">${fmtINR(totalDividend)}</div></div>
    </div>

    <section class="block">
      <div class="section-label">Capital Gains <span class="hint">sell / redemption transactions in ${fyLabel}</span></div>
      <div class="card" style="padding:0;overflow-x:auto;">
        ${cgRows.length ? `
        <table class="ledger">
          <thead><tr>
            <th>Asset</th><th>Date</th><th class="num">Proceeds</th><th class="num">Cost Basis</th>
            <th class="num">Gain / Loss</th><th>Type</th><th class="num">Rate</th><th class="num">Est. Tax</th>
          </tr></thead>
          <tbody>
            ${cgRows.map(r => `<tr>
              <td>${escapeHTML(r.asset)}<div class="jn">${escapeHTML(r.category)}</div></td>
              <td>${fmtDate(r.txDate)}</td>
              <td class="num">${fmtINR(r.proceeds)}</td>
              <td class="num">${fmtINR(r.costBasis)}</td>
              <td class="num ${r.gain >= 0 ? 'gain' : 'loss'}">${fmtINR(r.gain, { forceSign: true })}</td>
              <td>${r.isLT ? 'LTCG' : 'STCG'} · ${r.holdMonths}m · ${r.isEquity ? 'Equity' : 'Non-Equity'}</td>
              <td class="num">${r.rate !== null ? r.rate + '%' : 'Slab'}</td>
              <td class="num">${r.taxAmt !== null ? fmtINR(r.taxAmt) : '—'}</td>
            </tr>`).join('')}
            <tr class="subtotal"><td colspan="7">Total Estimated Capital Gains Tax</td><td class="num">${fmtINR(totalCGTax)}</td></tr>
          </tbody>
        </table>` : `<div class="empty-state">No sell / redemption transactions found in ${fyLabel}. Log sell transactions on your assets to populate this section.</div>`}
      </div>
    </section>

    <section class="block">
      <div class="section-label">Tax on Interest Income <span class="hint">interest from Loan/EMI amortization and Cash Loans Taken in ${fyLabel} — taxable in the lender's hands</span></div>
      <div class="card" style="padding:0;overflow-x:auto;">
        ${intRows.length ? `
        <table class="ledger">
          <thead><tr><th>Loan</th><th>Category</th><th class="num">Interest Component</th><th class="hint" style="padding:10px 16px;">Taxed at slab rate</th></tr></thead>
          <tbody>
            ${intRows.map(r => `<tr><td>${escapeHTML(r.name)}</td><td>${r.category}</td><td class="num">${fmtINR(r.interest)}</td><td class="jn">As per slab</td></tr>`).join('')}
            <tr class="subtotal"><td colspan="2">Total Interest Paid</td><td class="num">${fmtINR(totalInterest)}</td><td></td></tr>
          </tbody>
        </table>` : `<div class="empty-state">No loans or interest-bearing cash loans found. Add loans with principal, rate, and tenure — or a Cash Loan Taken with a rate set — to see interest breakdown.</div>`}
      </div>
    </section>

    <section class="block">
      <div class="section-label">Dividend &amp; Other Income <span class="hint">from Expected Income field on assets</span></div>
      <div class="card" style="padding:0;overflow-x:auto;">
        ${divRows.length ? `
        <table class="ledger">
          <thead><tr><th>Asset</th><th>Category</th><th>Income Type</th><th class="num">Annual Amount</th><th class="hint" style="padding:10px 16px;">Tax Treatment</th></tr></thead>
          <tbody>
            ${divRows.map(r => `<tr><td>${escapeHTML(r.name)}</td><td>${r.category}</td><td>${r.type}</td><td class="num">${fmtINR(r.annualAmount)}</td><td class="jn">${r.type === 'Dividend' ? 'Taxed at slab (post FY2020)' : r.type.includes('Interest') ? 'Taxed at slab' : 'As applicable'}</td></tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty-state">No Expected Income set on any asset. Edit an asset and set Expected Income (type + annual amount) to populate this section.</div>`}
      </div>
    </section>

    <div class="field helptext" style="margin-top:12px;">⚠️ This is an indicative tax estimate only — not tax advice. Capital gains rates shown are for FY2025–26 (post-Budget 2024): Equity LTCG 12.5% (>12 months, grandfathering not applied), Equity STCG 20%, Non-equity LTCG 12.5% (>24 months). STCG on non-equity assets and all interest/dividend income are taxed at your applicable slab rate. Consult a CA for your actual tax liability.</div>
  `;

  wrap.querySelector('#tax-fy-select').onchange = (e) => {
    taxReportFY = parseInt(e.target.value);

  };

    const lines = [`Tax Report — ${fyLabel}`, ''];
    lines.push('Capital Gains');

    cgRows.forEach(r => lines.push([r.asset, r.category, r.txDate, r.proceeds, r.costBasis, r.gain, r.isLT ? 'LTCG' : 'STCG', r.holdMonths, r.rate !== null ? r.rate : 'Slab', r.taxAmt !== null ? r.taxAmt : ''].map(csvEscape).join(',')));
    lines.push(['', '', '', '', '', '', '', '', 'Total Est. CG Tax', totalCGTax].map(csvEscape).join(','));
    lines.push('', 'Interest Income');

    intRows.forEach(r => lines.push([r.name, r.category, r.interest].map(csvEscape).join(',')));
    lines.push(['', 'Total Interest', totalInterest].map(csvEscape).join(','));
    lines.push('', 'Dividend & Other Income');
    lines.push('asset,category,income_type,annual_amount');
    divRows.forEach(r => lines.push([r.name, r.category, r.type, r.annualAmount].map(csvEscape).join(',')));
    downloadTextFile(`tax-report-fy${taxReportFY}.csv`, lines.join('\n'), 'text/csv');
  };
}

function renderReportsAnnual() {

    return;

  if (reportsAnnualFY === null || !fys.includes(reportsAnnualFY)) reportsAnnualFY = fys[0];
  const fyStart = `${reportsAnnualFY}-04-01`;
  const fyEnd = `${reportsAnnualFY + 1}-03-31`;
  const sorted = [...state.snapshots].sort((a, b) => new Date(a.date) - new Date(b.date));
  const inFY = sorted.filter(s => s.date >= fyStart && s.date <= fyEnd);
  const beforeFY = sorted.filter(s => s.date < fyStart);
  const fromSnap = beforeFY.length ? beforeFY[beforeFY.length - 1] : (inFY.length ? inFY[0] : null);

  const attribution = (fromSnap && toSnap && fromSnap !== toSnap) ? netWorthAttribution(fromSnap, toSnap) : null;

    </section>
    ${attribution ? `
    <section class="block">
      <div class="section-label">What Drove the Change</div>
      <div class="card">
        ${(() => { const _max = Math.max(Math.abs(attribution.investmentGain), Math.abs(bySource.Regular||0), Math.abs(bySource.Inheritance||0), Math.abs(bySource['Manual Adjustment']||0), Math.abs(attribution.liabImpact), 1); return `
        ${attributionRowHTML('Market / Investment Returns', attribution.investmentGain, _max)}
        ${attributionRowHTML('Regular Contributions', bySource.Regular, _max)}
        ${attributionRowHTML('Inheritance', bySource.Inheritance, _max)}
        ${attributionRowHTML('Manual Adjustments', bySource['Manual Adjustment'], _max)}
        ${attributionRowHTML('Debt Reduction', attribution.liabImpact, _max)}
        `; })()}
      </div>
    </section>` : ''}
    <section class="block">
      <div class="section-label">Largest Holdings</div>
      <div class="card" style="padding:0;overflow-x:auto;">
        ${topAssets.length ? `<table class="ledger"><thead><tr><th>Asset</th><th class="num">Value</th></tr></thead><tbody>${topAssets.map(a => `<tr><td>${escapeHTML(a.name)}<div class="jn">${a.category}</div></td><td class="num">${fmtINR(a.value)}</td></tr>`).join('')}</tbody></table>` : `<div class="empty-state">No assets yet.</div>`}
      </div>
    </section>
    ${goalRows.length ? `
    <section class="block">
      <div class="section-label">Goal Progress</div>
      <div class="card" style="padding:0;overflow-x:auto;">
        <table class="ledger"><thead><tr><th>Purpose</th><th class="num">Target</th><th class="num">Actual</th></tr></thead><tbody>${goalRows.map(r => `<tr><td>${escapeHTML(r.purpose)}</td><td class="num">${r.targetPct ? r.targetPct.toFixed(1) + '%' : '—'}</td><td class="num">${r.actualPct.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
      </div>
    </section>` : ''}
  `;
  document.getElementById('annual-fy-select').onchange = (e) => { reportsAnnualFY = parseInt(e.target.value); renderReportsAnnual(); };

/* Jumps to Settings > Health Check — used by the Dashboard Wealth Alert summary entry,
   same switchTab-then-focus idea openMethodology() uses for Reports > Performance. */
async function openHealthCheck() {

/* Click-through for a single Health Check finding — jumps straight to the specific asset,
   loan, credit card, cash loan, or bill the finding is about, opens its detail row, and
   briefly flashes it so it's findable in a long list. Falls back to a plain tab-jump (the
   old behavior) if a finding has no target (e.g. still not covering something). (A3, C1) */
function flashRow(rowId) {
  const go = () => {
    const el = document.getElementById(rowId);
    if (!el) return;
    if (el.scrollIntoView) el.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
    el.classList.remove('hc-jump-flash'); void el.offsetWidth; el.classList.add('hc-jump-flash');
  };
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(() => requestAnimationFrame(go));
  else go();
}
async function openHealthCheckItem(target) {
  if (!target || !target.kind || !target.id) return openHealthCheck();
  const { kind, id } = target;
  if (kind === 'asset') {
    assetSubtab = 'All';
    state.settings.assetsViewPrefs.categoryFilter = 'All';
    openAssetIds.add(id);
    switchTab('assets');
    flashRow('asset-row-' + id);
  } else if (kind === 'loan') {
    liabSubtab = 'loans'; openLiabIds.add(id); switchTab('liabilities'); flashRow('loan-row-' + id);
  } else if (kind === 'creditcard') {
    liabSubtab = 'creditcards'; openLiabIds.add(id); switchTab('liabilities'); flashRow('card-row-' + id);
  } else if (kind === 'cashloan') {
    liabSubtab = 'cashloans'; openLiabIds.add(id); switchTab('liabilities'); flashRow('cashloan-row-' + id);
  } else if (kind === 'bill') {
    const b = state.bills.find(x => x.id === id);
    liabSubtab = b ? BILL_TYPE_CONFIG[b.type].subtab : 'taxpayable';
    openLiabIds.add(id); switchTab('liabilities'); flashRow('bill-row-' + id);
  } else {
    return openHealthCheck();
  }
  await Storage.save(state);
}
