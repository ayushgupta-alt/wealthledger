<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Wealth Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0F1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wealth Ledger">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     WEALTH LEDGER V6 — design tokens
     Signature: a "vault ledger" aesthetic — dark ink-blue surfaces, brushed
     gold accent, warm serif numerals for figures that matter most, generous
     rounded surfaces with soft layered depth in place of V5's flat 3px-radius
     hairline cards. Every variable name below is unchanged from V5, so all
     existing render functions inherit the new look with zero JS edits.
     ========================================================================= */
  :root {
    --bg: #0A0F1C;
    --bg-alt: #0D1424;
    --surface: #121A2C;
    --surface-alt: #172136;
    --surface-raised: #1A2438;
    --border: #262F47;
    --border-soft: #1C2438;
    --gold: #D4AF6A;
    --gold-soft: #9C8047;
    --gold-dim: rgba(212, 175, 106, 0.13);
    --green: #52B788;
    --green-dim: rgba(82, 183, 136, 0.14);
    --orange: #DE9B54;
    --orange-dim: rgba(222, 155, 84, 0.14);
    --red: #E17165;
    --red-dim: rgba(225, 113, 101, 0.14);
    --blue: #7B9BF2;
    --blue-dim: rgba(123, 155, 242, 0.14);
    --text: #ECEEF4;
    --text-muted: #9AA4C0;
    --text-dim: #7883A0;

    /* Categorical chart colors (A2): these are NOT semantic (favorable/adverse) — they just
       need to be visually distinct and theme-aware. Values below match what
       COMPOSITION_COLORS/RISK_CHART_COLORS used to hardcode, so dark theme is visually
       unchanged; light theme gets its own darker/more-saturated variants for contrast on a
       white surface, same adjustment the --gold/--green/--red tokens already get. Risk
       deliberately avoids --green/--orange/--red (see assetRiskBreakdown()'s comment) so a
       risk level never accidentally reads as a value judgment. */
    --chart-comp-growth: #6C8EEF;
    --chart-comp-defensive: #B98CD6;
    --chart-comp-liquid: #5FB8C9;
    --chart-comp-other: #8892AB;
    --chart-risk-1: #74AAB4;
    --chart-risk-2: #869BD5;
    --chart-risk-3: #B09864;
    --chart-risk-4: #B69BC7;
    --chart-risk-5: #C48FA3;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

    /* radius scale — --radius is the base token every old rule already reads;
       new rules reach for sm/lg/xl/pill steps for the rounded premium-card feel */
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --radius-pill: 999px;

    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
    --sp-6: 24px; --sp-7: 32px; --sp-8: 40px; --sp-9: 56px;

    /* type scale — new rules should reach for these instead of a hand-picked font-size;
       existing rules keep their current literal values (an app-wide sweep is a separate,
       larger pass) but every rule touched in this pass uses these tokens */
    --text-xs: 11px; --text-sm: 12.5px; --text-base: 14px; --text-md: 15px;
    --text-lg: 18px; --text-xl: 24px; --text-display: 40px;

    --shadow-sm: 0 1px 2px rgba(2,4,10,0.35), 0 1px 1px rgba(2,4,10,0.2);
    --shadow-md: 0 8px 24px rgba(2,4,10,0.34), 0 2px 8px rgba(2,4,10,0.28);
    --shadow-lg: 0 22px 56px rgba(2,4,10,0.46), 0 6px 18px rgba(2,4,10,0.3);
    --shadow-gold: 0 10px 28px rgba(212,175,106,0.14);
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.03);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --dur-1: 0.15s; --dur-2: 0.25s; --dur-3: 0.4s;
  }

  /* ---------- Light theme override (Settings > Application Preferences) ----------
     Same variable names, different values — every rule in this file already reads
     colors through var(--x), so no component CSS needs to change. */
  :root[data-theme="light"] {
    --bg: #F6F4ED;
    --bg-alt: #EFEAE0;
    --surface: #FFFFFF;
    --surface-alt: #FAF7F0;
    --surface-raised: #FFFFFF;
    --border: #E2DBC9;
    --border-soft: #EAE4D5;
    --gold: #8F6E22;
    --gold-soft: #B0912F;
    --gold-dim: rgba(143, 110, 34, 0.11);
    --green: #26805A;
    --green-dim: rgba(38, 128, 90, 0.11);
    --orange: #AD5E24;
    --orange-dim: rgba(173, 94, 36, 0.11);
    --red: #B33C34;
    --red-dim: rgba(179, 60, 52, 0.11);
    --blue: #3B5FCF;
    --blue-dim: rgba(59, 95, 207, 0.10);
    --text: #1C2436;
    --text-muted: #5B6379;
    --text-dim: #6B7280;
    --chart-comp-growth: #3F5FD1;
    --chart-comp-defensive: #8B4FB0;
    --chart-comp-liquid: #1E8A9C;
    --chart-comp-other: #5B6379;
    --chart-risk-1: #3D7A85;
    --chart-risk-2: #4F63B8;
    --chart-risk-3: #8F6E22;
    --chart-risk-4: #8B5FA0;
    --chart-risk-5: #A34F6B;
    --shadow-sm: 0 1px 2px rgba(30,24,8,0.05), 0 1px 1px rgba(30,24,8,0.04);
    --shadow-md: 0 10px 24px rgba(30,24,8,0.08), 0 2px 8px rgba(30,24,8,0.05);
    --shadow-lg: 0 24px 56px rgba(30,24,8,0.12), 0 6px 18px rgba(30,24,8,0.06);
    --shadow-gold: 0 10px 28px rgba(143,110,34,0.10);
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.6);
  }

  /* ---------- Print / Export PDF (spec 4.6) ----------
     Reuses the light theme's exact variable values regardless of the on-screen theme —
     printing the dark theme as-is would waste ink and look bad on paper, and inventing a
     third palette just for print would be one more thing to keep in sync. Only visual
     chrome is hidden (nav, subtab bar, buttons, toasts) — the currently-active tab/subtab
     prints as-is, which is why "Print / Export PDF" is a plain window.print() rather than
     a bespoke renderer: whatever's on screen is what gets printed. */
  @media print {
    :root {
      --bg: #F5F3EC; --bg-alt: #EEE9DC; --surface: #FFFFFF; --surface-alt: #F7F4EC;
      --surface-raised: #FFFFFF; --border: #DED6C2; --border-soft: #E8E2D2;
      --gold: #8F6E22; --gold-soft: #B0912F; --gold-dim: rgba(143,110,34,0.12);
      --green: #2A8358; --green-dim: rgba(42,131,88,0.12);
      --orange: #B15F22; --orange-dim: rgba(177,95,34,0.12);
      --red: #B93A32; --red-dim: rgba(185,58,50,0.12);
      --blue: #3B5FCF; --text: #1C2436; --text-muted: #5B6379; --text-dim: #6B7280;
      --chart-comp-growth: #3F5FD1; --chart-comp-defensive: #8B4FB0; --chart-comp-liquid: #1E8A9C; --chart-comp-other: #5B6379;
      --chart-risk-1: #3D7A85; --chart-risk-2: #4F63B8; --chart-risk-3: #8F6E22; --chart-risk-4: #8B5FA0; --chart-risk-5: #A34F6B;
      --shadow-sm: none; --shadow-md: none; --shadow-lg: none; --shadow-gold: none;
    }
    body { background: #fff !important; }
    #app { max-width: 100%; padding: 0 8px; opacity: 1 !important; }
    nav.tabs, .subtabs, .btn, input[type="file"], #toast, #chart-tooltip, footer.foot,
    header.top .asof { display: none !important; }
    .card, .stat-card { box-shadow: none !important; border: 1px solid var(--border) !important; break-inside: avoid; }
    section.block { break-inside: avoid; }
  }

  /* ---------- Privacy Mode (Settings > Application Preferences) ----------
     Blurs monetary figures at a glance; hovering (or focusing, for keyboard users)
     any individual figure reveals it without leaving privacy mode entirely. */
  #app.privacy-mode .num,
  #app.privacy-mode .value,
  #app.privacy-mode .stat-card .value {
    filter: blur(6px);
    transition: filter 0.15s ease;
  }
  #app.privacy-mode .num:hover,
  #app.privacy-mode .num:focus-within,
  #app.privacy-mode .value:hover,
  #app.privacy-mode .value:focus-within {
    filter: none;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; max-width: 100vw; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 1100px 600px at 12% -12%, rgba(212,175,106,0.07), transparent),
      radial-gradient(ellipse 900px 700px at 105% -5%, rgba(123,155,242,0.05), transparent),
      radial-gradient(ellipse 1200px 500px at 50% 110%, rgba(82,183,136,0.03), transparent);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  ::selection { background: var(--gold-dim); color: var(--text); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-pill); border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--gold-soft); }

  .num, .mono, input, select, button.qty {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }

  a { color: inherit; }
  button { font-family: var(--font-body); cursor: pointer; }

  /* ---------- App shell ---------- */
  #app { max-width: 1280px; margin: 0 auto; padding: 0 28px 90px; opacity: 0; transition: opacity 0.5s var(--ease); }
  #app.ready { opacity: 1; }

  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 26px 4px 22px;
    margin-bottom: 4px;
    position: relative;
    gap: 16px;
  }
  header.top .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header.top .brand .mark-icon {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    background: linear-gradient(155deg, var(--gold-dim), transparent 70%);
    border: 1px solid var(--border-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); flex-shrink: 0;
    box-shadow: var(--shadow-inset);
  }
  header.top .brand .mark {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    color: var(--text);
    letter-spacing: 0.005em;
  }
  header.top .brand .mark b { color: var(--gold); font-weight: 600; }
  header.top .asof {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex; align-items: center; gap: 8px;
  }
  header.top .asof .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-dim); animation: pulseDot 2.4s ease infinite; }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
  .save-indicator { display: inline-flex; align-items: center; gap: 6px; opacity: 0; transition: opacity var(--dur-1) ease; }
  .save-indicator.active { opacity: 1; }
  .save-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulseDot 1s ease infinite; }

  nav.tabs {
    position: relative;
    display: flex;
    gap: 3px;
    margin: 10px 0 30px;
    padding: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm), var(--shadow-inset);
    width: fit-content;
    max-width: 100%;
    overflow-x: auto;
  }
  nav.tabs button {
    position: relative; z-index: 1;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    transition: color 0.2s ease;
  }
  nav.tabs button svg { opacity: 0.65; transition: opacity 0.2s ease, transform 0.3s var(--ease-spring); flex-shrink: 0; }
  nav.tabs button:hover { color: var(--text-muted); }
  nav.tabs button:hover svg { opacity: 0.9; transform: translateY(-1px); }
  nav.tabs button.active { color: #1A1406; }
  nav.tabs button.active svg { opacity: 1; }
  .tab-indicator {
    position: absolute;
    top: 5px; bottom: 5px;
    border-radius: var(--radius-sm);
    background: linear-gradient(155deg, var(--gold), var(--gold-soft));
    box-shadow: 0 4px 14px rgba(212,175,106,0.35);
    transition: left 0.35s var(--ease-spring), width 0.35s var(--ease-spring);
    pointer-events: none;
    z-index: 0;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
  @keyframes fadeinUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }

  /* ---------- Cards / sections ---------- */
  .section-label {
    font-family: var(--font-display);
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .section-label .hint { font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--text-dim); text-transform: none; letter-spacing: 0; }

  .card {
    background: linear-gradient(175deg, var(--surface-raised), var(--surface) 60%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--sp-6);
    box-shadow: var(--shadow-sm), var(--shadow-inset);
    transition: box-shadow var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease), transform var(--dur-2) var(--ease);
  }

  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
  @media (max-width: 860px) {
    /* !important is deliberate here: several call sites set an inline
       style="grid-template-columns: ..." on a .grid-3/.grid-2 element (e.g.
       the Dashboard's 3-card Wealth Position row, the 4-gauge Financial
       Health row) to customize desktop column ratios. An inline style always
       beats a plain class rule in specificity, so without !important those
       specific rows would silently ignore this breakpoint and stay multi-
       column on narrow phones — which is exactly what was happening. */
    .grid-3, .grid-2 { grid-template-columns: 1fr !important; }
  }

  .stat-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(165deg, var(--surface-raised), var(--surface) 65%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: var(--sp-5) var(--sp-6);
    box-shadow: var(--shadow-sm), var(--shadow-inset);
    transition: transform var(--dur-2) var(--ease-spring), box-shadow var(--dur-2) var(--ease), border-color var(--dur-2) var(--ease);
  }
  .stat-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--stat-accent, var(--border));
    box-shadow: 0 0 16px 0 var(--stat-accent, transparent);
  }
  .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--border-soft); }
  .stat-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .stat-card .value {
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .stat-card .delta { margin-top: 8px; font-size: 12px; font-family: var(--font-mono); display: flex; align-items: center; gap: 6px; }
  .stat-card .spark { position: absolute; right: 14px; bottom: 14px; opacity: 0.9; }
  .delta.up { color: var(--green); }
  .delta.down { color: var(--red); }
  .delta.flat { color: var(--text-dim); }

  /* Hero KPI (Dashboard Wealth Position — net worth) */
  .kpi-hero {
    background: linear-gradient(150deg, rgba(212,175,106,0.10), var(--surface-raised) 55%);
    border: 1px solid var(--gold-soft);
    border-radius: var(--radius-xl);
    padding: var(--sp-6) var(--sp-7);
    box-shadow: var(--shadow-gold), var(--shadow-inset);
    position: relative;
    overflow: hidden;
  }
  .kpi-hero .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); font-weight: 600; margin-bottom: 10px; }
  .kpi-hero .value { font-family: var(--font-display); font-size: 40px; font-weight: 600; color: var(--text); letter-spacing: -0.015em; line-height: 1.1; }
  .kpi-hero .value sup { font-size: 18px; font-weight: 500; color: var(--text-dim); margin-left: 4px; }

  /* ---------- Report hero metric (Module 8) ----------
     Same dominant-number treatment as .kpi-hero, generalized to any report's single most
     important figure and semantically tintable (favorable/adverse/neutral) via --hero-accent,
     instead of being permanently gold-branded like the Dashboard net worth card. */
  .report-hero {
    background: linear-gradient(150deg, var(--hero-dim, rgba(123,155,242,0.10)), var(--surface-raised) 55%);
    border: 1px solid var(--hero-accent, var(--border));
    border-radius: var(--radius-xl);
    padding: var(--sp-6) var(--sp-7);
    box-shadow: 0 10px 28px var(--hero-glow, rgba(123,155,242,0.10)), var(--shadow-inset);
    position: relative;
    overflow: hidden;
    margin-bottom: var(--sp-5);
  }
  .report-hero .label { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.12em; color: var(--hero-accent, var(--text-dim)); font-weight: 600; margin-bottom: var(--sp-2); }
  .report-hero .value { font-family: var(--font-display); font-size: 34px; font-weight: 600; color: var(--text); letter-spacing: -0.015em; line-height: 1.1; }
  .report-hero .sub { margin-top: var(--sp-2); font-size: var(--text-sm); color: var(--text-muted); }
  @media (max-width: 680px) { .report-hero .value { font-size: 26px; } }

  section.block { margin-bottom: 34px; }
  .tab-panel.active section.block { animation: fadeinUp 0.5s var(--ease) both; }
  .tab-panel.active section.block:nth-of-type(1) { animation-delay: 0.02s; }
  .tab-panel.active section.block:nth-of-type(2) { animation-delay: 0.06s; }
  .tab-panel.active section.block:nth-of-type(3) { animation-delay: 0.10s; }
  .tab-panel.active section.block:nth-of-type(4) { animation-delay: 0.14s; }
  .tab-panel.active section.block:nth-of-type(5) { animation-delay: 0.18s; }
  .tab-panel.active section.block:nth-of-type(n+6) { animation-delay: 0.20s; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    color: var(--text);
    padding: var(--sp-2) var(--sp-4);
    border-radius: var(--radius-sm);
    font-size: var(--text-sm);
    font-weight: 500;
    transition: border-color var(--dur-1) ease, background var(--dur-1) ease, transform 0.12s ease, box-shadow var(--dur-2) ease;
  }
  .btn:hover { border-color: var(--gold-soft); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .btn:active { transform: translateY(0) scale(0.97); }
  .btn-primary { background: linear-gradient(155deg, #E0BD7E, var(--gold)); border-color: var(--gold); color: #1A1406; font-weight: 600; }
  .btn-primary:hover { background: linear-gradient(155deg, #ECC98A, #D8B15E); border-color: #D8B15E; box-shadow: 0 8px 20px rgba(212,175,106,0.3); }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-muted); padding: var(--sp-2) var(--sp-3); }
  .btn-ghost:hover { color: var(--text); background: var(--surface-alt); transform: none; box-shadow: none; }
  .btn-danger { color: var(--red); }
  .btn-sm { padding: var(--sp-1) var(--sp-3); font-size: var(--text-xs); }
  .btn-row { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }

  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
    border-radius: 2px;
  }

  /* ---------- Search + filter chips (Assets / Liabilities / Reports) ---------- */
  .toolbar { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; margin-bottom: var(--sp-4); }
  .search-box {
    position: relative; flex: 1 1 220px; min-width: 160px; max-width: 320px;
  }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-dim); pointer-events: none; }
  .search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px 9px 34px; border-radius: var(--radius-pill); font-size: 12.5px;
    transition: border-color var(--dur-1) ease, box-shadow var(--dur-1) ease, background var(--dur-1) ease;
  }
  .search-box input:focus { outline: none; border-color: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-dim); background: var(--surface-raised); }
  .search-box input::placeholder { color: var(--text-dim); }

  .chip-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 13px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 500;
    transition: all var(--dur-1) ease;
  }
  .chip:hover { border-color: var(--border-soft); color: var(--text); }
  .chip.active { background: var(--gold-dim); border-color: var(--gold-soft); color: var(--gold); font-weight: 600; }
  .chip .count { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; }

  /* ---------- Badges (status language, distinct from .pill for backward compat) ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .badge.b-favorable { background: var(--green-dim); color: var(--green); }
  .badge.b-neutral { background: var(--gold-dim); color: var(--gold); }
  .badge.b-caution { background: var(--orange-dim); color: var(--orange); }
  .badge.b-adverse { background: var(--red-dim); color: var(--red); }
  .badge.b-auto { background: var(--blue-dim); color: var(--blue); }
  .breakdown-row { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .breakdown-row .bd-label { width: 150px; font-size: 12.5px; color: var(--text-muted); flex-shrink: 0; display: flex; align-items: center; }
  .breakdown-row .bd-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; flex-shrink: 0; }
  .breakdown-row .bd-bar-track { flex: 1; height: 8px; background: var(--surface); border-radius: var(--radius-pill); overflow: hidden; }
  .breakdown-row .bd-bar { height: 100%; border-radius: var(--radius-pill); }
  .breakdown-row .bd-amt { width: 100px; text-align: right; font-size: 12.5px; font-family: var(--font-mono); color: var(--text); flex-shrink: 0; }
  .cf-trend { display: flex; align-items: flex-end; gap: 16px; height: 150px; padding: 0 4px; }
  .cf-trend-month { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end; }
  .cf-trend-bars { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
  .cf-trend-bar { width: 12px; border-radius: 3px 3px 0 0; min-height: 2px; }
  .cf-trend-bar.in { background: linear-gradient(180deg, var(--green), rgba(82,183,136,0.5)); }
  .cf-trend-bar.out { background: linear-gradient(180deg, var(--red), rgba(225,113,101,0.5)); }
  .cf-trend-month .lbl { font-size: 10.5px; color: var(--text-dim); font-family: var(--font-mono); }
  .cf-legend { display: flex; gap: 16px; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
  .cf-legend .item { display: flex; align-items: center; gap: 6px; }
  .cf-legend .swatch { width: 9px; height: 9px; border-radius: 2px; }

  /* ---------- Tables (ledger rows) ---------- */
  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 600;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  table.ledger th.num, table.ledger td.num { text-align: right; }
  table.ledger td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 13px;
    vertical-align: middle;
  }
  table.ledger tbody tr.data-row { transition: background var(--dur-1) ease, transform var(--dur-1) ease; }
  table.ledger tbody tr.data-row:hover { background: var(--surface-alt); cursor: pointer; }
  table.ledger tbody tr.data-row:active { background: var(--gold-dim); }
  table.ledger tbody tr.data-row:nth-child(even) { background: rgba(255,255,255,0.012); }
  @keyframes hcJumpFlash {
    0%, 100% { background: transparent; }
    15%, 55% { background: var(--gold-dim); }
  }
  tr.hc-jump-flash { animation: hcJumpFlash 1.6s ease; }
  .hc-row { cursor: pointer; transition: background var(--dur-1) ease; }
  .hc-row:hover { background: var(--surface-alt); }
  .hc-row:active { background: var(--gold-dim); }
  table.ledger tr.subtotal td { font-weight: 600; color: var(--gold); background: var(--gold-dim); border-bottom: 1px solid var(--border); }
  table.ledger tr.subtotal td.jn { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); font-weight: 400; }
  .jn { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; }
  .table-scroll { overflow-x: auto; border-radius: var(--radius-lg); }
  .row-name { display: flex; align-items: center; gap: 10px; }
  .row-name .avatar-chip {
    width: 30px; height: 30px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-weight: 600; font-size: 12px;
    background: var(--surface-alt); border: 1px solid var(--border-soft); color: var(--text-muted);
  }

  .pill {
    display: inline-block;
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .pill.paid { background: var(--green-dim); color: var(--green); }
  .pill.unpaid { background: var(--red-dim); color: var(--red); }
  .pill.due-soon { background: var(--gold-dim); color: var(--gold); }

  .gain { color: var(--green); }
  .loss { color: var(--red); }

  /* ---------- Semantic financial color engine ----------
     green = favorable, gold = neutral/attention, orange = caution, red = adverse.
     blue/purple are reserved for categorical (non-sentiment) chart use only. */
  .sem-favorable { color: var(--green); }
  .sem-neutral { color: var(--gold); }
  .sem-caution { color: var(--orange); }
  .sem-adverse { color: var(--red); }
  .warn-flag { color: var(--orange); cursor: help; font-size: 11px; margin-left: 3px; vertical-align: 1px; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-dim);
    font-size: 13px;
    border: 1px dashed var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
  }
  .empty-state .big { font-family: var(--font-display); font-size: 16.5px; color: var(--text-muted); margin-bottom: 6px; }
  .empty-state .empty-icon { margin: 0 auto 14px; display: block; opacity: 0.55; }

  /* ---------- Forms / Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(5,8,15,0.74);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
    animation: fadein 0.15s ease;
  }
  .modal {
    background: linear-gradient(175deg, var(--surface-raised), var(--surface) 70%);
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    width: 100%; max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    padding: var(--sp-7);
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.3s var(--ease-spring);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font-family: var(--font-display); font-size: var(--text-lg); margin: 0 0 4px; color: var(--text); font-weight: 600; }
  .modal .modal-sub { font-size: var(--text-xs); color: var(--text-dim); margin-bottom: var(--sp-6); }

  /* ---------- Inline popover (Module 6 — lighter than .modal, for single/few-field edits) ---------- */
  .popover-backdrop { position: fixed; inset: 0; z-index: 100; }
  .popover {
    position: absolute;
    background: linear-gradient(175deg, var(--surface-raised), var(--surface) 70%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    width: 260px;
    padding: var(--sp-4);
    box-shadow: var(--shadow-lg);
    z-index: 101;
    animation: popoverIn 0.22s var(--ease-spring);
  }
  @keyframes popoverIn { from { opacity: 0; transform: translateY(-6px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce) { .popover { animation: none; } }
  .popover h4 { font-family: var(--font-body); font-size: var(--text-sm); font-weight: 600; margin: 0 0 var(--sp-3); color: var(--text); }
  .popover .field { margin-bottom: var(--sp-3); }
  .popover .field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 4px; }
  .popover .field input {
    width: 100%; background: var(--bg-alt); border: 1px solid var(--border); color: var(--text);
    padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); font-size: var(--text-base);
  }
  .popover .field input:focus { outline: none; border-color: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-dim); }
  .popover .popover-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-2); }

  /* ---------- Command palette (Module 12 / L1) ---------- */
  .cmdk-backdrop { position: fixed; inset: 0; z-index: 200; background: rgba(10,8,4,0.55); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; padding-top: 14vh; }
  .cmdk {
    width: 100%; max-width: 480px;
    background: linear-gradient(175deg, var(--surface-raised), var(--surface) 60%);
    border: 1px solid var(--border); border-radius: var(--radius-xl);
    box-shadow: var(--shadow-lg); overflow: hidden;
    animation: popoverIn 0.18s var(--ease-spring);
  }
  .cmdk input { width: 100%; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); padding: var(--sp-4) var(--sp-5); font-size: var(--text-md); }
  .cmdk input:focus { outline: none; }
  .cmdk-list { max-height: 340px; overflow-y: auto; padding: var(--sp-2); }
  .cmdk-item { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-2) var(--sp-3); border-radius: var(--radius-sm); cursor: pointer; font-size: var(--text-base); color: var(--text-muted); }
  .cmdk-item .grp { font-size: var(--text-xs); color: var(--text-dim); }
  .cmdk-item.active { background: var(--gold-dim); color: var(--text); }
  .cmdk-empty { padding: var(--sp-5); text-align: center; color: var(--text-dim); font-size: var(--text-sm); }
  .field { margin-bottom: var(--sp-4); }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    transition: border-color var(--dur-1) ease, box-shadow var(--dur-1) ease;
  }
  .field textarea { font-family: var(--font-mono); font-size: 12px; min-height: 90px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--gold-soft); box-shadow: 0 0 0 3px var(--gold-dim);
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .field .helptext { font-size: 11px; color: var(--text-dim); margin-top: 5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .toggle-row input { width: auto; }
  .toggle-row label { margin: 0; text-transform: none; font-size: 12.5px; letter-spacing: 0; color: var(--text-muted); }

  select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%); background-position: calc(100% - 16px) 14px, calc(100% - 11px) 14px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

  /* ---------- Sub tabs (Liabilities / Reports / Assets pills) ---------- */
  .subtabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
  .subtabs button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 15px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 500;
    transition: all var(--dur-1) ease;
  }
  .subtabs button:hover { border-color: var(--border-soft); color: var(--text); }
  .subtabs button.active { background: linear-gradient(155deg, var(--gold-dim), transparent); border-color: var(--gold-soft); color: var(--gold); font-weight: 600; }

  /* ---------- EMI Calendar day cells (Item G) ---------- */
  .emi-day {
    min-height: 56px;
    border-radius: var(--radius-sm);
    padding: 5px 6px;
    position: relative;
    transition: transform var(--dur-1) ease, box-shadow var(--dur-1) ease;
    background: linear-gradient(160deg, var(--surface-raised), var(--surface) 70%);
    border: 1px solid var(--border-soft);
  }
  .emi-day.weekend { background: linear-gradient(160deg, var(--surface-alt), var(--surface) 70%); }
  .emi-day.has-payment {
    background: linear-gradient(160deg, var(--red-dim), var(--surface) 75%);
    border: 1px solid rgba(225, 113, 101, 0.35);
    box-shadow: inset 2px 0 0 var(--red);
  }
  .emi-day.has-payment:hover { transform: translateY(-1px); box-shadow: inset 2px 0 0 var(--red), var(--shadow-sm); }
  .emi-day.is-today { background: linear-gradient(160deg, var(--gold-dim), var(--surface) 75%); border: 1px solid var(--gold-soft); }
  .emi-day.is-today.has-payment { background: linear-gradient(160deg, var(--gold-dim) 0%, var(--red-dim) 55%, var(--surface) 100%); box-shadow: inset 2px 0 0 var(--red); }
  .emi-day .day-num { font-size: 11px; font-family: var(--font-mono); color: var(--text-dim); }
  .emi-day.has-payment .day-num { color: var(--red); font-weight: 600; }
  .emi-day.is-today .day-num { color: var(--gold); font-weight: 600; }
  .emi-day .day-item { font-size: 9.5px; color: var(--text-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emi-day .day-item .amt { color: var(--red); font-family: var(--font-mono); font-weight: 500; }

  /* ---------- Drawer (slide-in detail panel) ---------- */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(5,8,15,0.55); backdrop-filter: blur(1px);
    z-index: 95; opacity: 0; pointer-events: none; transition: opacity var(--dur-2) ease;
  }
  .drawer-backdrop.show { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 92vw;
    background: linear-gradient(180deg, var(--surface-raised), var(--surface) 40%);
    border-left: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    z-index: 96; padding: 26px;
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform var(--dur-3) var(--ease);
  }
  .drawer.show { transform: translateX(0); }
  .drawer-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .drawer-header h3 { font-family: var(--font-display); font-size: 19px; font-weight: 600; margin: 0; color: var(--text); }
  .drawer-close { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all var(--dur-1) ease; }
  .drawer-close:hover { color: var(--text); border-color: var(--gold-soft); transform: rotate(90deg); }
  .drawer-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 20px; }
  .drawer-section { margin-bottom: 22px; }
  .drawer-section .dt-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 8px; font-weight: 600; }
  .drawer-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .drawer-stat { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px 14px; }
  .drawer-stat .k { font-size: 10.5px; color: var(--text-dim); margin-bottom: 4px; }
  .drawer-stat .v { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--text); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px) scale(0.96);
    background: var(--surface-raised); border: 1px solid var(--gold-soft);
    color: var(--text); padding: 12px 22px 12px 17px; border-radius: var(--radius-lg); font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 10px;
    opacity: 0; pointer-events: none; transition: opacity var(--dur-2) var(--ease), transform var(--dur-2) var(--ease); z-index: 200;
    box-shadow: var(--shadow-lg);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  #toast .toast-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; box-shadow: 0 0 8px rgba(212,175,106,0.7); }

  /* ---------- Chart tooltip ---------- */
  #chart-tooltip {
    position: fixed; z-index: 300; pointer-events: none;
    background: var(--surface-raised); border: 1px solid var(--gold-soft); border-radius: var(--radius-sm);
    padding: 9px 13px; font-size: 12px; color: var(--text); line-height: 1.5;
    opacity: 0; transform: translateY(4px); transition: opacity 0.12s ease, transform 0.12s ease;
    box-shadow: var(--shadow-md); max-width: 240px;
  }
  #chart-tooltip.show { opacity: 1; transform: translateY(0); }
  #chart-tooltip .num { color: var(--gold); }

  .flex-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; font-size: 12px; }
  .legend .item { display: flex; align-items: center; gap: 6px; color: var(--text-muted); cursor: pointer; padding: 3px 6px; border-radius: var(--radius-sm); transition: opacity var(--dur-1) ease, background var(--dur-1) ease, color var(--dur-1) ease; }
  .legend .item:hover, .legend .item.active { color: var(--text); background: var(--surface-alt); }
  .legend .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .detail-row { display: none; background: var(--bg-alt); }
  .detail-row.open { display: table-row; }
  .detail-row.open td { animation: detailRowIn 0.32s var(--ease-spring); }
  .detail-row td { padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
  @keyframes detailRowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .detail-row.open td { animation: none; } }

  .gauge-label-big { font-family: var(--font-mono); font-weight: 600; }
  .gauge-caption { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 4px; }

  .methodology { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin-top: 10px; }
  .methodology summary { list-style: none; cursor: pointer; font-size: 12px; color: var(--text-muted); }
  .methodology summary::-webkit-details-marker { display: none; }
  .methodology summary::before { content: '▸ '; color: var(--gold); font-size: 11px; }
  .methodology[open] summary::before { content: '▾ '; }
  .methodology summary:hover { color: var(--gold); }
  .info-hint { color: var(--text-dim); cursor: pointer; font-size: 11px; border: 1px solid var(--border); border-radius: 50%; width: 14px; height: 14px; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; transition: color var(--dur-1) ease, border-color var(--dur-1) ease; }
  .info-hint:hover { color: var(--gold); border-color: var(--gold-soft); }

  footer.foot { margin-top: 54px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-dim); }
  footer.foot .foot-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer.foot .foot-storage { text-align: center; margin-top: 8px; }

  @media (max-width: 640px) {
    #app { padding: 0 14px 60px; }
    header.top { flex-direction: column; align-items: flex-start; gap: 8px; }
    .field-row, .field-row-3 { grid-template-columns: 1fr; }
    table.ledger { font-size: 12px; }
    .stat-card .value { font-size: 21px; }
    .kpi-hero .value { font-size: 30px; }
    .drawer { width: 100%; max-width: 100%; }
  }

  /* =========================================================================
     LOCK SCREEN — PIN + WebAuthn fingerprint gate (PWA Phase 1)

  #lock-screen {
    position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(120% 100% at 50% 0%, var(--bg-alt) 0%, var(--bg) 60%);
    display: flex; align-items: center; justify-content: center;

  }
  #lock-screen.hidden { display: none; }
  .lock-card { width: 100%; max-width: 340px; text-align: center; }
  .lock-mark { width: 64px; height: 64px; margin: 0 auto 18px; }
  .lock-title { font-family: var(--font-display); font-size: 22px; color: var(--text); margin-bottom: 6px; }
  .lock-sub { font-size: var(--text-sm); color: var(--text-muted); margin-bottom: 28px; line-height: 1.5; }
  .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 26px; }
  .pin-dot { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; transition: all 0.15s var(--ease); }

  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 260px; margin: 0 auto; }
  .pin-key {
    aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: var(--font-display);
    font-size: 20px; display: flex; align-items: center; justify-content: center;

  .pin-key:active { background: var(--surface-raised); transform: scale(0.94); }
  .pin-key.ghost { background: transparent; border: none; cursor: default; }
  .pin-key.action { background: transparent; border: none; color: var(--text-dim); font-size: 13px; font-family: var(--font-body); }
  .lock-error { color: var(--red); font-size: var(--text-sm); min-height: 20px; margin-top: 14px; }

<script>
/* ===================== WEALTH LEDGER APP ===================== */

/* ---------- Storage abstraction: works as standalone file (localStorage + IndexedDB mirror) or Claude artifact (window.storage) ---------- */
const STORAGE_KEY = 'wealth-data';
const usingArtifactStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

/* IndexedDB is kept as a redundant mirror of localStorage in standalone mode. If a browser ever
   clears one (private-browsing quirks, "clear site data" behaviour, file:// origin edge cases)
   the other can still recover the latest save — this is the fix for data appearing to reset. */
const IDB_NAME = 'wealth-ledger-db';
const IDB_STORE = 'kv';
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(key, value) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

function updateSaveIndicator(ts) {
  const el = document.getElementById('last-saved-label');
  if (!el) return;
  if (!ts) { el.textContent = ''; return; }
  const d = new Date(ts);
  el.textContent = 'Last saved ' + d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}

function setSavingIndicator(active) {
  const el = document.getElementById('save-indicator');
  if (!el) return;
  if (active) { el.classList.add('active'); el.innerHTML = '<span class="dot"></span>Saving…'; }
  else { el.classList.remove('active'); }
}

const STORAGE_FORMAT_VERSION = 2;

/* ---------- Encryption wrapper around the persisted JSON blob (Phase 2) ----------
   When a session encryption key is available (Lock.hasSessionKey()), the saved payload
   is `{ v: 2, encrypted: true, iv, ct, lastModified }` — lastModified is deliberately kept
   OUTSIDE the ciphertext (it's not sensitive) so the ls-vs-IndexedDB "pick the newer save"
   comparison below never needs to decrypt just to compare timestamps.
   When no session key exists (the user chose "skip for now" at PIN setup and never has a
   PIN), the payload is plain JSON exactly as in Phase 1 — there's no key to encrypt with,
   and that trade-off was already accepted when Phase 1 added the skip option. */
async function wrapPayloadForStorage(state) {
  const json = JSON.stringify(state);
  if (Lock.hasSessionKey()) {
    const { iv, ct } = await Lock.encryptPayload(json);
    return JSON.stringify({ v: STORAGE_FORMAT_VERSION, encrypted: true, iv, ct, lastModified: state.lastModified });
  }
  return json;
}
function peekLastModified(raw) {
  if (!raw) return 0;
  try { return JSON.parse(raw).lastModified || 0; } catch (e) { return 0; }
}
async function unwrapStoredPayload(raw) {
  let parsed;
  try { parsed = JSON.parse(raw); } catch (e) { return { state: null, wasLegacyPlaintext: false }; }
  if (parsed && parsed.encrypted === true && parsed.v === STORAGE_FORMAT_VERSION) {
    if (!Lock.hasSessionKey()) return { state: null, wasLegacyPlaintext: false }; // locked — caller shouldn't be here
    try {
      const json = await Lock.decryptPayload(parsed.iv, parsed.ct);
      return { state: JSON.parse(json), wasLegacyPlaintext: false };
    } catch (e) {
      console.error('Decrypt failed', e);
      return { state: null, wasLegacyPlaintext: false };
    }
  }
  // Legacy plaintext (saved before Phase 2, or saved while PIN setup was skipped).
  return { state: parsed, wasLegacyPlaintext: true };
}

const Storage = {
  async load() {
    let state = null, wasLegacyPlaintext = false;
    if (usingArtifactStorage) {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) ({ state, wasLegacyPlaintext } = await unwrapStoredPayload(res.value));
      } catch (e) {
        return null; // key not found or parse error -> treat as first run
      }
    } else {
      // Standalone mode: read both mirrors, compare lastModified (readable without
      // decrypting either), and use whichever has the newer save.
      let lsRaw = null, idbRaw = null;
      try { lsRaw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* ignore */ }
      try { idbRaw = await idbGet(STORAGE_KEY); } catch (e) { /* ignore */ }
      const chosenRaw = (lsRaw && idbRaw) ? (peekLastModified(idbRaw) >= peekLastModified(lsRaw) ? idbRaw : lsRaw) : (lsRaw || idbRaw || null);
      if (chosenRaw) ({ state, wasLegacyPlaintext } = await unwrapStoredPayload(chosenRaw));
    }
    if (!state) return null;
    updateSaveIndicator(state.lastModified);
    if (wasLegacyPlaintext && Lock.hasSessionKey()) {
      // One-time migration: this save predates encryption (Phase 1 data), or was written
      // while the user had skipped PIN setup and has since set one up. Re-persist it
      // encrypted immediately rather than leaving it in plaintext on disk.
      await this.save(state);
      showToast('Your data is now encrypted.');
    }
    return state;
  },
  async save(state) {
    state.lastModified = Date.now();
    const payload = await wrapPayloadForStorage(state);
    // Only the artifact-storage path is a real network/IPC round trip with visible latency —
    // localStorage/IndexedDB below are synchronous-fast, so the indicator is scoped to where
    // it actually matters rather than flickering on every keystroke-triggered save.
    if (usingArtifactStorage) setSavingIndicator(true);
    if (usingArtifactStorage) {
      try {
        const res = await window.storage.set(STORAGE_KEY, payload, false);
        if (res) updateSaveIndicator(state.lastModified);
        return !!res;
      } catch (e) {
        console.error('Storage save failed', e);
        showToast('Could not save — storage may be full or unavailable.');
        return false;
      } finally {
        setSavingIndicator(false);
      }
    }
    let lsOk = false, idbOk = false;
    try { localStorage.setItem(STORAGE_KEY, payload); lsOk = true; } catch (e) { console.error('localStorage save failed', e); }
    try { idbOk = await idbSet(STORAGE_KEY, payload); } catch (e) { /* ignore */ }
    if (!lsOk && !idbOk) {
      showToast('⚠ Could not save anywhere — export a backup now so you don\'t lose this.');
      return false;
    }
    updateSaveIndicator(state.lastModified);
    return true;
  }
};

/* ---------- Audit & Change Tracking (spec 5.4) ----------
   Scoped to "significant" wealth-data changes only (Asset/Loan/CreditCard/CashLoan
   create/update/delete, Snapshot create/delete, Backup restore, Base Currency change) —
   not every field tweak or sub-entity mutation (a transaction, a bill payment). Logging
   every click would make this unreadable; those already surface in Reports > Income &
   Cashflow. No "who" field — single-user local app, no accounts. Capped at the most
   recent 500 entries so it can't grow unbounded. Call this BEFORE `Storage.save(state)`
   at each instrumented call site so the entry is persisted in the same save. */
function logAudit(action, entity, label, detail) {
  state.auditLog.push({ id: uid(), timestamp: Date.now(), action, entity, label, detail: detail || '' });
  if (state.auditLog.length > 500) state.auditLog = state.auditLog.slice(-500);
}

/* ---------- Transaction Log (companion to the Master Log above) ----------
   The Master Log above is deliberately sparse (entity-level create/update/delete only).
   This one is the opposite: every individual money-movement event — asset transactions,
   loan/EMI payments, cash loan repayments, credit card bills (logged/edited/deleted/paid),
   bill payments — one entry per event, capped higher (2000, vs. 500) since these happen far
   more often. Call this alongside (not instead of) logAudit() where both apply — e.g. adding
   an asset gets one Master Log entry ("Asset created"), while each transaction logged against
   it gets its own Transaction Log entry. */
function logTransaction(action, entity, label, detail) {
  state.transactionLog.push({ id: uid(), timestamp: Date.now(), action, entity, label, detail: detail || '' });
  if (state.transactionLog.length > 2000) state.transactionLog = state.transactionLog.slice(-2000);
}

/* ---------- Default state ---------- */
function defaultSettings() {
  return {
    baseCurrency: 'INR',
    currencies: ['INR'],
    exchangeRates: {},            // { 'USD': 83.0, ... } — rate TO baseCurrency
    custodians: [],                // free-add master list (e.g. Zerodha, HDFC Bank)
    issuerBanks: [],               // credit card issuer banks (e.g. HDFC, ICICI, SBI)
    purposes: ['Retirement', 'Emergency Fund', 'Child Education', 'Wealth Creation', 'House Purchase', 'Passive Income', 'Tax Saving', 'Other'],
    priceSources: ['Manual', 'Exchange (NSE/BSE)', 'AMC/NAV', 'Bank', 'Other'],
    targetAllocation: {},          // { purposeName: targetPct }
    monthlyIncome: 0,               // fallback household income — used for Debt Service Ratio only until real income is logged in Cash Flow (see effectiveMonthlyIncome())
    reminderThresholds: { neutral: 15, caution: 7, adverse: 3 }, // days-out bands for upcoming-payment urgency
    theme: 'dark',                  // 'dark' | 'light'
    privacyMode: false,
    autoSnapshot: { enabled: true, frequency: 'monthly', eventThresholdPct: 15 }, // eventThresholdPct: |Δnet worth| that also triggers a snapshot — on by default so net-worth history builds itself without a manual "Save Snapshot" click
    autoBackup: { enabled: true }, // Phase 3: silent encrypted backup download on app open, throttled to once/day — see maybeRunAutoBackup()
    benchmarks: [],                 // pasted periodic index values (Nifty/Sensex/Gold/FD/Inflation)
    recentAssetDefaults: { custodian: null, currency: null, priceSource: null }, // smart defaults for the next Add Asset
    assetsViewPrefs: { categoryFilter: 'All', sortBy: 'none', sortDir: 'desc' }, // remembered Assets-tab filter/sort
    reportsPrefs: { subtab: 'performance', granularity: 'raw' }, // remembered Reports subtab + snapshot granularity
    settingsPrefs: { subtab: 'preferences' }, // remembered Settings subtab
    cashflowPrefs: { subtab: 'overview' }, // remembered Cash Flow-tab subtab
    /* ---------- Live Prices (manual-effort reduction) ----------
       Keyless, CORS-friendly sources only run automatically; the one source that needs a
       key (metals) or is CORS-unreliable from a static site (stocks) stays opt-in/manual-
       trigger. autoRefreshOnOpen is throttled to once/day, same pattern as autoBackup. */
    livePrices: { autoRefreshOnOpen: false, lastRefresh: null, lastAttempt: null, goldApiKey: '' }
  };
}
/* ---------- Bill-style liabilities (Tax Payable / Utility & Bills / Subscriptions) ----------
   Distinct from loans/credit cards: no amortization, just a recurring or one-off amount
   owed by a due date. `status` toggles 'due' <-> 'paid'; marking a recurring bill paid logs
   it to `history` and rolls `dueDate` forward by `recurring`, resetting status to 'due' for
   the next cycle. One-off bills (recurring:'none') just stay 'paid' once settled. */
const BILL_TYPE_CONFIG = {
  tax: { subtab: 'taxpayable', label: 'Tax Payable', noun: 'Tax', categories: ['Income Tax Payable', 'Advance Tax Payable', 'Property Tax', 'Self Assessment Tax', 'Capital Gains Tax', 'Other'] },
  utility: { subtab: 'utilitybills', label: 'Utility and Bills', noun: 'Bill', categories: ['Electricity', 'Water', 'Gas', 'Internet', 'Mobile', 'Rent Payable', 'Other'] },
  subscription: { subtab: 'subscriptions', label: 'Subscriptions', noun: 'Subscription', categories: ['Software', 'Gym', 'Professional Membership', 'Other'] }
};
// Maps a paid Bill's type to the Cash Flow expense category it mirrors into — see mirrorAutoExpense().
const BILL_TYPE_EXPENSE_CATEGORY = { tax: 'Taxes', utility: 'Utilities', subscription: 'Subscriptions' };
function billOutstanding(b) { return b.status === 'paid' ? 0 : (b.amount || 0); }
function billsOfType(type) { return state.bills.filter(b => b.type === type); }

function defaultState() {
  return {
    assets: [],
    categoriesAssets: ['Listed Stocks','Mutual Funds','Gold','Silver','Savings Account','PPF','NPS','Insurance','Cash Debt Given','Other'],
    creditCards: [],
    loans: [],
    cashLoans: [],
    bills: [],                       // Tax Payable / Utility & Bills / Subscriptions — see BILL_TYPE_CONFIG
    categoriesLiabilities: ['Credit Card','Personal Loan / EMI','Cash Loan Taken','Other'],
    loanCategories: ['Personal Loan', 'EMI', 'Vehicle Loan', 'Home Loan', 'Other'], // master list driving the Add/Edit Loan category dropdown — see loanCategories master-data section
    snapshots: [],
    settings: defaultSettings(),
    auditLog: [],
    transactionLog: [],              // high-frequency log: every transaction/payment/repayment/bill add-edit-delete — see logTransaction()

/* ===================== CALCULATION ENGINE ===================== */

/* ---------- XIRR via Newton-Raphson, with bisection fallback ---------- */
function xnpv(rate, cashflows) {
  const t0 = new Date(cashflows[0].date);
  return cashflows.reduce((sum, cf) => {
    const t = daysBetween(t0, cf.date) / 365;
    return sum + cf.amount / Math.pow(1 + rate, t);
  }, 0);
}
function xirr(cashflows) {
  if (!cashflows || cashflows.length < 2) return null;
  // A non-finite cashflow amount (e.g. an unconvertible foreign-currency
  // leg — see toBaseCurrency()) must never be folded into the solve: with a
  // NaN in the set, both hasPos/hasNeg checks and the bisection fallback's
  // sign comparisons (NaN < 0 is always false) can spuriously pass, letting
  // the bisection converge on a bogus finite rate instead of failing safely.
  if (cashflows.some(c => !Number.isFinite(c.amount))) return null;
  const sorted = [...cashflows].sort((a, b) => new Date(a.date) - new Date(b.date));
  const hasPos = sorted.some(c => c.amount > 0);
  const hasNeg = sorted.some(c => c.amount < 0);
  if (!hasPos || !hasNeg) return null; // XIRR undefined without both inflow & outflow

  // Newton-Raphson
  let rate = 0.15;
  for (let i = 0; i < 100; i++) {
    const f = xnpv(rate, sorted);
    const h = 1e-6;
    const fPrime = (xnpv(rate + h, sorted) - f) / h;
    if (Math.abs(fPrime) < 1e-12) break;
    const next = rate - f / fPrime;
    if (!isFinite(next)) break;
    if (Math.abs(next - rate) < 1e-7) { rate = next; break; }
    rate = next;
  }
  if (isFinite(rate) && Math.abs(xnpv(rate, sorted)) < 1) return rate * 100;

  // Bisection fallback across a wide range if Newton didn't converge
  let lo = -0.99, hi = 10;
  let fLo = xnpv(lo, sorted), fHi = xnpv(hi, sorted);
  if (fLo * fHi > 0) return null;
  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2;
    const fMid = xnpv(mid, sorted);
    if (Math.abs(fMid) < 1) return mid * 100;
    if ((fLo < 0) === (fMid < 0)) { lo = mid; fLo = fMid; } else { hi = mid; }
  }
  return ((lo + hi) / 2) * 100;
}

/* ---------- EMI / Amortization ----------
   Two interest conventions, per Item F.13: 'reducing' (existing math, interest computed on
   the outstanding balance each period) and 'flat' (interest computed once on the original
   principal for the full tenure, then split evenly — common for consumer/gold loans in India).
   interestType defaults to 'reducing' everywhere so loans saved before this field existed
   keep behaving exactly as they did. */
function emiAmount(principal, annualRatePct, tenureMonths, interestType) {
  interestType = interestType || 'reducing';
  // Defensive guard against non-finite/negative principal or rate reaching the amortization
  // math below — CSV import (parseMasterCSV) doesn't go through the Add Loan form's own
  // validation, so a bad value could otherwise still reach here and produce a negative or
  // NaN EMI (Phase 10 hardening — return 0, same as the existing invalid-tenure case).
  if (!Number.isFinite(principal) || principal < 0 || !Number.isFinite(annualRatePct) || annualRatePct < 0) return 0;
  if (!tenureMonths || tenureMonths <= 0) return 0;
  if (interestType === 'flat') {
    const r = (annualRatePct || 0) / 100;
    return principal * (1 + r * (tenureMonths / 12)) / tenureMonths;
  }
  const r = annualRatePct / 12 / 100;
  if (r === 0) return principal / tenureMonths;
  return principal * r * Math.pow(1 + r, tenureMonths) / (Math.pow(1 + r, tenureMonths) - 1);
}
function amortizationSchedule(principal, annualRatePct, tenureMonths, startDate, interestType) {
  interestType = interestType || 'reducing';
  const emi = emiAmount(principal, annualRatePct, tenureMonths, interestType);
  let balance = principal;
  const schedule = [];
  if (interestType === 'flat') {
    const flatInterestPerMonth = tenureMonths ? (principal * ((annualRatePct || 0) / 100) * (tenureMonths / 12)) / tenureMonths : 0;
    const principalPerMonth = tenureMonths ? principal / tenureMonths : 0;
    for (let m = 1; m <= tenureMonths; m++) {
      let princ = principalPerMonth;
      if (m === tenureMonths) princ = balance;
      balance = Math.max(0, balance - princ);
      schedule.push({
        month: m,
        date: addMonths(startDate, m),
        emi: Math.round((princ + flatInterestPerMonth) * 100) / 100,
        principal: Math.round(princ * 100) / 100,
        interest: Math.round(flatInterestPerMonth * 100) / 100,
        balance: Math.round(balance * 100) / 100
      });
    }
    return schedule;
  }
  const r = annualRatePct / 12 / 100;
  for (let m = 1; m <= tenureMonths; m++) {
    const interest = balance * r;
    let princ = emi - interest;
    if (m === tenureMonths) princ = balance;
    balance = Math.max(0, balance - princ);
    schedule.push({
      month: m,
      date: addMonths(startDate, m),
      emi: Math.round((princ + interest) * 100) / 100,
      principal: Math.round(princ * 100) / 100,
      interest: Math.round(interest * 100) / 100,
      balance: Math.round(balance * 100) / 100
    });
  }
  return schedule;

   Principal, Rate, and Tenure are the two closed-form derivations; Rate has no closed form
   (EMI isn't linear in r) so it's solved the same way xirr() solves for rate: Newton-Raphson
   on emiAmount() itself as the residual function, no bisection fallback needed — the EMI-vs-
   rate relationship is monotonic and well-behaved across any realistic loan.

  const n = -Math.log(1 - (principal * r) / emi) / Math.log(1 + r);

  if (interestType === 'flat') {
