    </div>`;
  root.appendChild(holder);
  const returnFocusEl = document.activeElement;
  const input = holder.querySelector('#cmdk-input');
  cmdkActive = 0;

  function renderList() {
    const q = input.value.trim().toLowerCase();
    const matches = commandPaletteActions().filter(a => !q || a.label.toLowerCase().includes(q) || a.group.toLowerCase().includes(q));
    const list = holder.querySelector('#cmdk-list');
    if (!matches.length) { list.innerHTML = `<div class="cmdk-empty">No matching actions.</div>`; return; }
    cmdkActive = Math.min(cmdkActive, matches.length - 1);
    list.innerHTML = matches.map((a, i) => `<div class="cmdk-item${i === cmdkActive ? ' active' : ''}" data-idx="${i}"><span>${a.label}</span><span class="grp">${a.group}</span></div>`).join('');
    list.querySelectorAll('.cmdk-item').forEach(el => {
      el.onmouseenter = () => { cmdkActive = parseInt(el.dataset.idx); renderList(); };
      el.onclick = () => runAction(matches[parseInt(el.dataset.idx)]);
    });
  }
  function runAction(a) {
    closeCommandPalette();
    a.run();
  }
  function keyHandler(e) {
    const q = input.value.trim().toLowerCase();
    const matches = commandPaletteActions().filter(a => !q || a.label.toLowerCase().includes(q) || a.group.toLowerCase().includes(q));
    if (e.key === 'Escape') { closeCommandPalette(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); cmdkActive = Math.min(cmdkActive + 1, matches.length - 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cmdkActive = Math.max(cmdkActive - 1, 0); renderList(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (matches[cmdkActive]) runAction(matches[cmdkActive]); }
  }
  holder.addEventListener('mousedown', (e) => { if (e.target === holder) closeCommandPalette(); });
  input.addEventListener('input', renderList);
  document.addEventListener('keydown', keyHandler);
  holder._cmdkCleanup = () => { document.removeEventListener('keydown', keyHandler); if (returnFocusEl && document.body.contains(returnFocusEl)) returnFocusEl.focus(); };
  renderList();
  input.focus();
}
function closeCommandPalette() {
  const holder = document.getElementById('cmdk-backdrop');
  if (!holder) return;
  if (holder._cmdkCleanup) holder._cmdkCleanup();
  holder.remove();
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (document.getElementById('cmdk-backdrop')) closeCommandPalette(); else openCommandPalette();
  }
});

/* ---------- Security & Lock (Phase 2) ----------
   Surfaces PIN/encryption/fingerprint status and the two actions that can't happen
   automatically: setting up a PIN after having skipped it, and re-enrolling
   fingerprint (needed once for any Phase-1 install to gain real PRF-backed
   fingerprint decryption, since the plain access-gate credential from Phase 1 wasn't
   created with the PRF extension and can't retroactively support it). */
function securityLockSectionHTML() {
  const pinSet = Lock.hasPinSetup();
  const encrypted = Lock.hasSessionKey();
  const fpEnrolled = Lock.hasFingerprint();
  const prfOk = Lock.prfSupported();
  return `
    <section class="block">
      <div class="section-label">Security &amp; Lock</div>
      <div class="card">
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <div class="flex-between"><span class="jn">PIN lock</span><span class="jn ${pinSet ? 'sem-favorable' : 'sem-caution'}">${pinSet ? '✓ Set up' : 'Not set up'}</span></div>
          <div class="flex-between"><span class="jn">Data encryption</span><span class="jn ${encrypted ? 'sem-favorable' : 'sem-caution'}">${encrypted ? '✓ AES-256, key derived from your PIN' : pinSet ? 'Unlock once to finish setup' : 'Requires a PIN'}</span></div>
          <div class="flex-between"><span class="jn">Fingerprint unlock</span><span class="jn ${fpEnrolled && prfOk ? 'sem-favorable' : 'sem-neutral'}">${fpEnrolled && prfOk ? '✓ Enrolled' : 'Not active'}</span></div>
        </div>
        ${!pinSet ? `<button class="btn btn-primary" id="btn-setup-pin-now">Set Up PIN &amp; Encryption</button>` : ''}
        ${pinSet && encrypted ? `<button class="btn" id="btn-reenroll-fp">${fpEnrolled && prfOk ? 'Re-enroll Fingerprint' : 'Enable Fingerprint Unlock'}</button>` : ''}
        ${fpEnrolled ? ` <button class="btn btn-ghost" id="btn-remove-fp">Remove Fingerprint</button>` : ''}
        ${pinSet ? ` <button class="btn btn-ghost" id="btn-lock-now">Lock Now</button>` : ''}
        ${pinSet && !encrypted ? `<div class="field helptext" style="margin-top:8px;">You have a PIN from before encryption was added — tap "Lock Now" above, then unlock again, to finish encrypting your data.</div>` : ''}
        <div class="field helptext" style="margin-top:8px;">Your PIN cannot be reset if forgotten — it's the only way to derive the key that decrypts your data. Export a backup regularly from Data Management below.</div>
      </div>
    </section>`;
}
function wireSecurityLockSection() {
  const setupBtn = document.getElementById('btn-setup-pin-now');
  if (setupBtn) setupBtn.onclick = () => {
    // Lock.boot() re-runs the setup flow (no PIN existed yet, so it always shows setup,
    // never unlock). Any existing plaintext data already sitting in memory needs an
    // explicit save now to actually get encrypted — Storage.load()'s own migration path
    // only fires on the NEXT load(), which won't happen again until a future reload.
    Lock.boot(async () => { await Storage.save(state); renderAll(); showToast('PIN and encryption set up.'); });
  };
  const reenrollBtn = document.getElementById('btn-reenroll-fp');
  if (reenrollBtn) reenrollBtn.onclick = async () => {
    reenrollBtn.disabled = true;
    const result = await Lock.reEnrollFingerprint();
    if (result.ok && result.prf) showToast('Fingerprint unlock enabled.');
    else if (result.ok) showToast("This device doesn't support fingerprint-based decryption — PIN only.");
    else showToast('Fingerprint enrollment was cancelled or failed.');
    renderSettings();
  };
  const removeBtn = document.getElementById('btn-remove-fp');
  if (removeBtn) removeBtn.onclick = () => {
    Lock.removeFingerprint();
    showToast('Fingerprint unlock removed.');
    renderSettings();
  };
  const lockNowBtn = document.getElementById('btn-lock-now');
  if (lockNowBtn) lockNowBtn.onclick = () => {
    // Same reasoning as Set Up PIN Now above: if this PIN predates encryption, unlocking
    // here is what generates the DEK for the first time — force a save right after so
    // existing data is actually encrypted immediately, not just on the next incidental edit.
    Lock.lockNow(async () => { await Storage.save(state); renderSettings(); });
  };
}

let healthCheckCategoryFilter = 'All'; // 'All' | 'Assets' | 'Liabilities' | 'Data Quality'
const SEVERITY_LABELS = { adverse: 'Needs Attention', caution: 'Worth a Look', neutral: 'Minor / Informational' };
const SEVERITY_ORDER = ['adverse', 'caution', 'neutral'];
function renderSettingsHealthCheck() {
  const wrap = document.getElementById('settings-content');
  const allFindings = healthCheckFindings();
  if (!allFindings.length) {
    wrap.innerHTML = `<div class="card empty-state">${emptyStateIcon()}<div class="big">All clear</div>No data-quality issues found.</div>`;
    return;
  }
  const groupCounts = { All: allFindings.length, Assets: 0, Liabilities: 0, 'Data Quality': 0 };
  allFindings.forEach(f => { groupCounts[f.group] = (groupCounts[f.group] || 0) + 1; });
  if (!['All', 'Assets', 'Liabilities', 'Data Quality'].includes(healthCheckCategoryFilter)) healthCheckCategoryFilter = 'All';
  const findings = healthCheckCategoryFilter === 'All' ? allFindings : allFindings.filter(f => f.group === healthCheckCategoryFilter);

  const severityCounts = { adverse: 0, caution: 0, neutral: 0 };
  findings.forEach(f => { if (severityCounts[f.sem] !== undefined) severityCounts[f.sem]++; });

  const filterChips = ['All', 'Assets', 'Liabilities', 'Data Quality'].map(g =>
    `<button class="chip ${healthCheckCategoryFilter === g ? 'active' : ''}" data-hc-filter="${g}">${g} <span class="count">${groupCounts[g] || 0}</span></button>`
  ).join('');

  const sections = SEVERITY_ORDER.map(sem => {
    const group = findings.filter(f => f.sem === sem);
    if (!group.length) return '';
    const rows = group.map(f => `
      <div class="hc-row" style="padding:12px 16px;border-bottom:1px solid var(--border-soft);border-left:3px solid ${semanticColorVar(f.sem)};" data-hc-target="${f.target ? escapeAttr(JSON.stringify(f.target)) : ''}">
        <div style="font-size:13px;color:${semanticColorVar(f.sem)};font-weight:600;">${f.category} — ${escapeHTML(f.label)}</div>
        <div class="jn" style="margin-top:2px;margin-left:0;color:var(--text-muted);font-family:var(--font-body);">${escapeHTML(f.detail)}</div>
      </div>`).join('');
    return `
      <div class="block">
        <div class="jn" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;color:${semanticColorVar(sem)};">${semanticIcon(sem)} ${SEVERITY_LABELS[sem]} <span style="font-weight:400;">(${group.length})</span></div>
        <div class="card" style="padding:0;">${rows}</div>
      </div>`;
  }).join('');

  wrap.innerHTML = `
    <section class="block">
      <div class="section-label">Health Check <span class="hint">${findings.length} of ${allFindings.length} finding${allFindings.length !== 1 ? 's' : ''} shown${severityCounts.adverse ? ` · ${severityCounts.adverse} needs attention` : ''}</span></div>
      <div class="chip-bar" style="margin-bottom:14px;">${filterChips}</div>
      ${findings.length ? sections : `<div class="card empty-state">${emptyStateIcon()}No findings in this category.</div>`}
    </section>
  `;
  wrap.querySelectorAll('[data-hc-filter]').forEach(b => b.onclick = () => { healthCheckCategoryFilter = b.dataset.hcFilter; renderSettingsHealthCheck(); });
  wrap.querySelectorAll('[data-hc-target]').forEach(row => row.onclick = () => {
    const raw = row.dataset.hcTarget;
    openHealthCheckItem(raw ? JSON.parse(raw) : null);
  });
}

/* ---------- Application Preferences: theme, privacy, currency, reminder thresholds ----------
   Each control saves immediately on change (no separate "Save" step — matches the
   single-save-action-per-screen approach already used by the category pill lists below). */
async function saveThemePreference(value) {

}
async function savePrivacyModePreference(checked) {

}
async function saveReminderThreshold(band, value) {
  const n = parseInt(value);
  if (!n || n < 1) { renderSettings(); return; }
  state.settings.reminderThresholds[band] = n;
  await Storage.save(state);
}
async function saveMonthlyIncome(value) {
  const n = parseFloat(value);
  state.settings.monthlyIncome = (isNaN(n) || n < 0) ? 0 : n;
  await Storage.save(state);
}
async function saveBaseCurrency(value) {
  const prev = state.settings.baseCurrency;
  if (value === prev) { renderSettings(); return; }
  // exchangeRates is stored as "1 unit of X = rate units of the CURRENT base
  // currency". Simply swapping baseCurrency without re-deriving the map would
  // leave every existing rate meaningless (e.g. a USD rate quoted in INR terms
  // suddenly read as if it were quoted in the new base) — exactly the
  // "changing base currency can leave conversion relationships inconsistent"
  // bug. Re-pivot every rate through the old base so the real-world FX
  // relationships are preserved; asset/transaction amounts themselves are
  // never touched, only the conversion table.
  const pivotRate = state.settings.exchangeRates[value];
  if (Number.isFinite(pivotRate) && pivotRate > 0) {
    const rebased = {};
    rebased[prev] = 1 / pivotRate; // old base now needs a rate into the new base
    Object.keys(state.settings.exchangeRates).forEach((code) => {
      if (code === value) return; // becomes the base — no self-rate needed
      const oldRate = state.settings.exchangeRates[code];
      if (Number.isFinite(oldRate) && oldRate > 0) rebased[code] = oldRate / pivotRate;
      // Non-finite/invalid old rates are dropped rather than carried forward
      // as corrupted numbers — Health Check will flag the resulting gap.
    });
    state.settings.exchangeRates = rebased;
    if (!state.settings.currencies.includes(prev)) state.settings.currencies.push(prev);
    state.settings.baseCurrency = value;
    logAudit('update', 'Settings', 'Base Currency', `${prev} → ${value}`);
    await Storage.save(state);
    showToast('Base currency updated — exchange rates re-based automatically');
  } else {
    // No rate exists to pivot old ⇄ new base, so the old rate table can't be
    // safely re-derived. Clear it rather than leave stale, wrongly-denominated
    // rates in place — this surfaces as "Missing FX Rate" in Health Check
    // instead of silently mis-converting existing assets.
    state.settings.exchangeRates = {};
    if (!state.settings.currencies.includes(prev)) state.settings.currencies.push(prev);
    state.settings.baseCurrency = value;
    logAudit('update', 'Settings', 'Base Currency', `${prev} → ${value}`);
    await Storage.save(state);
    showToast(`Base currency changed to ${value} — re-enter exchange rates, old rates couldn't convert automatically`);
  }
  renderSettings();
}

/* ---------- Currency & Exchange Rates ---------- */
async function addOrUpdateExchangeRates() {
  const raw = document.getElementById('f-fx-csv').value.trim();
  if (!raw) { showToast('Paste at least one currency,rate row'); return; }
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
  let updated = 0, skipped = 0;
  lines.forEach(line => {
    const parts = csvParseLine(line);
    if (parts.length < 2) { skipped++; return; }
    const code = parts[0].trim().toUpperCase();
    const rate = parseFloat(parts[1]);
    if (!code || isNaN(rate) || rate <= 0 || code === state.settings.baseCurrency) { skipped++; return; }
    if (!state.settings.currencies.includes(code)) state.settings.currencies.push(code);
    state.settings.exchangeRates[code] = rate;
    updated++;
  });
  await Storage.save(state);
  showToast(`Updated ${updated} rate${updated !== 1 ? 's' : ''}${skipped ? `, skipped ${skipped}` : ''}`);
  renderSettings();
}
async function deleteCurrency(code) {
  state.settings.currencies = state.settings.currencies.filter(c => c !== code);
  delete state.settings.exchangeRates[code];
  await Storage.save(state);
  showToast('Currency removed');
  renderSettings();
}

/* ---------- Quick-add rows (Item: same UX as Bulk Update Prices) ----------
   Appends a CSV line built from the dropdown/fields into the existing textarea,
   rather than saving directly — so the textarea stays the single source of

function wireQuickAddBenchmark() {

/* ---------- Benchmarks (spec 4.4) — pasted periodically, no live index feed ---------- */
async function addOrUpdateBenchmarks() {
  const raw = document.getElementById('f-benchmark-csv').value.trim();
  if (!raw) { showToast('Paste at least one row'); return; }
  const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

      fd: fd ? parseFloat(fd) : null,

    };

    if (existingIdx >= 0) state.settings.benchmarks[existingIdx] = entry; else state.settings.benchmarks.push(entry);
    updated++;
  });

}

    : kind === 'income' ? state.income.some(e => e.category === name)

/* Shared by every "download a file" action (JSON backup, Master CSV, CSV import templates) */
function downloadTextFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportDownload() {
  const backup = Lock.hasSessionKey() ? await Lock.buildPortableBackup(JSON.stringify(state)) : null;
  if (backup) {

/* ---------- Master CSV: every asset + liability record in one file ---------- */
function csvEscape(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvParseLine(line) {
  const out = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else { inQ = false; } }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
  }
  out.push(cur);
  return out.map(s => s.trim());
}
function buildMasterCSV() {
  const lines = [];
  lines.push('### ASSETS');
  lines.push('category,name,hasUnits,unitLabel,ledgerStyle,openingBalance,currentPrice,currentValue');
  state.assets.forEach(a => lines.push([a.category, a.name, a.hasUnits, a.unitLabel || '', !!a.ledgerStyle, a.openingBalance || 0, a.currentPrice ?? '', a.currentValue ?? ''].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### TRANSACTIONS');
  lines.push('assetName,date,type,qty,price,amount,note');
  state.assets.forEach(a => a.transactions.forEach(t => lines.push([a.name, t.date, t.type, t.qty ?? '', t.price ?? '', t.amount, t.note || ''].map(csvEscape).join(','))));
  lines.push('');
  lines.push('### CREDIT_CARDS');
  lines.push('name,dueDayOffset');
  state.creditCards.forEach(c => lines.push([c.name, c.dueDayOffset || 20].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### CREDIT_CARD_BILLS');
  lines.push('cardName,billDate,dueDate,amount,paid,paidAmount');
  state.creditCards.forEach(c => c.bills.forEach(b => lines.push([c.name, b.billDate, b.dueDate, b.amount, !!b.paid, b.paidAmount || 0].map(csvEscape).join(','))));
  lines.push('');
  lines.push('### LOANS');
  lines.push('name,category,principal,rate,tenureMonths,startDate');
  state.loans.forEach(l => lines.push([l.name, l.category, l.principal, l.rate, l.tenureMonths, l.startDate].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### LOAN_PAYMENTS');
  lines.push('loanName,date,amount');
  state.loans.forEach(l => (l.payments || []).forEach(p => lines.push([l.name, p.date, p.amount].map(csvEscape).join(','))));
  lines.push('');
  lines.push('### CASH_LOANS');
  lines.push('name,principal,rate,startDate');
  state.cashLoans.forEach(c => lines.push([c.name, c.principal, c.rate || 0, c.startDate].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### CASH_LOAN_REPAYMENTS');
  lines.push('cashLoanName,date,amount');
  state.cashLoans.forEach(c => (c.repayments || []).forEach(r => lines.push([c.name, r.date, r.amount].map(csvEscape).join(','))));
  lines.push('');
  lines.push('### BILLS');
  lines.push('type,category,name,amount,dueDate,recurring,status,notes');
  state.bills.forEach(b => lines.push([b.type, b.category, b.name || '', b.amount, b.dueDate, b.recurring, b.status, b.notes || ''].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### INCOME');
  lines.push('date,category,amount,account,note,recurringFreq,recurringCount,source,linkedId');
  state.income.forEach(e => lines.push([e.date, e.category, e.amount, e.account || '', e.note || '', e.recurring ? e.recurring.freq : '', e.recurring ? e.recurring.count : '', e.source || 'manual', e.linkedId || ''].map(csvEscape).join(',')));
  lines.push('');
  lines.push('### EXPENSES');
  lines.push('date,category,amount,account,note,recurringFreq,recurringCount,source,linkedId');
  state.expenses.forEach(e => lines.push([e.date, e.category, e.amount, e.account || '', e.note || '', e.recurring ? e.recurring.freq : '', e.recurring ? e.recurring.count : '', e.source || 'manual', e.linkedId || ''].map(csvEscape).join(',')));
  return lines.join('\n');
}
function exportMasterCSV() {
  downloadTextFile(`wealth-ledger-master-${todayISO()}.csv`, buildMasterCSV(), 'text/csv');
  showToast('Master CSV downloaded');
}
function findOrCreateAsset(name, category) {
  let a = state.assets.find(x => x.name.toLowerCase() === String(name).toLowerCase());
  if (!a) {
    a = { id: uid(), category: category || 'Other', name, hasUnits: true, unitLabel: 'units', currentPrice: null, currentValue: 0, lastUpdated: null, ledgerStyle: false, openingBalance: 0, transactions: [] };
    state.assets.push(a);
    if (category && !state.categoriesAssets.includes(category)) state.categoriesAssets.push(category);
  }
  return a;
}
function findOrCreateCard(name) {
  let c = state.creditCards.find(x => x.name.toLowerCase() === String(name).toLowerCase());
  if (!c) { c = { id: uid(), name, dueDayOffset: 20, bills: [] }; state.creditCards.push(c); }
  return c;

        const l = findOrCreateLoan(row.loanName);

        counts.payments++;
        break;
      }
      case 'CASH_LOANS': {
        if (!row.name) return;
        const c = findOrCreateCashLoan(row.name, { principal: positiveOr(row.principal, 0), rate: nonNegativeOr(row.rate, 0), startDate: row.startDate || todayISO() });

        c.rate = nonNegativeOr(row.rate, c.rate);
        c.startDate = row.startDate || c.startDate;

        break;
      }
      case 'CASH_LOAN_REPAYMENTS': {
        if (!row.cashLoanName || !row.date) return;
        const amount = positiveOr(row.amount, null);
        if (amount === null) return;
        const c = findOrCreateCashLoan(row.cashLoanName);

        counts.repayments++;

      case 'BILLS': {

        if (!BILL_TYPE_CONFIG[row.type]) return;

        break;
      }
      case 'INCOME': {
        if (!row.date || !row.amount) return;
        const category = row.category || 'Other';
        state.income.push({
          id: uid(), date: row.date, category, amount: parseFloat(row.amount) || 0,
          account: row.account || '', note: row.note || '',
          recurring: row.recurringFreq ? { freq: row.recurringFreq, count: parseInt(row.recurringCount) || 1 } : null,
          source: row.source === 'auto' ? 'auto' : 'manual',

      case 'EXPENSES': {
        if (!row.date || !row.amount) return;
        const category = row.category || 'Other';
        state.expenses.push({
          id: uid(), date: row.date, category, amount: parseFloat(row.amount) || 0,
          account: row.account || '', note: row.note || '',
          recurring: row.recurringFreq ? { freq: row.recurringFreq, count: parseInt(row.recurringCount) || 1 } : null,
          source: row.source === 'auto' ? 'auto' : 'manual',
          linkedId: row.linkedId || null
        });

        counts.expenses++;
        break;
      }

async function applyImport(raw) {

  if (parsed && typeof parsed === 'object' && parsed.wlBackup && parsed.encrypted) {
    openRestorePinModal(parsed);
    return;
  }
  if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.assets)) { showToast('This does not look like a Wealth Ledger backup'); return; }
  const ok = await confirmModal('Restore Backup?', 'This will replace all current data. Continue?', 'Restore');
  if (!ok) return;
  state = mergeLoadedState(parsed);
  logAudit('restore', 'Backup', 'Data restored from backup'); // logged onto the NEW state, after replacement, so it isn't lost by mergeLoadedState() adopting the backup's own auditLog
  await Storage.save(state);
  showToast('Data restored');
  renderAll();
}

   show an inline error and let the user retry on failure. The verifier here is
   Lock.decryptPortableBackup() rather than Lock.verifyPin() — this backup may have been

      const ok = await confirmModal('Restore Backup?', 'This will replace all current data. Continue?', 'Restore');
      if (!ok) return { ok: true };
      state = mergeLoadedState(parsedState);

      await Storage.save(state);
      showToast('Data restored');
      renderAll();
      return { ok: true };
    });
  });
}

  return `
    <h3>${title}</h3>
    <div class="modal-sub">${subtitle}</div>
    <div id="erase-pin-dots" class="pin-dots" style="margin-top:18px;"></div>
    <div id="erase-pin-pad" class="pin-pad"></div>
    <div id="erase-pin-error" class="lock-error" aria-live="polite"></div>
    <div class="modal-actions" style="justify-content:center;">

    </div>

   on (opened the next modal), so this pad has nothing further to do. */
function wireErasePinPad(modal, onSubmit) {
  const PIN_LEN = 6;
  let buf = '';
  const dotsEl = modal.querySelector('#erase-pin-dots');
  const padEl = modal.querySelector('#erase-pin-pad');
  const errEl = modal.querySelector('#erase-pin-error');
  function renderDots() {
    dotsEl.innerHTML = Array.from({ length: PIN_LEN }, (_, i) => `<span class="pin-dot ${i < buf.length ? 'filled' : ''}"></span>`).join('');
  }
  function renderPad() {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'back'];
    padEl.innerHTML = keys.map(k => {
      if (k === '') return `<button class="pin-key ghost" tabindex="-1" disabled></button>`;
      if (k === 'back') return `<button class="pin-key action" data-pin-key="back" aria-label="Backspace">⌫</button>`;
      return `<button class="pin-key" data-pin-key="${k}">${k}</button>`;
    }).join('');

      btn.onclick = () => {
        if (btn.dataset.pinKey === 'back') { buf = buf.slice(0, -1); renderDots(); return; }
        if (buf.length >= PIN_LEN) return;
        buf += btn.dataset.pinKey;
        errEl.textContent = '';

        if (buf.length === PIN_LEN) {
          const entered = buf;
          buf = '';
          Promise.resolve(onSubmit(entered)).then((res) => {

            renderDots();

  renderPad();

    modal.querySelector('#erase-pin-cancel').onclick = closeModal;

      const ok = await Lock.verifyPin(pin);
      if (!ok) return { ok: false };

    });
  });
}

/* =========================================================================

   Scope note: this is an ACCESS gate, not yet the encryption layer — the PIN
   here is verified against a salted hash, not (yet) used as key material.
   Phase 2 wires real AES-256 encryption with the key derived from this same

   verifier and the future encryption key are cheap to keep in sync.

  const DEK_WRAPPED_PIN_KEY = 'wl-dek-wrapped-pin';   // {iv, ct} — the DEK, encrypted under the PIN-derived key

  const WEBAUTHN_CRED_KEY = 'wl-lock-webauthn-cred-id';

  // salt just needs to be *consistent* every time so the same authenticator always derives
  // the same output bytes for this app.

  let pinBuffer = '';
  let mode = 'unlock'; // 'unlock' | 'setup-create' | 'setup-confirm'
  let firstPin = '';
  let onSuccess = null;

  /* ===================== Crypto primitives ===================== */
  // Chunked deliberately: spreading a large Uint8Array as individual arguments to
  // String.fromCharCode (the naive one-liner) hits the JS engine's per-call argument
  // limit (~60-65k) once the buffer gets big — which a whole encrypted app-state
  // payload (or a portable backup, which encrypts the same payload again) comfortably
  // exceeds. Processing in fixed-size chunks avoids that ceiling entirely regardless
  // of how large the buffer is.
  function buf2b64(buf) {
    const bytes = new Uint8Array(buf);
    const chunkSize = 0x8000; // 32,768 — comfortably under the engine's argument limit
    let binary = '';
    for (let i = 0; i < bytes.length; i += chunkSize) {

    return crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' }, keyMaterial, bits);
  }

  // DEK-wrapping key derived below, so this stored hash alone could never be used to
  // reconstruct the actual encryption key.
  async function deriveVerifier(pin, saltB64) {
    const bits = await pbkdf2Bits(pin, saltB64, 256);
    const tagged = new Uint8Array([...new Uint8Array(bits), ...new TextEncoder().encode(':verify')]);
    const digest = await crypto.subtle.digest('SHA-256', tagged);
    return buf2b64(digest);
  }

  // The PIN-derived key used only to wrap/unwrap the DEK — a different salt (ENC_SALT_KEY)
  // than the verifier's, so it's an independently-derived key even though both start from
  // the same PIN.
  async function deriveWrappingKeyFromPIN(pin) {

     never stored in the clear — only wrapped (encrypted) under whichever unlock
     factor(s) are set up: always under the PIN, and additionally under the WebAuthn
     PRF output when the device/browser supports it. Both unlock paths decrypt the
     exact same DEK, so either one can open the exact same encrypted vault. This is
     the standard pattern (see Bitwarden, 1Password, etc.) — deliberately NOT "derive
     two independent keys from two factors," since that would mean data encrypted via
     one factor couldn't be opened via the other. */
  async function wrapAndStoreDEK(dekBuf, wrappingKey, storageKey) {
    const wrapped = await aesEncrypt(wrappingKey, dekBuf);
    localStorage.setItem(storageKey, JSON.stringify(wrapped));
  }
  async function unwrapDEK(wrappingKey, storageKey) {
    const raw = localStorage.getItem(storageKey);
    if (!raw) return null;
    try {
      const { iv, ct } = JSON.parse(raw);
      return await aesDecrypt(wrappingKey, iv, ct);
    } catch (e) {
      return null; // wrong key, or corrupt entry
    }
  }

  async function setSessionDEKFromBuffer(dekBuf) { sessionDEK = new Uint8Array(dekBuf); }
  async function importSessionAESKey() {
    if (!sessionDEK) return null;
    return crypto.subtle.importKey('raw', sessionDEK, 'AES-GCM', false, ['encrypt', 'decrypt']);
  }

  /* Called by Storage — encrypts/decrypts the whole app-state JSON blob under the
     session's DEK. Storage never sees the DEK itself, just these two functions. */
  async function encryptPayload(jsonString) {
    const key = await importSessionAESKey();
    if (!key) throw new Error('No session encryption key — app should be locked');
    return aesEncrypt(key, new TextEncoder().encode(jsonString));
  }
  async function decryptPayload(ivB64, ctB64) {
    const key = await importSessionAESKey();
    if (!key) throw new Error('No session encryption key — app should be locked');
    const buf = await aesDecrypt(key, ivB64, ctB64);
    return new TextDecoder().decode(buf);
  }
  function hasSessionKey() { return !!sessionDEK; }

  /* ===================== Phase 3: portable encrypted backups =====================
     A backup made this way is self-contained — it carries its own copy of the salt and
     PIN-wrapped DEK (the same ones already sitting in ENC_SALT_KEY/DEK_WRAPPED_PIN_KEY
     for this device, just also embedded in the file), so restoring it never depends on
     the *restoring* device's own local Lock state. Enter the PIN the backup was made
     under, on any device, and it decrypts — that's the whole portability story. Nothing
     about this device's own PIN/DEK changes as a side effect of building or reading one. */
  async function buildPortableBackup(jsonString) {
    if (!sessionDEK) return null;
    const wrappedRaw = localStorage.getItem(DEK_WRAPPED_PIN_KEY);
    const saltB64 = localStorage.getItem(ENC_SALT_KEY);
    if (!wrappedRaw || !saltB64) return null;
    const { iv, ct } = await encryptPayload(jsonString);
    return {
      wlBackup: true, version: 1, encrypted: true, createdAt: new Date().toISOString(),
      kdfSalt: saltB64, kdfIterations: PBKDF2_ITERATIONS, kdfHash: 'SHA-256',
      dekWrapped: JSON.parse(wrappedRaw),
      payload: { iv, ct }
    };
  }
  // Returns { ok:true, json } or { ok:false, reason }. Deliberately takes the whole
  // backup object rather than reading anything from this device's localStorage.
  async function decryptPortableBackup(pin, backup) {
    try {
      const salt = b642buf(backup.kdfSalt);
      const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      const wrappingKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: backup.kdfIterations || PBKDF2_ITERATIONS, hash: backup.kdfHash || 'SHA-256' },
        keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );
      let dekBuf;
      try {
        dekBuf = await aesDecrypt(wrappingKey, backup.dekWrapped.iv, backup.dekWrapped.ct);
      } catch (e) {
        return { ok: false, reason: 'Incorrect PIN — try again.' };
      }
      const dekKey = await crypto.subtle.importKey('raw', dekBuf, 'AES-GCM', false, ['decrypt']);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: new Uint8Array(b642buf(backup.payload.iv)) }, dekKey, b642buf(backup.payload.ct));
      return { ok: true, json: new TextDecoder().decode(plainBuf) };
    } catch (e) {
      return { ok: false, reason: 'Could not read this backup — it may be corrupt or from an incompatible version.' };
    }
  }

  function hasPinSetup() { return !!localStorage.getItem(PIN_HASH_KEY); }
  function hasFingerprint() { return !!localStorage.getItem(WEBAUTHN_CRED_KEY); }
  function prfSupported() { return localStorage.getItem(WEBAUTHN_PRF_SUPPORTED_KEY) === '1'; }
  function hasDEKWrapped() { return !!localStorage.getItem(DEK_WRAPPED_PIN_KEY); }

  async function setupPin(pin) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const saltB64 = buf2b64(salt.buffer);
    const hash = await deriveVerifier(pin, saltB64);
    localStorage.setItem(PIN_SALT_KEY, saltB64);
    localStorage.setItem(PIN_HASH_KEY, hash);
    localStorage.removeItem(FAIL_COUNT_KEY);
    localStorage.removeItem(FAIL_UNTIL_KEY);

    // Generate the DEK now and wrap it under this PIN — this is a brand-new vault
    // (first-run setup), so there's no existing plaintext data to migrate.
    const dek = crypto.getRandomValues(new Uint8Array(32));
    const wrappingKey = await deriveWrappingKeyFromPIN(pin);
    await wrapAndStoreDEK(dek.buffer, wrappingKey, DEK_WRAPPED_PIN_KEY);
    await setSessionDEKFromBuffer(dek.buffer);
  }

  async function verifyPin(pin) {
    const saltB64 = localStorage.getItem(PIN_SALT_KEY);
    const stored = localStorage.getItem(PIN_HASH_KEY);
    if (!saltB64 || !stored) return false;
    const hash = await deriveVerifier(pin, saltB64);
    return hash === stored;
  }

  // Called after a PIN is confirmed correct — unwraps (or, for a Phase-1 install
  // upgrading to Phase 2, generates and wraps for the first time) the DEK.
  async function unlockDEKWithPin(pin) {
    const wrappingKey = await deriveWrappingKeyFromPIN(pin);
    if (hasDEKWrapped()) {
      const dekBuf = await unwrapDEK(wrappingKey, DEK_WRAPPED_PIN_KEY);
      if (!dekBuf) {
        // PIN verifier passed but the wrap won't open — shouldn't happen in normal
        // operation. Refuse to silently generate a fresh DEK here, since real vault
        // data may exist under the old one; that would look like a successful unlock
        // into an empty/corrupted vault instead of surfacing the problem.
        throw new Error('dek-unwrap-failed');
      }
      await setSessionDEKFromBuffer(dekBuf);
      return { migrated: false };
    }
    // No wrapped DEK yet — this PIN was set up back in Phase 1, before encryption
    // existed. Generate the DEK now and wrap it under the PIN the user just entered.
    // Storage.load() will separately detect the still-plaintext saved data and
    // re-save it encrypted under this new DEK right after boot.
    const dek = crypto.getRandomValues(new Uint8Array(32));
    await wrapAndStoreDEK(dek.buffer, wrappingKey, DEK_WRAPPED_PIN_KEY);
    await setSessionDEKFromBuffer(dek.buffer);
    return { migrated: true };
  }

  function getLockoutRemaining() {
    const until = parseInt(localStorage.getItem(FAIL_UNTIL_KEY) || '0', 10);
    return Math.max(0, until - Date.now());
  }
  function registerFailure() {
    const count = parseInt(localStorage.getItem(FAIL_COUNT_KEY) || '0', 10) + 1;
    localStorage.setItem(FAIL_COUNT_KEY, String(count));
    if (count >= 3) {
      const backoffSec = Math.min(30 * Math.pow(2, count - 3), 300); // 30s, 60s, 120s ... capped at 5 min
      localStorage.setItem(FAIL_UNTIL_KEY, String(Date.now() + backoffSec * 1000));
    }
    return count;
  }
  function registerSuccess() {
    localStorage.removeItem(FAIL_COUNT_KEY);
    localStorage.removeItem(FAIL_UNTIL_KEY);
  }

  /* ===================== WebAuthn (fingerprint + PRF) =====================
     Enrollment always requests the PRF extension. Whether it's actually honored
     depends on the device/OS/browser — this is exactly the open item flagged in the
     plan (section 8, "confirm S23 FE's Chrome/Samsung Internet version supports
     PRF") and can only be confirmed by testing on the real device. If it's not
     honored, fingerprint is simply not offered as an unlock method (rather than
     kept around as a gate that can't actually decrypt anything) — matches the
     plan's "clean fallback... with no broken experience." */
  async function enrollFingerprint(pin) {
    if (!window.PublicKeyCredential) return { ok: false };
    try {
      const userId = crypto.getRandomValues(new Uint8Array(16));
      const cred = await navigator.credentials.create({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          rp: { name: 'Wealth Ledger' },
          user: { id: userId, name: 'wealth-ledger', displayName: 'Wealth Ledger' },
          pubKeyCredParams: [{ alg: -7, type: 'public-key' }, { alg: -257, type: 'public-key' }],
          authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
          timeout: 60000,
          attestation: 'none',
          extensions: { prf: { eval: { first: PRF_EVAL_SALT } } }
        }
      });
      if (!cred) return { ok: false };

      let prfBuf = null;
      const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
      if (ext && ext.prf && ext.prf.results && ext.prf.results.first) {
        prfBuf = ext.prf.results.first;
      } else if (ext && ext.prf && ext.prf.enabled) {
        // Supported, but this browser only confirms support at creation and hands
        // back the actual output on a follow-up get() — fetch it now while we still
        // have the user's attention, so setup finishes in one flow.
        try {
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: crypto.getRandomValues(new Uint8Array(32)),
              allowCredentials: [{ id: cred.rawId, type: 'public-key' }],
              userVerification: 'required',
              extensions: { prf: { eval: { first: PRF_EVAL_SALT } } },
              timeout: 60000
            }
          });
          const aext = assertion && assertion.getClientExtensionResults ? assertion.getClientExtensionResults() : {};
          if (aext && aext.prf && aext.prf.results && aext.prf.results.first) prfBuf = aext.prf.results.first;
        } catch (e) { /* leave prfBuf null — falls through to unsupported path */ }
      }

      localStorage.setItem(WEBAUTHN_CRED_KEY, buf2b64(cred.rawId));

      if (prfBuf && sessionDEK) {
        const prfKey = await derivePRFWrappingKey(prfBuf);
        await wrapAndStoreDEK(sessionDEK.buffer, prfKey, DEK_WRAPPED_PRF_KEY);
        localStorage.setItem(WEBAUTHN_PRF_SUPPORTED_KEY, '1');
        return { ok: true, prf: true };
      }
      localStorage.setItem(WEBAUTHN_PRF_SUPPORTED_KEY, '0');
      // No usable PRF output — remove the credential rather than keep a fingerprint
      // button around that can't actually unlock encrypted data.
      localStorage.removeItem(WEBAUTHN_CRED_KEY);
      return { ok: true, prf: false };
    } catch (e) {
      console.warn('Fingerprint enrollment failed/declined', e);
      return { ok: false };
    }
  }

  async function verifyFingerprintAndUnwrapDEK() {
    const credIdB64 = localStorage.getItem(WEBAUTHN_CRED_KEY);
    if (!credIdB64 || !window.PublicKeyCredential || !prfSupported()) return false;
    try {
      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: b642buf(credIdB64), type: 'public-key' }],
          userVerification: 'required',
          extensions: { prf: { eval: { first: PRF_EVAL_SALT } } },
          timeout: 60000
        }
      });
      if (!assertion) return false;
      const ext = assertion.getClientExtensionResults ? assertion.getClientExtensionResults() : {};
      const prfBuf = ext && ext.prf && ext.prf.results && ext.prf.results.first;
      if (!prfBuf) return false;
      const prfKey = await derivePRFWrappingKey(prfBuf);
      const dekBuf = await unwrapDEK(prfKey, DEK_WRAPPED_PRF_KEY);
      if (!dekBuf) return false;
      await setSessionDEKFromBuffer(dekBuf);
      return true;
    } catch (e) {
      return false; // cancelled, failed, or unavailable — caller falls back to PIN
    }
  }

  /* ---------- UI ---------- */
  const el = (id) => document.getElementById(id);

  function renderDots(len, errState) {
    const wrap = el('pin-dots');
    wrap.innerHTML = '';
    for (let i = 0; i < PIN_LENGTH; i++) {
      const d = document.createElement('div');
      d.className = 'pin-dot' + (i < len ? (errState ? ' err' : ' filled') : '');
      wrap.appendChild(d);
    }
  }

  function renderPad() {
    const pad = el('pin-pad');
    pad.innerHTML = '';
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    keys.forEach((k) => {
      const b = document.createElement('button');
      if (k === '') { b.className = 'pin-key ghost'; b.disabled = true; }
      else if (k === '⌫') { b.className = 'pin-key action'; b.textContent = 'Delete'; b.onclick = () => onKey('back'); }
      else { b.className = 'pin-key'; b.textContent = k; b.onclick = () => onKey(k); }
      pad.appendChild(b);
    });
  }

  async function onKey(k) {
    if (k === 'back') { pinBuffer = pinBuffer.slice(0, -1); renderDots(pinBuffer.length); return; }
    if (pinBuffer.length >= PIN_LENGTH) return;
    pinBuffer += k;
    renderDots(pinBuffer.length);
    if (pinBuffer.length === PIN_LENGTH) await onPinComplete();
  }

  async function onPinComplete() {
    const pin = pinBuffer;
    if (mode === 'unlock') {
      const remaining = getLockoutRemaining();
      if (remaining > 0) {
        el('lock-error').textContent = `Too many attempts. Try again in ${Math.ceil(remaining / 1000)}s.`;
        pinBuffer = ''; renderDots(0);
        return;
      }
      const ok = await verifyPin(pin);
      if (ok) {
        registerSuccess();
        try {
          const { migrated } = await unlockDEKWithPin(pin);
          finish();
        } catch (e) {
          el('lock-error').textContent = 'Could not unlock your data. If this keeps happening, restore from a backup in Settings.';
          pinBuffer = ''; renderDots(0);
        }
      } else {
        const count = registerFailure();
        renderDots(PIN_LENGTH, true);
        el('lock-error').textContent = count >= 3 ? 'Incorrect PIN. Too many attempts — please wait.' : 'Incorrect PIN. Try again.';
        setTimeout(() => { pinBuffer = ''; renderDots(0); }, 400);
      }
    } else if (mode === 'setup-create') {
      firstPin = pin;
      mode = 'setup-confirm';
      pinBuffer = '';
      el('lock-title').textContent = 'Confirm your PIN';
      el('lock-sub').textContent = 'Enter it once more';
      renderDots(0);
    } else if (mode === 'setup-confirm') {
      if (pin === firstPin) {
        await setupPin(pin);
        el('lock-error').textContent = '';
        await offerFingerprintThenFinish(pin);
      } else {
        el('lock-error').textContent = "PINs didn't match — let's try again.";
        mode = 'setup-create'; firstPin = ''; pinBuffer = '';
        el('lock-title').textContent = 'Set up your PIN';
        el('lock-sub').textContent = `Choose a ${PIN_LENGTH}-digit PIN to protect your data`;
        renderDots(0, true);
      }
    }
  }

  async function offerFingerprintThenFinish(pin) {
    if (!window.PublicKeyCredential) { finish(); return; }
    let available = false;
    try { available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) {}
    if (!available) { finish(); return; }

    el('pin-pad').style.display = 'none';
    el('pin-dots').style.display = 'none';
    el('lock-title').textContent = 'Add fingerprint unlock?';
    el('lock-sub').textContent = 'Faster than typing your PIN each time. You can still use your PIN whenever you need to.';
    const fpBtn = el('lock-fp-btn');
    fpBtn.style.display = 'flex';
    fpBtn.onclick = async () => {
      fpBtn.disabled = true;
      const result = await enrollFingerprint(pin);
      if (result.ok && result.prf === false) {
        showToast("Fingerprint unlock isn't supported for encrypted data on this device — you'll use your PIN.");
      }
      finish();
    };
    const skip = el('lock-skip-link');
    skip.style.display = 'inline';
    skip.textContent = 'Skip — use PIN only';
    skip.onclick = () => finish();
  }

  function finish() {
    document.getElementById('lock-screen').classList.add('hidden');
    if (onSuccess) { const cb = onSuccess; onSuccess = null; cb(); }
  }

  async function showUnlock() {
    mode = 'unlock'; pinBuffer = '';
    el('lock-title').textContent = 'Wealth Ledger';
    el('lock-sub').textContent = 'Enter your PIN to continue';
    el('lock-error').textContent = '';
    el('pin-pad').style.display = 'grid';
    el('pin-dots').style.display = 'flex';
    el('lock-skip-link').style.display = 'none';
    el('lock-setup-note').style.display = 'none';
    renderDots(0);

    if (hasFingerprint() && prfSupported()) {
      const fpBtn = el('lock-fp-btn');
      fpBtn.style.display = 'flex';
      const altLink = el('lock-alt-link');
      altLink.style.display = 'inline';
      const tryFp = async () => {
        const ok = await verifyFingerprintAndUnwrapDEK();
        if (ok) { registerSuccess(); finish(); }
        else { el('lock-error').textContent = 'Fingerprint not recognised — use your PIN below.'; }
      };
      fpBtn.onclick = tryFp;
      altLink.onclick = () => { fpBtn.style.display = 'none'; altLink.style.display = 'none'; };
      tryFp(); // attempt automatically on load; user can cancel and fall back to PIN
    } else {
      el('lock-fp-btn').style.display = 'none';
      el('lock-alt-link').style.display = 'none';
    }
  }

  function showSetup() {
    mode = 'setup-create'; pinBuffer = ''; firstPin = '';
    el('lock-title').textContent = 'Set up your PIN';
    el('lock-sub').textContent = `Choose a ${PIN_LENGTH}-digit PIN to protect your data`;
    el('lock-error').textContent = '';
    el('pin-pad').style.display = 'grid';
    el('pin-dots').style.display = 'flex';
    el('lock-fp-btn').style.display = 'none';
    el('lock-setup-note').style.display = 'block';
    el('lock-setup-note').textContent = 'Remember this PIN — your data is encrypted with a key derived from it, so it cannot be reset or recovered if forgotten. Use Settings → Export Backup regularly.';
    el('lock-skip-link').style.display = 'inline';
    el('lock-skip-link').textContent = 'Set up later — skip for now';
    el('lock-skip-link').onclick = () => finish();
    renderDots(0);
  }

  function boot(startAppFn) {
    onSuccess = startAppFn;
    renderPad();
    document.getElementById('lock-screen').classList.remove('hidden');
    if (hasPinSetup()) showUnlock(); else showSetup();
  }

  // Callable from Settings while the app is already unlocked (sessionDEK is already in
  // memory) — re-runs the WebAuthn creation ceremony and, if PRF is supported, wraps the
  // *current* session's DEK under it. Used both to let a Phase-1 install gain PRF support
  // it didn't have, and to let anyone re-enroll after e.g. changing their fingerprint.
  async function reEnrollFingerprint() {
    if (!sessionDEK) return { ok: false, reason: 'locked' };
    localStorage.removeItem(WEBAUTHN_CRED_KEY);
    localStorage.removeItem(DEK_WRAPPED_PRF_KEY);
    localStorage.removeItem(WEBAUTHN_PRF_SUPPORTED_KEY);
    return enrollFingerprint();
  }
  function removeFingerprint() {
    localStorage.removeItem(WEBAUTHN_CRED_KEY);
    localStorage.removeItem(DEK_WRAPPED_PRF_KEY);
    localStorage.removeItem(WEBAUTHN_PRF_SUPPORTED_KEY);
  }

  // Re-shows the lock overlay over the already-loaded app (handing your phone to
  // someone, stepping away, etc.) — the session's DEK stays valid in memory so no
  // re-decryption is needed once you unlock again; this is a UI gate, not a key
  // wipe, same threat model as Phase 1's original lock screen.
  function lockNow(afterUnlock) {
    if (!hasPinSetup()) return;
    const app = document.getElementById('app');
    if (app) app.style.visibility = 'hidden';
    onSuccess = () => {
      if (app) app.style.visibility = '';
      if (afterUnlock) afterUnlock();
    };
    document.getElementById('lock-screen').classList.remove('hidden');
    showUnlock();
  }

  return {
    boot, hasPinSetup, hasFingerprint, prfSupported, hasSessionKey,
    encryptPayload, decryptPayload, reEnrollFingerprint, removeFingerprint, lockNow, verifyPin,
    buildPortableBackup, decryptPortableBackup
  };
})();

/* ---------- Phase 3: silent auto-backup on app open ----------
   Per the original plan: a semi-automatic encrypted backup, downloaded straight to the
   phone's own Downloads folder on app open — no picker, no re-auth, and (unlike Item D's
   Netlify idea, which was explicitly dropped) nothing ever leaves the device. Throttled
   to once per calendar day via a plain localStorage date-stamp so opening the app
   repeatedly doesn't fill Downloads with duplicates.
   Deliberately skipped whenever Lock.hasSessionKey() is false (no PIN set up) — this
   should never silently drop an unencrypted financial dump into Downloads; someone who
   hasn't set up a PIN only gets backups via the manual buttons, same as before.
   Known, inherent platform limitation: the app can trigger a download but has no way to
   also delete its own older auto-backups from Downloads — cleanup/retention of these
   files is left to the user (or the phone's own downloads housekeeping). "Silent" means
   no confirmation dialog blocks the user, not that the file appears with zero trace —
   most browsers still show their own native download notification, which is expected. */
const AUTO_BACKUP_DATE_KEY = 'wl-last-auto-backup-date';
async function maybeRunAutoBackup() {
  if (!state.settings.autoBackup || !state.settings.autoBackup.enabled) return;
  if (!Lock.hasSessionKey()) return;
  const today = todayISO();
  if (localStorage.getItem(AUTO_BACKUP_DATE_KEY) === today) return;
  try {
    const backup = await Lock.buildPortableBackup(JSON.stringify(state));
    if (!backup) return;
    downloadTextFile(`wealth-ledger-auto-backup-${today}.json`, JSON.stringify(backup), 'application/json');
    localStorage.setItem(AUTO_BACKUP_DATE_KEY, today);
  } catch (e) {
    // Never let a failed silent backup block app startup or nag the user — the manual
    // Download Backup button in Settings remains the reliable fallback.
    console.warn('Silent auto-backup failed', e);
  }
}

async function init() {
  document.getElementById('asof-date').textContent = 'As of ' + fmtDate(todayISO());
  document.getElementById('storage-mode-label').textContent = usingArtifactStorage
    ? 'Data stored in the Claude workspace — synced through your Claude account.'
    : 'Data stored locally in this browser (localStorage + IndexedDB) — nothing leaves your device.';

  const loaded = await Storage.load();
  if (loaded) state = mergeLoadedState(loaded);

  applyThemePreference();
  applyPrivacyModePreference();
  document.getElementById('btn-cmdk-hint').onclick = openCommandPalette;
  document.querySelectorAll('#main-tabs button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.getElementById('main-tabs').addEventListener('keydown', (e) => {
    if (!['ArrowRight', 'ArrowLeft', 'Home', 'End'].includes(e.key)) return;
    const tabs = Array.from(document.querySelectorAll('#main-tabs button'));
    const i = tabs.indexOf(document.activeElement);
    if (i === -1) return;
    e.preventDefault();
    let next;
    if (e.key === 'ArrowRight') next = tabs[(i + 1) % tabs.length];
    else if (e.key === 'ArrowLeft') next = tabs[(i - 1 + tabs.length) % tabs.length];
    else if (e.key === 'Home') next = tabs[0];
    else if (e.key === 'End') next = tabs[tabs.length - 1];
    next.focus();
    switchTab(next.dataset.tab);
  });

  if (isAutoSnapshotDue()) await saveSnapshot(true);
  await maybeRunAutoBackup();

  renderAll();
  positionTabIndicator();
  if (typeof window.addEventListener === 'function') window.addEventListener('resize', positionTabIndicator);
  document.getElementById('app').classList.add('ready');
  maybeAutoRefreshLivePrices(); // fire-and-forget — deliberately not awaited so a slow/blocked network call never delays app open; re-renders itself when done
}

Lock.boot(init);

/* ---------- Service worker registration + non-silent update flow ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      // A worker already waiting from a previous visit (e.g. tab was open when
      // an update deployed) — surface it now.
      if (reg.waiting) showUpdateToast(reg);

      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // installed + there's already a controller => this is an update,
            // not the first install. Ask the user before doing anything.
            showUpdateToast(reg);
          }
        });
      });
    }).catch((e) => console.warn('Service worker registration failed', e));

    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

function showUpdateToast(reg) {
  let toast = document.getElementById('update-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'update-toast';
    toast.innerHTML = '<span class="msg">A new version is ready.</span><button class="btn btn-primary btn-sm" id="update-reload-btn">Reload</button>';
    document.body.appendChild(toast);
    document.getElementById('update-reload-btn').onclick = () => {
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
    };
  }
  requestAnimationFrame(() => toast.classList.add('show'));
}
</script>
