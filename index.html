    const f = emiAmount(principal, rate, tenureMonths) - emi;
    const h = 1e-4;
    const fPrime = (emiAmount(principal, rate + h, tenureMonths) - emiAmount(principal, rate, tenureMonths)) / h;
    if (Math.abs(fPrime) < 1e-9) break;
    const next = rate - f / fPrime;
    if (!isFinite(next)) break;
    if (Math.abs(next - rate) < 1e-6) { rate = next; break; }
    rate = next;
  }
  if (!isFinite(rate) || rate < 0 || rate > 100) return null;
  return rate;
}

/* ---------- Asset computations ---------- */
function assetQty(asset) {
  if (!asset.hasUnits) return null;
  return asset.transactions.reduce((q, t) => {
    if (t.type === 'buy') return q + (t.qty || 0);
    if (t.type === 'sell') return q - (t.qty || 0);
    return q;
  }, 0);
}
function assetInvested(asset) {
  // Net capital contributed (buys/contributions minus sells/withdrawals), i.e. cost basis still in the asset
  // Converted to base currency per-transaction — see toBaseCurrency() (this was defined in
  // Phase 1 alongside the `currency` field but never actually wired in until Phase 3).
  return asset.transactions.reduce((s, t) => {
    const amt = toBaseCurrency(t.amount || 0, asset.currency);
    if (t.type === 'buy' || t.type === 'contribution') return s + amt;
    if (t.type === 'sell' || t.type === 'withdrawal') return s - amt;
    return s;
  }, 0);
}
function assetCurrentValue(asset) {
  if (asset.hasUnits) {
    const qty = assetQty(asset);
    const price = asset.currentPrice || 0;
    return toBaseCurrency(Math.max(0, qty) * price, asset.currency);
  }
  if (asset.ledgerStyle) {
    // assetInvested() already converts each transaction — only the opening balance needs it here.
    return toBaseCurrency(asset.openingBalance || 0, asset.currency) + assetInvested(asset);
  }
  return toBaseCurrency(asset.currentValue || 0, asset.currency);
}
function assetCashflows(asset) {
  const cfs = asset.transactions.map(t => ({
    date: t.date,
    amount: (t.type === 'buy' || t.type === 'contribution') ? -toBaseCurrency(t.amount || 0, asset.currency) : toBaseCurrency(t.amount || 0, asset.currency)
  }));
  const cv = assetCurrentValue(asset);
  if (cv > 0) cfs.push({ date: todayISO(), amount: cv });
  return cfs;
}
function assetXIRR(asset) {
  if (!asset.transactions.length) return null;
  return xirr(assetCashflows(asset));
}
function assetHoldingYears(asset) {
  if (!asset.transactions.length) return null;
  const firstDate = asset.transactions.reduce((min, t) => t.date < min ? t.date : min, asset.transactions[0].date);
  return yearsBetween(firstDate, todayISO());
}
function assetCAGRApprox(asset) {
  if (!asset.transactions.length) return null;
  const yrs = assetHoldingYears(asset);
  const invested = assetInvested(asset);
  const current = assetCurrentValue(asset);
  if (yrs <= 0 || invested <= 0 || current <= 0) return null;
  return (Math.pow(current / invested, 1 / yrs) - 1) * 100;
}
function assetGainPct(asset) {
  const invested = assetInvested(asset);
  const current = assetCurrentValue(asset);
  if (invested <= 0) return null;
  return ((current - invested) / invested) * 100;
}

/* ---------- Asset-class (category) aggregation — Gain/Loss% and XIRR for the collapsed-group
   subtotal row on the Assets tab, computed the same way as the individual-asset figures rather
   than left blank. XIRR in particular can't just be averaged across holdings (that would ignore
   sizing and timing), so it's a proper category-wide XIRR: every asset's own cash flows (each
   buy/sell/contribution/withdrawal, plus its current value as a final inflow) pooled into one
   set and solved once — the same principle as overallPortfolioXIRR() below, just scoped to the
   assets in this one category. ---------- */
function categoryGainPct(assetsInCat, catInvested, catValue) {
  if (!assetsInCat.length || catInvested <= 0) return null;
  return ((catValue - catInvested) / catInvested) * 100;
}
function categoryCashflows(assetsInCat) {
  return assetsInCat.reduce((cfs, a) => cfs.concat(assetCashflows(a)), []);
}
function categoryXIRR(assetsInCat) {
  const withTx = assetsInCat.filter(a => a.transactions.length);
  if (!withTx.length) return null;
  // Exclude unconvertible (missing FX rate) legs rather than let one asset
  // null out the whole category's XIRR — see overallPortfolioXIRR().
  const cfs = categoryCashflows(withTx).filter(cf => Number.isFinite(cf.amount));
  return xirr(cfs);
}
function categoryHoldingYears(assetsInCat) {
  const withTx = assetsInCat.filter(a => a.transactions.length);
  if (!withTx.length) return null;
  const firstDate = withTx.reduce((min, a) => {
    const d = a.transactions.reduce((m, t) => t.date < m ? t.date : m, a.transactions[0].date);
    return d < min ? d : min;
  }, withTx[0].transactions[0].date);
  return yearsBetween(firstDate, todayISO());
}

/* ---------- Portfolio Intelligence: Liquidity & Risk ----------
   Liquidity/Risk are per-asset fields that default to a sensible category-based guess and
   are user-overridable — every other function reads through assetLiquidity()/assetRisk(),
   never `asset.liquidity`/`asset.risk` directly, so the inferred default applies uniformly
   to legacy assets (pre-Phase-1, CSV-imported) that don't have the field set at all. */
const ASSET_LIQUIDITY_LEVELS = ['Immediate', 'Short-term', 'Medium-term', 'Illiquid'];
const ASSET_LIQUIDITY_DEFAULTS = {
  'Savings Account': 'Immediate',
  'Listed Stocks': 'Short-term',
  'Mutual Funds': 'Short-term',
  'Gold': 'Short-term',
  'Silver': 'Short-term',
  'Cash Debt Given': 'Medium-term',
  'PPF': 'Illiquid',
  'NPS': 'Illiquid',
  'Insurance': 'Illiquid'
};
const ASSET_RISK_DEFAULTS = {
  'Savings Account': 1,
  'PPF': 1,
  'Insurance': 1,
  'NPS': 2,
  'Gold': 2,
  'Silver': 3,
  'Cash Debt Given': 3,
  'Mutual Funds': 3,
  'Listed Stocks': 4
};
const RISK_LABELS = ['—', 'Very Low', 'Low', 'Moderate', 'High', 'Very High'];
function inferLiquidity(category) { return ASSET_LIQUIDITY_DEFAULTS[category] || 'Medium-term'; }
function inferRisk(category) { return ASSET_RISK_DEFAULTS[category] || 3; }
function assetLiquidity(asset) { return asset.liquidity || inferLiquidity(asset.category); }
function assetRisk(asset) { return asset.risk || inferRisk(asset.category); }
function riskLabel(n) { return RISK_LABELS[n] || '—'; }
/* Risk is descriptive, not a sentiment judgment (a deliberate high-risk holding isn't
   "bad") — deliberately never routed through the green/red semantic engine, same
   reasoning the app already applies to Concentration (capped at "caution", never "adverse"). */

/* Contextual label for the generic `issuer` field — "who holds/issues this", used both as
   the Add-Asset form label and for grouping in issuerConcentration() below. */
function assetIssuerLabel(category) {
  if (category === 'Mutual Funds') return 'AMC';
  if (category === 'Savings Account') return 'Bank';
  return 'Issuer / Provider';
}

/* ---------- Expected Income & Maturity ---------- */
function expectedMonthlyIncome(asset) {
  const inc = asset.expectedIncome;
  if (!inc || !inc.amount || inc.type === 'None') return 0;
  const perYear = { monthly: 12, quarterly: 4, yearly: 1 }[inc.frequency] || 12;
  return (inc.amount * perYear) / 12;
}
function totalExpectedMonthlyIncome() { return state.assets.reduce((s, a) => s + expectedMonthlyIncome(a), 0); }
function upcomingMaturities() {
  const today = todayISO();
  return state.assets
    .filter(a => a.maturityDate && a.maturityDate >= today)
    .map(a => ({ label: a.name, sub: a.category, date: a.maturityDate, amount: assetCurrentValue(a) }))
    .sort((a, b) => new Date(a.date) - new Date(b.date));
}

/* ---------- Asset Tax Intelligence ----------
   Never fabricates a tax rate: returns null (rendered as "—") when the asset's own
   tax.stcgPct/ltcgPct isn't configured, rather than assuming 0% — this app has no business
   guessing India's current capital-gains rates, which change with tax law. */
function assetPotentialTax(asset) {
  const gain = assetCurrentValue(asset) - assetInvested(asset);
  if (gain <= 0) return 0;
  const yrs = assetHoldingYears(asset);
  const tax = asset.tax || {};
  const rate = (yrs !== null && yrs >= SHORT_HOLDING_YEARS) ? tax.ltcgPct : tax.stcgPct;
  if (!rate) return null;
  return gain * (rate / 100);
}

/* ---------- Goal-Based Portfolio Management ---------- */
function purposeAllocation() {
  const total = totalAssets();
  const byPurpose = {};
  state.assets.forEach(a => {
    const p = a.purpose || 'Unassigned';
    const v = assetCurrentValue(a);
    if (Number.isFinite(v)) byPurpose[p] = (byPurpose[p] || 0) + v;
  });
  return Object.entries(byPurpose).map(([purpose, value]) => ({ purpose, value, actualPct: total > 0 ? (value / total) * 100 : 0 }));
}
function goalAllocationRows() {
  const total = totalAssets();
  const actual = purposeAllocation();
  const purposeNames = new Set([...state.settings.purposes, ...actual.map(a => a.purpose)]);
  return [...purposeNames].map(purpose => {
    const targetPct = state.settings.targetAllocation[purpose] || 0;
    const found = actual.find(a => a.purpose === purpose);
    const actualPct = found ? found.actualPct : 0;
    const actualValue = found ? found.value : 0;
    const hasTarget = targetPct > 0;
    if (!hasTarget && !found) return null; // no target set and no assets assigned — nothing to show
    return {
      purpose, targetPct, actualPct,
      deviationPct: actualPct - targetPct,
      rebalanceAmount: (total * (targetPct / 100)) - actualValue
    };
  }).filter(Boolean).sort((a, b) => b.actualPct - a.actualPct);
}

/* ---------- Liability computations ---------- */
function creditCardOutstanding(card) {
  return card.bills.reduce((s, b) => s + (b.paid ? 0 : (b.amount - (b.paidAmount || 0))), 0);
}
function loanScheduledBalance(loan) {
  const sched = amortizationSchedule(loan.principal, loan.rate, loan.tenureMonths, loan.startDate, loan.interestType);
  const today = todayISO();
  const passed = sched.filter(s => s.date <= today);
  return passed.length ? passed[passed.length - 1].balance : loan.principal;
}
function loanActualBalance(loan) {
  // Walks actual logged payments in order, accruing simple daily interest on the running
  // balance between payments (at the loan's stated annual rate) before applying each
  // payment — so only the true principal portion of each payment reduces the balance.
  // This is an approximation (real EMI compounding conventions vary by lender), but it's
  // far more accurate than treating a whole EMI payment as principal repayment.
  // Flat-interest loans don't compound on a reducing balance at all — every payment carries
  // the same fixed interest slice (computed once, up front, over the full tenure) — so they
  // get their own simpler walk instead of the daily-rate reducing-balance approximation.
  const payments = (loan.payments || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
  let balance = loan.principal;
  if (loan.interestType === 'flat' && loan.tenureMonths) {
    const fixedInterestPerPayment = (loan.principal * ((loan.rate || 0) / 100) * (loan.tenureMonths / 12)) / loan.tenureMonths;
    payments.forEach(p => {
      const principalPortion = p.amount - fixedInterestPerPayment;
      balance = Math.max(0, balance - principalPortion);
    });
    return balance;
  }
  const dailyRate = (loan.rate || 0) / 100 / 365;
  let lastDate = loan.startDate;
  payments.forEach(p => {
    const days = Math.max(0, daysBetween(lastDate, p.date));
    const interestAccrued = balance * dailyRate * days;
    const principalPortion = p.amount - interestAccrued;
    balance = Math.max(0, balance - principalPortion);
    lastDate = p.date;
  });
  return balance;
}
function cashLoanOutstanding(cl) {
  const repaid = (cl.repayments || []).reduce((s, r) => s + (r.amount || 0), 0);
  let principalRemaining = Math.max(0, cl.principal - repaid);
  if (cl.rate && cl.rate > 0) {
    const yrs = yearsBetween(cl.startDate, todayISO());
    const simpleInterest = cl.principal * (cl.rate / 100) * Math.max(0, yrs);
    return Math.max(0, principalRemaining + simpleInterest - Math.max(0, repaid - (cl.principal - principalRemaining)));
  }
  return principalRemaining;
}

/* ---------- Debt Intelligence (§3.2) ----------
   "Good Debt" / "Bad Debt" is, unlike Risk in the Assets module, an intentional value
   judgment — that's the spec's own terminology — so this DOES route through the real
   green/red semantic engine (semanticClass('favorable'/'adverse')), unlike Risk which
   deliberately never does (see assetRisk()'s comment). Same field-or-inferred pattern as
   assetLiquidity()/assetRisk(): every consumer reads through loanDebtClass()/
   cashLoanDebtClass(), never `loan.debtClass` directly. */
const LOAN_DEBT_CLASS_DEFAULTS = {
  'Home Loan': 'Good',
  'Personal Loan': 'Bad',
  'EMI': 'Bad',
  'Vehicle Loan': 'Bad'
  // 'Other' has no confident default — stays null/"Unclassified" until the user sets it.
};
function inferDebtClass(category) { return LOAN_DEBT_CLASS_DEFAULTS[category] || null; }
function loanDebtClass(loan) { return loan.debtClass || inferDebtClass(loan.category); }
function cashLoanDebtClass(cl) { return cl.debtClass || null; } // no category to infer from — manual only
function debtClassSemantic(cls) { return cls === 'Good' ? 'favorable' : cls === 'Bad' ? 'adverse' : 'neutral'; }
function debtClassLabel(cls) { return cls || 'Unclassified'; }
/* Dashboard donut data — Credit Cards are unconditionally 'Bad' (see the CreditCard field
   comment above); Cash Loans use cashLoanDebtClass() (manual-only, defaults 'Unclassified'). */
function debtClassBreakdown() {
  const total = totalLiabilities();
  const buckets = { Good: 0, Bad: 0, Unclassified: 0 };
  state.loans.forEach(l => { buckets[loanDebtClass(l) || 'Unclassified'] += loanActualBalance(l); });
  state.cashLoans.forEach(cl => { buckets[cashLoanDebtClass(cl) || 'Unclassified'] += cashLoanOutstanding(cl); });
  buckets.Bad += state.creditCards.reduce((s, c) => s + creditCardOutstanding(c), 0);
  return ['Good', 'Bad', 'Unclassified']
    .map(label => ({ label: debtClassLabel(label === 'Unclassified' ? null : label), value: buckets[label], pct: total > 0 ? (buckets[label] / total) * 100 : 0, color: semanticColorVar(debtClassSemantic(label === 'Unclassified' ? null : label)) }))
    .filter(x => x.value > 0);
}

/* ---------- Credit Card Utilization (§3.4) ----------
   linkedEMIOutstanding (Item H): banks typically block out a card's credit limit for the
   remaining balance of any purchase converted to EMI, even though that EMI is tracked here
   as its own Loan entry (via loan.linkedCardId) rather than as a card bill. Utilization
   therefore has to add it back in — Total Owed does NOT, since the loan is already counted
   there on its own; adding it to card utilization too would double-count it in Total Owed
   if we weren't careful to keep this scoped to utilization only. */
function linkedEMIOutstanding(cardId) {
  return state.loans.filter(l => l.linkedCardId === cardId).reduce((s, l) => s + loanActualBalance(l), 0);
}
function creditCardUtilization(card) {
  if (!card.creditLimit) return null;
  return ((creditCardOutstanding(card) + linkedEMIOutstanding(card.id)) / card.creditLimit) * 100;
}
function creditUtilizationBand(pct) {
  if (pct === null) return { sem: 'neutral', label: 'No credit limit set' };
  if (pct < 30) return { sem: 'favorable', label: 'Healthy utilization' };
  if (pct < 50) return { sem: 'neutral', label: 'Moderate utilization' };
  if (pct < 75) return { sem: 'caution', label: 'High utilization' };
  return { sem: 'adverse', label: 'Very high utilization' };
}
function aggregateCreditUtilization() {
  const withLimit = state.creditCards.filter(c => c.creditLimit);
  if (!withLimit.length) return null;
  const totalOutstanding = withLimit.reduce((s, c) => s + creditCardOutstanding(c) + linkedEMIOutstanding(c.id), 0);
  const totalLimit = withLimit.reduce((s, c) => s + c.creditLimit, 0);
  return totalLimit > 0 ? (totalOutstanding / totalLimit) * 100 : null;
}

/* ---------- Debt Service Ratio (§3.4) ----------
   Cash Loans are deliberately excluded — they're ad hoc/informal with no fixed monthly
   commitment in this data model (unlike a Loan's clean EMI), so including them would mean
   fabricating a schedule that doesn't exist. Credit card monthly obligation is
   approximated as the average of each card's last 3 bills (actual bills vary month to
   month; there's no stored "minimum payment %" to use instead). */
function monthlyDebtObligations() {
  const loanEMIs = state.loans.reduce((s, l) => s + (l.tenureMonths ? emiAmount(l.principal, l.rate, l.tenureMonths, l.interestType) : 0), 0);
  const cardObligations = state.creditCards.reduce((s, c) => {
    const recent = [...c.bills].sort((a, b) => new Date(b.billDate) - new Date(a.billDate)).slice(0, 3);
    if (!recent.length) return s;
    return s + recent.reduce((sum, b) => sum + b.amount, 0) / recent.length;
  }, 0);
  return loanEMIs + cardObligations;
}
/* ---------- Effective monthly income (Cash Flow-aware) ----------
   Prefers a real average of logged income (Cash Flow tab) over the old single manual
   Settings figure, which becomes a fallback only used until at least one month of real
   data exists. This is what lets DSR (and anything else keyed off "monthly income")
   get more accurate for free as the Cash Flow module gets used. */
function loggedMonthlyIncomeAverage(monthsBack = 3) {
  const cutoff = addMonths(todayISO(), -monthsBack);
  const recent = (state.income || []).filter(e => e.date && e.date >= cutoff);
  if (!recent.length) return null;
  const byMonth = {};
  recent.forEach(e => { const k = e.date.slice(0, 7); byMonth[k] = (byMonth[k] || 0) + (e.amount || 0); });
  const months = Object.keys(byMonth);
  if (!months.length) return null;
  const total = months.reduce((s, k) => s + byMonth[k], 0);
  return total / months.length;
}
function effectiveMonthlyIncome() {
  const live = loggedMonthlyIncomeAverage(3);
  return { value: live !== null ? live : (state.settings.monthlyIncome || 0), isLive: live !== null };
}
function debtServiceRatio() {
  const eff = effectiveMonthlyIncome();
  if (!eff.value || eff.value <= 0) return null;
  return (monthlyDebtObligations() / eff.value) * 100;
}
function dsrBand(pct) {
  if (pct === null) return { sem: 'neutral', label: 'Log income in Cash Flow, or set a fallback in Settings' };
  if (pct < 20) return { sem: 'favorable', label: 'Healthy — low debt burden' };
  if (pct < 36) return { sem: 'neutral', label: 'Moderate debt burden' };
  if (pct < 43) return { sem: 'caution', label: 'Elevated debt burden' };
  return { sem: 'adverse', label: 'High debt burden' };
}

/* ---------- Totals & allocations ---------- */
// Uses baseCurrencySum() so one asset with an unconvertible foreign currency
// (missing FX rate — see toBaseCurrency()) can't blank the entire Net Worth
// display; that asset is excluded from the total and flagged separately via
// Health Check, while its own row still renders "—" for its value.
function totalAssets() { return baseCurrencySum(state.assets, a => assetCurrentValue(a)); }
function totalLiabilities() {
  const cc = state.creditCards.reduce((s, c) => s + creditCardOutstanding(c), 0);
  const ln = state.loans.reduce((s, l) => s + loanActualBalance(l), 0);
  const cl = state.cashLoans.reduce((s, c) => s + cashLoanOutstanding(c), 0);
  const bl = state.bills.reduce((s, b) => s + billOutstanding(b), 0);
  return cc + ln + cl + bl;
}
function netWorth() { return totalAssets() - totalLiabilities(); }

/* ---------- Executive Summary: largest holdings (spec 4.1) ----------
   Liabilities are three separate arrays (credit cards/loans/cash loans) with no shared
   shape — this unifies them into one comparable list rather than inventing a fourth
   parallel structure just for ranking. */
function largestAssets(n = 5) {
  return state.assets.slice()
    .map(a => ({ id: a.id, name: a.name, category: a.category, value: assetCurrentValue(a) }))
    .filter(a => a.value > 0)
    .sort((a, b) => b.value - a.value)
    .slice(0, n);
}
function largestLiabilities(n = 5) {
  const all = [
    ...state.creditCards.map(c => ({ id: c.id, kind: 'creditcards', name: c.name, category: 'Credit Card', value: creditCardOutstanding(c) })),
    ...state.loans.map(l => ({ id: l.id, kind: 'loans', name: l.name, category: l.category, value: loanActualBalance(l) })),
    ...state.cashLoans.map(c => ({ id: c.id, kind: 'cashloans', name: c.name, category: 'Cash Loan Taken', value: cashLoanOutstanding(c) })),
    ...state.bills.map(b => ({ id: b.id, kind: 'bills', name: b.name || b.category, category: b.category, value: billOutstanding(b) }))
  ];
  return all.filter(l => l.value > 0).sort((a, b) => b.value - a.value).slice(0, n);
}

/* ---------- Currency conversion ----------
   Every Asset carries a `currency` field (Phase 1), defaulting to baseCurrency for assets
   that never set one (a no-op below) — `assetInvested()`/`assetCurrentValue()` convert
   through this at read time (wired up in Phase 3; see context doc §15). Rates are entered
   manually in Settings (this app has no backend/API to fetch live FX), stored as "1 unit
   of `currency` = rate units of baseCurrency". */
function toBaseCurrency(amount, currency) {
  const base = state.settings.baseCurrency;
  if (!currency || currency === base) return amount;
  const rate = state.settings.exchangeRates[currency];
  // A missing/invalid rate must NEVER fall back to treating the amount as
  // already-in-base (a silent 1:1 conversion). Returning NaN here makes the
  // failure explicit and detectable at every call site; fmtINR/fmtNum/fmtPct
  // already render NaN as "—" instead of a wrong number, and summation call
  // sites explicitly exclude non-finite contributions (see baseCurrencySum())
  // so one missing rate can't silently corrupt a dashboard/report total.
  if (!Number.isFinite(rate) || rate <= 0) return NaN;
  return amount * rate;
}
// Sums an array through a value-getter that may return NaN (unconvertible
// due to a missing FX rate, per toBaseCurrency() above). Non-finite values
// are excluded from the total rather than silently included as 1:1 or
// allowed to poison the whole sum into NaN — see Phase 2 (FX safety).
function baseCurrencySum(items, getter) {
  return items.reduce((s, item) => {
    const v = getter(item);
    return s + (Number.isFinite(v) ? v : 0);
  }, 0);
}

/* ---------- Persistent category colors ----------
   Every category — asset or liability — gets the same color everywhere (donuts, legends,
   tables, the balance sheet) by taking a fixed, stable position in one shared ordered list,
   rather than a position that shifts depending on sort order or which chart is rendering. */
function categoryColorOrder() {
  return [...state.categoriesAssets, ...state.categoriesLiabilities];
}
function categoryColor(name) {
  const order = categoryColorOrder();
  const idx = order.indexOf(name);
  return PALETTE[(idx >= 0 ? idx : order.length) % PALETTE.length];
}

function assetAllocation() {
  const total = totalAssets();
  const byCategory = {};
  state.assets.forEach(a => {
    const v = assetCurrentValue(a);
    // Skip non-finite (unconvertible FX) values so one bad asset doesn't
    // poison — and thereby silently hide — its whole category's segment.
    if (!Number.isFinite(v)) return;
    byCategory[a.category] = (byCategory[a.category] || 0) + v;
  });
  return Object.entries(byCategory)
    .map(([label, value]) => ({ label, value, pct: total > 0 ? (value / total) * 100 : 0, color: categoryColor(label) }))
    .filter(x => x.value > 0)
    .sort((a, b) => b.value - a.value);
}
function liabilityAllocation() {
  const items = [];
  const ccTotal = state.creditCards.reduce((s, c) => s + creditCardOutstanding(c), 0);
  const lnTotal = state.loans.reduce((s, l) => s + loanActualBalance(l), 0);
  const clTotal = state.cashLoans.reduce((s, c) => s + cashLoanOutstanding(c), 0);
  if (ccTotal > 0) items.push({ label: 'Credit Card', value: ccTotal });
  if (lnTotal > 0) items.push({ label: 'Personal Loan / EMI', value: lnTotal });
  if (clTotal > 0) items.push({ label: 'Cash Loan Taken', value: clTotal });
  const total = items.reduce((s, i) => s + i.value, 0);
  return items.map(i => ({ ...i, pct: total > 0 ? (i.value / total) * 100 : 0, color: categoryColor(i.label) })).sort((a, b) => b.value - a.value);
}

function overallPortfolioXIRR() {
  let allCfs = [];
  state.assets.forEach(a => { allCfs = allCfs.concat(a.transactions.map(t => {
    const amt = toBaseCurrency(t.amount || 0, a.currency);
    return { date: t.date, amount: (t.type === 'buy' || t.type === 'contribution') ? -amt : amt };
  })); });
  // Exclude unconvertible (missing FX rate) legs from the pooled portfolio XIRR rather
  // than letting one bad leg (now non-finite, see toBaseCurrency()) null out the whole
  // result — the affected asset is separately flagged via Health Check.
  allCfs = allCfs.filter(cf => Number.isFinite(cf.amount));
  const cv = totalAssets();
  if (cv > 0) allCfs.push({ date: todayISO(), amount: cv });
  if (allCfs.length < 2) return null;
  return xirr(allCfs);
}
/* Same field-or-inferred style as assetLiquidity()/loanDebtClass() — reused for Goals
   (spec 4.5): XIRR computed only from cashflows of assets tagged with this purpose. */
function purposeXIRR(purpose) {
  let cfs = [];
  const assetsInPurpose = state.assets.filter(a => a.purpose === purpose);
  assetsInPurpose.forEach(a => { cfs = cfs.concat(assetCashflows(a)); });
  // Exclude unconvertible (missing FX rate) legs — see overallPortfolioXIRR().
  cfs = cfs.filter(cf => Number.isFinite(cf.amount));
  if (cfs.length < 2) return null;
  return xirr(cfs);
}

/* ---------- Portfolio Benchmarking (spec 4.4) ----------
   Never interpolates a value that isn't there: uses whichever pasted benchmark date is
   nearest on-or-before each endpoint, and reports the ACTUAL dates used (which may not
   exactly match fromDate/toDate) rather than silently claiming an exact-window number. */
function nearestBenchmarkOnOrBefore(date, seriesKey) {
  return state.settings.benchmarks
    .filter(b => b.date <= date && b[seriesKey] !== null && b[seriesKey] !== undefined)
    .sort((a, b) => new Date(b.date) - new Date(a.date))[0] || null;
}
function benchmarkReturn(seriesKey, fromDate, toDate) {
  const fromEntry = nearestBenchmarkOnOrBefore(fromDate, seriesKey);
  const toEntry = nearestBenchmarkOnOrBefore(toDate, seriesKey);
  if (!fromEntry || !toEntry || fromEntry.date === toEntry.date || !fromEntry[seriesKey]) return null;
  return {
    pct: ((toEntry[seriesKey] - fromEntry[seriesKey]) / fromEntry[seriesKey]) * 100,
    fromDate: fromEntry.date, toDate: toEntry.date
  };
}
/* Common currency codes for the Currency & Exchange Rates quick-add dropdown (Settings >
   Master Data). Not exhaustive by design — "Other" always lets you type any ISO code, this
   list just covers what most users will need without typing. */
const COMMON_CURRENCY_CODES = ['USD', 'EUR', 'GBP', 'AED', 'SGD', 'JPY', 'AUD', 'CAD', 'CHF', 'CNY', 'HKD', 'NZD'];

const BENCHMARK_SERIES = [
  { key: 'nifty', label: 'Nifty 50' },
  { key: 'sensex', label: 'Sensex' },
  { key: 'gold', label: 'Gold' },
  { key: 'fd', label: 'Fixed Deposit' },
  { key: 'inflation', label: 'Inflation' }
];
/* ---------- Wealth Composition: a coarser classification than category —
   Growth / Defensive / Liquid / Other for assets, Secured / Unsecured / Credit Card / Other
   for liabilities. Deliberately uses its own fixed categorical palette (not per-category
   colors, not sentiment colors) so this chart reads as a distinct dimension from both. */
const ASSET_COMPOSITION_MAP = {
  'Listed Stocks': 'Growth',
  'Mutual Funds': 'Growth',
  'Gold': 'Defensive',
  'Silver': 'Defensive',
  'PPF': 'Defensive',
  'NPS': 'Defensive',
  'Savings Account': 'Liquid'
};
const LOAN_COMPOSITION_MAP = {
  'Vehicle Loan': 'Secured',
  'Home Loan': 'Secured',
  'Personal Loan': 'Unsecured',
  'EMI': 'Unsecured'
};
const COMPOSITION_COLORS = {
  Growth: 'var(--chart-comp-growth)', Secured: 'var(--chart-comp-growth)',
  Defensive: 'var(--chart-comp-defensive)', Unsecured: 'var(--chart-comp-defensive)',
  Liquid: 'var(--chart-comp-liquid)', 'Credit Card': 'var(--chart-comp-liquid)',
  Other: 'var(--chart-comp-other)'
};
function compositionColor(label) { return COMPOSITION_COLORS[label] || COMPOSITION_COLORS.Other; }
function assetCompositionClass(category) { return ASSET_COMPOSITION_MAP[category] || 'Other'; }
function loanCompositionClass(loanCategory) { return LOAN_COMPOSITION_MAP[loanCategory] || 'Other'; }

function assetComposition() {
  const buckets = { Growth: 0, Defensive: 0, Liquid: 0, Other: 0 };
  state.assets.forEach(a => { const v = assetCurrentValue(a); if (Number.isFinite(v)) buckets[assetCompositionClass(a.category)] += v; });
  const total = Object.values(buckets).reduce((s, v) => s + v, 0);
  return ['Growth', 'Defensive', 'Liquid', 'Other']
    .map(label => ({ label, value: buckets[label], pct: total > 0 ? (buckets[label] / total) * 100 : 0, color: compositionColor(label) }))
    .filter(x => x.value > 0);
}
function liabilityComposition() {
  const buckets = { Secured: 0, Unsecured: 0, 'Credit Card': 0, Other: 0 };
  buckets['Credit Card'] = state.creditCards.reduce((s, c) => s + creditCardOutstanding(c), 0);
  state.loans.forEach(l => { buckets[loanCompositionClass(l.category)] += loanActualBalance(l); });
  buckets.Unsecured += state.cashLoans.reduce((s, c) => s + cashLoanOutstanding(c), 0);
  const total = Object.values(buckets).reduce((s, v) => s + v, 0);
  return ['Secured', 'Unsecured', 'Credit Card', 'Other']
    .map(label => ({ label, value: buckets[label], pct: total > 0 ? (buckets[label] / total) * 100 : 0, color: compositionColor(label) }))
    .filter(x => x.value > 0);
}

/* ---------- Portfolio Intelligence breakdowns (§2.2) ----------
   A third and fourth distinct visual dimension alongside category allocation and Wealth
   Composition. Liquidity reuses positional PALETTE colors the same way categoryColor()
   does (no green/red at those specific positions in practice, and "Illiquid" isn't
   inherently bad the way high concentration or high debt is). Risk gets its OWN palette
   that deliberately excludes --green/--orange/--red entirely — raw PALETTE includes those
   exact sentiment hexes at fixed positions, and risk level 4 landing on the same red used
   everywhere for "adverse" would read as a value judgment even though the color here is
   purely categorical. Risk is descriptive, never a sentiment (see assetRisk()'s comment). */
function assetLiquidityBreakdown() {
  const total = totalAssets();
  const buckets = {};
  state.assets.forEach(a => { const l = assetLiquidity(a); const v = assetCurrentValue(a); if (Number.isFinite(v)) buckets[l] = (buckets[l] || 0) + v; });
  return ASSET_LIQUIDITY_LEVELS.map((label, i) => ({ label, value: buckets[label] || 0, pct: total > 0 ? ((buckets[label] || 0) / total) * 100 : 0, color: PALETTE[i % PALETTE.length] }))
    .filter(x => x.value > 0);
}
const RISK_CHART_COLORS = ['var(--chart-risk-1)', 'var(--chart-risk-2)', 'var(--chart-risk-3)', 'var(--chart-risk-4)', 'var(--chart-risk-5)'];
function assetRiskBreakdown() {
  const total = totalAssets();
  const buckets = {};
  state.assets.forEach(a => { const r = assetRisk(a); const v = assetCurrentValue(a); if (Number.isFinite(v)) buckets[r] = (buckets[r] || 0) + v; });
  return [1, 2, 3, 4, 5].map((n, i) => ({ label: `${n} — ${riskLabel(n)}`, value: buckets[n] || 0, pct: total > 0 ? ((buckets[n] || 0) / total) * 100 : 0, color: RISK_CHART_COLORS[i] }))
    .filter(x => x.value > 0);
}

function overallInvested() { return baseCurrencySum(state.assets, a => assetInvested(a)); }
function overallEarliestTransactionDate() {
  let earliest = null;
  state.assets.forEach(a => a.transactions.forEach(t => { if (!earliest || t.date < earliest) earliest = t.date; }));
  return earliest;
}
function overallHoldingYears() {
  const earliest = overallEarliestTransactionDate();
  if (!earliest) return null;
  return yearsBetween(earliest, todayISO());
}
function overallCAGRApprox() {
  const invested = overallInvested();
  const current = totalAssets();
  if (invested <= 0 || current <= 0) return null;
  const yrs = overallHoldingYears();
  if (yrs === null || yrs <= 0) return null;
  return (Math.pow(current / invested, 1 / yrs) - 1) * 100;
}

/* ---------- Net worth period grouping (Indian financial year: April–March) ---------- */
function fyStartYearFor(dateStr) {
  const d = new Date(dateStr);
  const y = d.getFullYear(), m = d.getMonth(); // 0 = Jan
  return m >= 3 ? y : y - 1; // FY starts in April (month index 3)
}
function fyTag(fyStartYear) { return 'FY' + String(fyStartYear).slice(-2) + '-' + String(fyStartYear + 1).slice(-2); }
function periodKey(dateStr, granularity) {
  const d = new Date(dateStr);
  const y = d.getFullYear(), m = d.getMonth();
  if (granularity === 'monthly') return `${y}-${String(m + 1).padStart(2, '0')}`;
  const fyStart = fyStartYearFor(dateStr);
  const monthInFY = (m - 3 + 12) % 12; // 0 = April
  if (granularity === 'quarterly') return `${fyStart}-Q${Math.floor(monthInFY / 3) + 1}`;
  if (granularity === 'halfyearly') return `${fyStart}-H${Math.floor(monthInFY / 6) + 1}`;
  if (granularity === 'yearly') return `${fyStart}`;
  return `${y}-${String(m + 1).padStart(2, '0')}`;
}
function periodLabel(key, granularity) {
  if (granularity === 'monthly') {
    const [y, m] = key.split('-');
    return new Date(+y, +m - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' });
  }
  if (granularity === 'quarterly') { const [fy, q] = key.split('-Q'); return fyTag(+fy) + ' Q' + q; }
  if (granularity === 'halfyearly') { const [fy, h] = key.split('-H'); return fyTag(+fy) + ' H' + h; }
  if (granularity === 'yearly') return fyTag(+key);
  return key;
}
function aggregatedSnapshots(granularity, snapshotsOverride) {
  const sorted = [...(snapshotsOverride || state.snapshots)].sort((a, b) => new Date(a.date) - new Date(b.date));
  if (!granularity || granularity === 'raw') return sorted.map(s => ({ ...s, periodLabel: fmtDate(s.date) }));
  const byPeriod = {};
  sorted.forEach(s => {
    const key = periodKey(s.date, granularity);
    // keep the latest snapshot within each period as the representative point
    if (!byPeriod[key] || new Date(s.date) >= new Date(byPeriod[key].date)) byPeriod[key] = s;
  });
  return Object.keys(byPeriod)
    .map(k => ({ ...byPeriod[k], periodLabel: periodLabel(k, granularity) }))
    .sort((a, b) => new Date(a.date) - new Date(b.date));
}

/* ---------- Net worth trend period filters (1M/3M/6M/1Y/3Y/All) ---------- */
const TREND_PERIODS = [
  { key: '1M', months: 1 },
  { key: '3M', months: 3 },
  { key: '6M', months: 6 },
  { key: '1Y', months: 12 },
  { key: '3Y', months: 36 }
];
function periodCutoffDate(periodKey) {
  const def = TREND_PERIODS.find(p => p.key === periodKey);
  if (!def) return null; // 'All'
  return addMonths(todayISO(), -def.months);
}
function filterSnapshotsByPeriod(snapshots, periodKeyVal) {
  const cutoff = periodCutoffDate(periodKeyVal);
  if (!cutoff) return snapshots;
  return snapshots.filter(s => s.date >= cutoff);
}
/* Only offer a period button when the snapshot history actually spans that far back —
   showing a "3Y" filter over 2 months of data would just be a confusing no-op. */
function availableTrendPeriods() {
  const sorted = [...state.snapshots].sort((a, b) => new Date(a.date) - new Date(b.date));
  const options = [];
  if (sorted.length) {
    const spanYears = yearsBetween(sorted[0].date, todayISO());
    TREND_PERIODS.forEach(p => { if (spanYears >= p.months / 12) options.push(p.key); });
  }
  options.push('All');
  return options;
}
function trendDirectionSemantic(sortedSnaps) {
  if (sortedSnaps.length < 2) return 'neutral';
  const first = sortedSnaps[0].netWorth, last = sortedSnaps[sortedSnaps.length - 1].netWorth;
  if (last > first) return 'favorable';
  if (last < first) return 'adverse';
  return 'neutral';
}

/* ---------- Upcoming payments: next unpaid credit card bills + next EMI due per loan ---------- */
function upcomingPayments() {
  const items = [];
  const today = todayISO();
  state.creditCards.forEach(c => {
    c.bills.filter(b => !b.paid).forEach(b => {
      items.push({ label: c.name, sub: 'Credit Card Bill', date: b.dueDate, amount: Math.max(0, b.amount - (b.paidAmount || 0)), kind: 'creditcard', id: c.id });
    });
  });
  state.loans.forEach(l => {
    if (!l.tenureMonths || !l.principal) return;
    const sched = amortizationSchedule(l.principal, l.rate, l.tenureMonths, l.startDate, l.interestType);
    // Paid/unpaid, not just date: each logged payment retires the next unpaid installment in
    // sequence, so an EMI paid early (or late) actually moves off this list instead of sitting
    // here unchanged until its original due date passes.
    const paidCount = (l.payments || []).length;
    if (paidCount >= sched.length) return; // every installment already logged — nothing upcoming
    const next = sched[paidCount];
    if (next) items.push({ label: l.name, sub: 'Loan EMI', date: next.date, amount: next.emi, kind: 'loan', id: l.id });
  });
  state.bills.filter(b => b.status !== 'paid').forEach(b => {
    items.push({ label: b.name || b.category, sub: BILL_TYPE_CONFIG[b.type].noun, date: b.dueDate, amount: b.amount, kind: 'bill', id: b.id });
  });
  items.sort((a, b) => new Date(a.date) - new Date(b.date));
  return items;
}

/* ---------- EMI Calendar (spec 3.4) ----------
   Unlike upcomingPayments() (one "next" item per loan, for the Dashboard's compact list),
   this walks the FULL amortization schedule within the window — a calendar needs every
   installment, not just the next one. Credit Cards only ever show bills already logged
   (no fabricated future amounts — bill amounts vary and aren't schedule-driven the way an
   EMI is). Cash Loans are excluded — no fixed schedule exists for them (see context doc). */
function upcomingObligationsGrouped(monthsAhead = 6) {
  const today = todayISO();
  const cutoff = addMonths(today, monthsAhead);
  const items = [];
  state.creditCards.forEach(c => {
    c.bills.filter(b => !b.paid && b.dueDate >= today && b.dueDate <= cutoff).forEach(b => {
      items.push({ label: c.name, sub: 'Credit Card Bill', date: b.dueDate, amount: Math.max(0, b.amount - (b.paidAmount || 0)) });
    });
  });
  state.loans.forEach(l => {
    if (!l.tenureMonths || !l.principal) return;
    const sched = amortizationSchedule(l.principal, l.rate, l.tenureMonths, l.startDate, l.interestType);
    // Same paid/unpaid logic as upcomingPayments() — skip installments already covered by a
    // logged payment (by sequence), only the remainder are genuinely "upcoming".
    const paidCount = (l.payments || []).length;
    sched.slice(paidCount)
      .filter(s => s.date >= today && s.date <= cutoff)
      .forEach(s => items.push({ label: l.name, sub: 'Loan EMI', date: s.date, amount: s.emi }));
  });
  state.bills.filter(b => b.status !== 'paid' && b.dueDate >= today && b.dueDate <= cutoff).forEach(b => {
    items.push({ label: b.name || b.category, sub: BILL_TYPE_CONFIG[b.type].noun, date: b.dueDate, amount: b.amount });
  });
  items.sort((a, b) => new Date(a.date) - new Date(b.date));
  const byMonth = {};
  items.forEach(it => {
    const key = it.date.slice(0, 7);
    (byMonth[key] = byMonth[key] || []).push(it);
  });
  return Object.keys(byMonth).sort().map(key => ({
    monthKey: key,
    monthLabel: new Date(key + '-02').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }),
    items: byMonth[key],
    total: byMonth[key].reduce((s, it) => s + it.amount, 0)
  }));
}

/* ---------- Monthly Cashflow Statement (spec 4.3) ----------
   A personal-cashflow view, not to be confused with assetInvested()'s cost-basis framing:
   money OUT here means cash left your pocket (buys/contributions into assets, EMI/bill/
   repayment obligations paid); money IN means cash came back to you (sells/withdrawals).
   Only bills actually marked paid count as an outflow (an unpaid bill hasn't left your
   pocket yet — it's already covered as a future obligation by upcomingObligationsGrouped). */
function monthlyCashflow(monthsBack = 12) {
  const cutoff = addMonths(todayISO(), -monthsBack);
  const byMonth = {};
  function bucket(date) {
    if (!date || date < cutoff) return null;
    const key = periodKey(date, 'monthly');
    if (!byMonth[key]) byMonth[key] = { key, label: periodLabel(key, 'monthly'), in: 0, out: 0 };
    return byMonth[key];
  }
  state.assets.forEach(a => {
    a.transactions.forEach(t => {
      const b = bucket(t.date);
      if (!b) return;
      const amt = toBaseCurrency(t.amount || 0, a.currency);
      if (!Number.isFinite(amt)) return; // unconvertible FX — excluded, not silently 1:1
      if (t.type === 'buy' || t.type === 'contribution') b.out += amt;
      else if (t.type === 'sell' || t.type === 'withdrawal') b.in += amt;
    });
  });
  state.loans.forEach(l => (l.payments || []).forEach(p => { const b = bucket(p.date); if (b) b.out += p.amount; }));
  state.creditCards.forEach(c => c.bills.forEach(bill => {
    if (bill.paid && bill.paidDate) { const b = bucket(bill.paidDate); if (b) b.out += bill.paidAmount || bill.amount; }
  }));
  state.cashLoans.forEach(cl => (cl.repayments || []).forEach(r => { const b = bucket(r.date); if (b) b.out += r.amount; }));
  return Object.keys(byMonth).sort().map(k => ({ ...byMonth[k], net: byMonth[k].in - byMonth[k].out }));
}

/* ---------- Liquidity Health: liquid assets vs. obligations due soon ---------- */
/* Reads assetLiquidity() (per-asset, user-overridable) rather than the coarser
   category-based Wealth Composition bucket — same default outcome (Savings Account still
   infers "Immediate"), but now correct for e.g. a stock held specifically as an emergency
   fund, or a savings account earmarked as illiquid. */
function liquidAssetsTotal() {
  return baseCurrencySum(state.assets, a => (assetLiquidity(a) === 'Immediate' ? assetCurrentValue(a) : 0));
}
function obligationsDueWithin(days) {
  const cutoff = addDays(todayISO(), days);
  return upcomingPayments().reduce((s, p) => s + (p.date <= cutoff ? p.amount : 0), 0);
}
function liquidityCoverage(days) {
  const liquid = liquidAssetsTotal();
  const due = obligationsDueWithin(days);
  if (due <= 0) return { liquid, due, ratioPct: null }; // nothing due — coverage is moot, not "infinite good"
  return { liquid, due, ratioPct: (liquid / due) * 100 };
}
function liquidityBand(ratioPct) {
  if (ratioPct === null) return { sem: 'favorable', label: 'No near-term obligations' };
  if (ratioPct < 50) return { sem: 'adverse', label: 'Coverage shortfall' };
  if (ratioPct < 100) return { sem: 'caution', label: 'Tight coverage' };
  if (ratioPct < 200) return { sem: 'neutral', label: 'Adequate coverage' };
  return { sem: 'favorable', label: 'Well covered' };
}

/* ---------- Concentration Risk: dominant single asset, category, or issuer exposure ----------
   Flagged for awareness, never escalated to "adverse" — concentration can be a deliberate
   choice, not a mistake, so the color scale tops out at caution. */
/* Groups assets by their `issuer` field (e.g. the same AMC across several mutual funds,
   or the same bank across several deposits) — a concentration angle plain category
   allocation misses, since those holdings can sit in the same or different categories. */
function issuerConcentration() {
  const total = totalAssets();
  if (total <= 0) return null;
  const byIssuer = {};
  state.assets.forEach(a => {
    if (!a.issuer) return;
    const key = a.issuer.trim().toLowerCase();
    if (!key) return;
    const v = assetCurrentValue(a);
    if (!Number.isFinite(v)) return; // unconvertible FX — excluded, not silently 1:1
    if (!byIssuer[key]) byIssuer[key] = { label: a.issuer.trim(), value: 0 };
    byIssuer[key].value += v;
  });
  const top = Object.values(byIssuer).sort((a, b) => b.value - a.value)[0];
  return top ? { label: top.label, pct: (top.value / total) * 100 } : null;
}
function concentrationRisk() {
  const total = totalAssets();
  if (total <= 0) return null;
  let topAsset = null, topAssetPct = 0;
  state.assets.forEach(a => {
    const pct = (assetCurrentValue(a) / total) * 100;
    if (pct > topAssetPct) { topAssetPct = pct; topAsset = a; }
  });
  const alloc = assetAllocation();
  const topCategory = alloc.length ? alloc[0] : null;
  const topCategoryPct = topCategory ? topCategory.pct : 0;
  const topIssuer = issuerConcentration();
  const topIssuerPct = topIssuer ? topIssuer.pct : 0;
  const candidates = [
    { type: 'asset', label: topAsset ? topAsset.name : '—', pct: topAssetPct },
    { type: 'category', label: topCategory ? topCategory.label : '—', pct: topCategoryPct },
    { type: 'issuer', label: topIssuer ? topIssuer.label : '—', pct: topIssuerPct }
  ];
  return candidates.reduce((best, c) => (c.pct > best.pct ? c : best), candidates[0]);
}
function concentrationBand(pct) {
  if (pct < 25) return { sem: 'favorable', label: 'Well diversified' };
  if (pct < 40) return { sem: 'neutral', label: 'Moderately concentrated' };
  if (pct < 60) return { sem: 'caution', label: 'Concentrated' };
  return { sem: 'caution', label: 'Highly concentrated' };
}

/* Category/composition chart palette — deliberately desaturated (~60% saturation) relative
   to the semantic gain/loss/warning palette (--green/--red/--orange/--gold/--blue above).
   Two colors can still share a hue (a category might land near "greenish"), but the semantic
   palette stays visibly more saturated/vivid, so the eye can tell "this is a directional
   signal" from "this is just category #4" even when hues are close. See Phase 2 audit §8. */
const PALETTE = ['#B09864', '#869BD5', '#609B7D', '#C67C76', '#B69BC7', '#74AAB4', '#C6A476', '#8F95A4', '#90C8AE', '#C48FA3'];

/* ===================== SVG CHARTS ===================== */

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs || {}).forEach(([k, v]) => el.setAttribute(k, v));
  return el;
}

/* ---------- Floating tooltip shared by all charts ---------- */
function ensureChartTooltip() {
  let t = document.getElementById('chart-tooltip');
  if (!t) {
    t = document.createElement('div');
    t.id = 'chart-tooltip';
    document.body.appendChild(t);
  }
  return t;
}
function showChartTooltip(evt, html) {
  const t = ensureChartTooltip();
  t.innerHTML = html;
  t.classList.add('show');
  moveChartTooltip(evt);
}
function moveChartTooltip(evt) {
  const t = document.getElementById('chart-tooltip');
  if (!t || !evt) return;
  const x = (evt.clientX || 0) + 16, y = (evt.clientY || 0) + 16;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function hideChartTooltip() {
  const t = document.getElementById('chart-tooltip');
  if (t) t.classList.remove('show');
}

/* ---------- Gauge arc math (semicircle sweeping left-to-right over the top) ---------- */
function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function describeArc(cx, cy, r, startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, startAngle);
  const end = polarToCartesian(cx, cy, r, endAngle);
  const largeArcFlag = (endAngle - startAngle) <= 180 ? '0' : '1';
  return `M ${start.x} ${start.y} A ${r} ${r} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`;
}

/* ---------- Shared decorative icon for empty states (a small ledger book) ---------- */
function emptyStateIcon() {
  return `<svg class="empty-icon" width="38" height="38" viewBox="0 0 40 40" fill="none">
    <rect x="6" y="8" width="28" height="24" rx="2" stroke="var(--gold-soft)" stroke-width="1.4"/>
    <line x1="20" y1="8" x2="20" y2="32" stroke="var(--gold-soft)" stroke-width="1.4"/>
    <line x1="10" y1="14" x2="17" y2="14" stroke="var(--border)" stroke-width="1.2"/>
    <line x1="10" y1="19" x2="17" y2="19" stroke="var(--border)" stroke-width="1.2"/>
    <line x1="10" y1="24" x2="17" y2="24" stroke="var(--border)" stroke-width="1.2"/>
    <line x1="23" y1="14" x2="30" y2="14" stroke="var(--border)" stroke-width="1.2"/>
    <line x1="23" y1="19" x2="30" y2="19" stroke="var(--border)" stroke-width="1.2"/>
